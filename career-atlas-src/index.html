026-09-04）","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20260903163254718082","date":"2026-09-04"},{"t":"中国建设银行2027年度校园招聘统一笔试及性格测评公告（建行官网）","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20261020092404778535","date":"2026-10-20"},{"t":"中国工商银行2027年度校园招聘启事（北京本地宝转载官网公告）","url":"http://bj.bendibao.com/job/gongkao/exam158072.html","date":"2026-09-04"},{"t":"2027 Bank of China Global Campus Recruitment（中国银行官网）","url":"https://www.boc.cn/en/bocinfo/bi7/202609/t20260903_25689313.html","date":"2026-09-03"},{"t":"招商银行总行、分行及子公司2027校园招聘公告（上岸Claw聚合转载）","url":"https://www.shanganclaw.com/announcements/170336/","date":"2026-08-31"},{"t":"商业银行流动性风险管理办法（国务院公报，中国政府网）","url":"https://www.gov.cn/gongbao/content/2018/content_5312246.htm","date":"2018-08"},{"t":"校招 招商银行总行 管培生 面经（牛客网）","url":"https://www.nowcoder.com/discuss/353159302493970432","date":"2022-03-09"},{"t":"国有银行总行部门简析（牛客网，仅读到标题与摘要：总行部门分个人金融、公司金融、资金资管、风险管理、服务支撑、金融科技等板块）","url":"https://www.nowcoder.com/discuss/425326276539375616","date":"2022"}],"qn":12},{"id":"bank.hq.corp","group":"bank","org_type":"银行总行","role":"银行总行·公司金融/投行业务","work":"总行公司金融、投资银行、交易银行等部门管的是全行对公业务的产品、政策、大客户和考核，不是在分行逐笔做贷款。典型分工有四块：一是对公产品与信贷政策（流动资金贷款、项目贷款、并购贷款、银团、供应链金融、贸易融资的产品方案、定价和行业投向指引）；二是投资银行业务（银行间债务融资工具承销、财务顾问、并购融资、资产证券化与结构化融资，对接内部授信审批）；三是战略客户与大客户综合金融方案（为央企、行业龙头做授信、结算、现金管理、跨境和债券的组合方案）；四是对分行的业务指导、考核和重大项目协同，并落实科技、绿色、普惠、养老、数字“五篇大文章”的统计与考核。向部门总经理和主管行领导汇报；考核看规模与结构（中长期、重点领域占比）、综合回报、收入（含投行手续费）、资产质量和项目落地（岗位职责归纳，非官方定义）。以工行2026年上半年为例：公司金融分部营业收入2219.45亿元，占47.7%，税前利润1066.70亿元，占50.8%；投资银行业务手续费及佣金收入144.68亿元，占营业收入3.11%（自算），说明对公是利润引擎，投行更像客户经营的入口。","typical_day":["早上看客户与行业舆情、债券发行窗口和信用利差、重点客户的授信使用情况（典型日程由岗位职责归纳，不是实测）","白天与分行客户经理、授信审批部门和风险部门对接：客户方案、定价底线、审批条件","参加客户拜访或方案讨论会，准备财务数据底稿和产品组合（债务融资工具、并购贷款、供应链金融、现金管理）","月度和季度写对公业务运行分析，盯中长期贷款占比、重点领域贷款、投行收入和不良生成，向领导汇报","债券发行窗口期、年末和重大项目落地节点工作量最大（推断）"],"wlb":{"score":3,"text":"判断分3，没有读到总行公司金融或投行岗位的一手工时数据。推断依据：总行产品和政策岗的节奏比分行营销稳定，但投行与重大项目岗位受发行窗口、客户项目和领导临时安排牵动，窗口期、季末和年末会集中加班。二手参考：中信银行总行中后台岗位被描述为‘稳定性很好，但强度略大一些’（豆瓣豆列，2024-05，股份行样本，不是国有大行）。券商投行强度更高是常见说法，本次未读到可靠数据，不作比较。真实强度以面试时向在职同事核实为准。","grade":"E3","src":[{"t":"银行总行中后台岗位强度的二手描述（豆瓣豆列）","url":"https://www.douban.com/doulist/133143028/","date":"2024-05"}]},"growth":{"score":4,"text":"判断分4，依据官方培养安排加推断。建行总部2027届公告：新员工培养锻炼2年，第1年在一级分行营业网点及对公、对私、风险管理等条线轮岗，第2年由总行录用部门主导，在处室、直属机构、重大项目团队等轮岗（官网公告，E1）；招行总行管培生涵盖公司金融、零售金融、投行与金融市场等方向（招行公告转载，E2）。成长路径（推断）：专员、主管或副经理、经理、部门副职。横向可去风险管理、资产负债管理、金融市场、战略客户或分行公司业务条线，也可去银行系投行、租赁、基金、信托子公司。壁垒是授信理解、产品设计和大客户关系三者的组合；国有大行薪酬受监管约束，涨幅平缓，成长更多体现在职级和平台，晋升依赖部门编制和行内竞聘。"},"salary":{"range":"首年总包约20–32万元（税前，含绩效；总行管培口径，推断，E3）；股份制银行总行可能偏上沿","basis":"E3推断，官方未披露应届总行薪酬，也未读到总行公司金融或投行岗位的单列数据。交叉验证：一，上市银行2025年报人均薪酬（员工费用口径，E2，全员含管理层和资深员工，不等于应届）：交行44.97万、中行38.43万、农行37.0万、建行36.12万、工行35.5至35.74万、邮储33.61万，招行工资及奖金口径43.33万；应届起薪明显低于人均，不能直接当作offer。二，二手应届样本（城商行，E3）：杭州银行总行管培约21万（2023年，搜狐学习频道个人讲述）。三，用户笔记称‘央企金融子公司25–35W’，与本区间有重叠，但无法证实，只能标为二手传闻。四，投行条线的奖金弹性是否高于普通对公岗，没有读到数据，不作判断。区间下沿取城商行样本，上沿取人均薪酬打折后的估计，仅供谈薪参考，以书面offer为准。","grade":"E3","src":[{"t":"六大行人均薪酬全部出炉，交行大幅领先（搜狐号，据2025年年报整理）","url":"https://www.sohu.com/a/1005419792_121948396","date":"2026-04-04"},{"t":"六大行2025年人均薪酬大揭秘（新浪财经转载）","url":"https://finance.sina.com.cn/wm/2026-04-01/doc-inhsywsx8490240.shtml","date":"2026-04-01"},{"t":"招商银行2025年人均薪酬（东方财富财富号）","url":"https://caifuhao.eastmoney.com/news/20260331204855249895810","date":"2026-03-31"},{"t":"我，985本科生，入职杭州银行总行，管培生（搜狐学习频道，二手个人讲述，摘要）","url":"https://learning.sohu.com/a/678662774_121124331","date":"2023-05"}]},"intern_fit":"对口实习：银行总行或分行的公司金融部、投资银行部、交易银行部、机构业务部日常实习（多为部门内推）；分行公司业务部；工银国际、建银国际等银行系投行子公司；券商债券承销、固收和并购岗；央企财务公司。你已有经历可迁移：工行公司银行部的制造业对公信贷尽调（收入质量、现金流、应收周期、第一还款来源）与对公授信和客户方案最贴近，是最大加分项；安永华明咨询的即时零售买方尽调（GMV＝订单量×客单价）对应并购尽调与估值逻辑；光大证券TMT研究部的三表与估值模型4–6轮假设修订，对应客户财务分析。缺口是没有债券承销或并购交易的一线经历，建议补一段券商债券承销、银行投行或资本市场实习，或用本题库的贷款与发债成本比较（bank1-45）、大客户综合金融方案（bank1-43）两题做成可展示的作业，只使用公开数据。","requirements":"学历：建行总部2027届要求硕士研究生及以上（官网公告，E1）；招行校招本科及以上可报，英语本科生四级425分、研究生六级425分，雅思5.5分或托福70分可替代四级，雅思6分或托福80分可替代六级（招行公告转载，E2）；工行、中行、农行总行的学历要求以官网为准，本次未逐一核实。专业：经济金融、会计、法律、数理统计、管理类优先；建行公告专业以计算机、电子信息、数理统计、其他理工、经济金融、管理会计、法律、外语、新闻类为主。英语：建行要求六级425分以上，或托业715、托福85、雅思6.5。技能：财务报表与信用分析、行业研究、Excel与PPT，了解债务融资工具、并购贷款、供应链金融等产品。院校：公告未写院校门槛，二手说法偏重名校，未核实。","process":"流程以建行2027总部校招和招行2027校招为例。建行（官方公告）：网申（每人最多2个志愿，2026-10-08 24:00截止）→统一笔试（线下，初步定于2026年10月底，综合类含经济学、财政金融学、货币银行学、会计学、法律、营销、管理、数理统计等，成绩在总部、直属机构、分支机构及综合化子公司通用）→面试→体检→录用。招行（公告转载）：AI面试→统一在线笔试（第一批2026年9月中下旬，第二批2026年10月中下旬）→后续考察；总行管培生涵盖公司金融、零售金融、投行与金融市场等方向。面试形式见牛客：总行管培生常见半结构化加无领导小组讨论，逐一提问‘为什么想来工行、职业规划是什么’（工行总行管培生暑期实习面经，2024-05）；‘为什么选择来银行工作、对投递岗位的看法’（19题高频帖摘要，2023-11）。公司金融专业面常见：授信审批要点、债务融资工具承销、并购贷款、供应链金融、科技金融与五篇大文章，见本题库bank1-37至bank1-48。常见淘汰点（推断）：笔试线；群面缺少结构化发言；对对公业务的理解停留在概念；对轮岗和下分行的接受度。","exit":"内部：专员、主管、经理、部门副职；横向去风险管理、资产负债管理、金融市场、战略客户或分行公司业务条线，也可去银行系投行、租赁、基金、信托子公司。外部：券商投行与债券承销、央企财务公司、产业集团的融资和资本运营岗、保险资管、信托和监管部门（推断）。第一份offer建议争取公司金融、投资银行或交易银行类入口岗，轮岗时主动申请授信审批和风险条线，补全信用判断。","batches":"2027届秋招网申多数已截止：建行总部网申截止2026-10-08 24:00，总行本部计划100人（北京）、信用卡中心10人（上海），具体部门与人数在岗位需求表附件（PDF）中，本次未读到（官网公告，E1）；招行总行管培统一在线笔试第二批在2026年10月中下旬（公告转载，E2）；工行网申2026-09-04至10-08，总行本部约100人（二手，E3，以官网为准）；中行网申截止10月9日，总行管培生设6个专项方向，一般实践培训1年（官网，E1）；邮储、交行、农行总行的批次与HC见各行官网，本次未逐一核实。总行公司金融和投行岗位的单列HC官方未公布。对2027届同学，这一批网申已截止，需关注补录、春招和日常实习。","certs":"无硬性要求。银行业专业人员职业资格（初级）、CFA、FRM、初级会计和CPA为加分项（推断）；证券从业资格对银行投行岗不是硬性要求（推断），对债券、并购规则的熟悉度比证书更常被问到。","cities":["北京","上海","深圳"],"sample_orgs":["工商银行总行","农业银行总行","中国银行总行","建设银行总部","交通银行总行","邮储银行总行","招商银行总行"],"src":[{"t":"中国建设银行总部2027年度校园招聘公告（建行官网诚聘英才公告接口，已读全文）","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20260903163254718082","date":"2026-09-04"},{"t":"招商银行2027校园招聘公告（上岸Claw聚合转载，已读正文：总行管培生含公司金融、投行与金融市场方向，笔试批次，英语要求）","url":"https://www.shanganclaw.com/announcements/170336/","date":"2026-08-31"},{"t":"2027 Bank of China Global Campus Recruitment（中国银行官网）","url":"https://www.boc.cn/en/bocinfo/bi7/202609/t20260903_25689313.html","date":"2026-09-03"},{"t":"中国工商银行2027年度校园招聘启事（北京本地宝转载官网公告）","url":"http://bj.bendibao.com/job/gongkao/exam158072.html","date":"2026-09-04"},{"t":"中国工商银行2026半年度报告（东方财富公告库原文：公司金融分部、投资银行业务手续费）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608281828626875&client_source=web&page_index=5","date":"2026-08-28"},{"t":"工商银行暑期实习面经 | 总行管培生（牛客网，已读摘要：逐一提问为什么想来工行、职业规划）","url":"https://www.nowcoder.com/discuss/617108965842804736","date":"2024-05"},{"t":"19个银行高频面试题！1、为什么选择来银行工作？（牛客网，已读摘要，正文为动态渲染页面）","url":"https://www.nowcoder.com/discuss/550078442277007360","date":"2023-11"},{"t":"中国人民银行《2026年三季度金融机构贷款投向统计报告》","url":"https://www.pbc.gov.cn/goutongjiaoliu/113456/113469/2026102815121914211/index.html","date":"2026-10-28"}],"qn":12},{"id":"bank.hq.fm","group":"bank","org_type":"银行总行","role":"银行总行·金融市场部（交易/投资/销售）","work":"总行金融市场部是银行资产负债表与金融市场之间的接口，通常分三个序列。交易序列做本币债券和外汇的做市与自营，盯盘报价，控制DV01与止损，考核日度盈亏和限额占用；投资序列管理摊余成本、FVOCI、FVTPL三个债券账户，按资产负债管理部下达的久期和规模要求配置债券、同业存单并用衍生品对冲，考核票息、公允价值损益和资本占用；销售序列面向企业和金融机构客户，提供外汇远期、掉期、期权以及债券和衍生品方案，考核客户收入。三个序列向部门总经理和资产负债管理委员会汇报，受风险管理部和计划财务部的限额与估值约束。参照工行2026年上半年报，资金业务分部营业收入66,595百万元、税前利润52,429百万元，高于个人金融分部的46,978百万元，是大行利润的重要来源（E1）。","typical_day":["早盘前：看隔夜美债与央行公开市场公告，核对头寸、备付金和当日大额清算，判断当日资金面（岗位职责归纳，不是实测）","盘中：交易序列盯银行间现券与国债期货报价并处理客户询价；投资序列在账户限额内分批建仓或调仓；销售序列给客户出远期结汇、掉期报价","午后：与资产负债管理部、风险管理部沟通DV01、久期和限额占用，安排国债发行与缴款日的头寸","收盘后：估值核对、盈亏归因（久期、利差、对冲），写日报并更新压力测试","月末、季末：跨季资金紧、政府债缴款集中，要提前锁定资金；同时统计账户分类和利润目标进度（推断）"],"wlb":{"score":3,"text":"判断分3，证据弱。国有大行总行金融市场部没有公开的工时数据。能找到的旁证都是二手：中信银行总行中后台岗被猎头描述为稳定性很好、强度略大（豆瓣豆列，2024-05，股份行样本）；四川银行总行管培的知乎回答称加班比较严重（城商行样本，个人感受）。我的推断：盘中要盯市，月末、季末跨季资金紧和政府债缴款日会加班，强度高于总行综合管理岗，但低于需要路演和对外报告的券商投行。用户笔记里「银行金市」只有名称，没有强度数据，这一条仍是推断。","grade":"E3","src":[{"t":"豆瓣豆列：银行总行中后台岗位强度的二手描述（中信总行，搜索摘要）","url":"https://www.douban.com/doulist/133143028/","date":"2024-05"},{"t":"知乎问答：城商行总行管培与金融市场部应届起薪传闻（搜索摘要，原页403）","url":"https://www.zhihu.com/question/392926139/answer/3200376894","date":"2023-2024"}]},"growth":{"score":4,"text":"判断分4。路径：管培生或专业岗入职，先经基层或分行轮岗（建行总部2027公告写明培养锻炼2年，第1年一级分行下派，第2年总行录用部门主导轮岗；中行总行管培生一般1年实践培训，且设有金融市场专项方向和上海人民币交易总部专项），再定岗到交易、投资或销售序列，之后是主管、处室负责人、部门副总。技能壁垒较高：账户分类与资本占用、DV01与对冲、外汇衍生品定价，这些是跳槽的硬通货。薪酬成长上，交易和投资序列的绩效弹性大于综合管理岗（推断）。出口见exit字段。","grade":"E1","src":[{"t":"建设银行《中国建设银行总部2027年度校园招聘公告》（官网公告接口，培养锻炼2年）","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20260903163254718082","date":"2026-09-04"},{"t":"中国银行2027全球校园招聘公告（总行管培生六个专项方向含金融市场；上海人民币交易总部）","url":"https://www.boc.cn/en/bocinfo/bi7/202609/t20260903_25689313.html","date":"2026-09-03"}]},"salary":{"range":"首年税前总包约20–30万元（推断，E3，不是offer预期）","basis":"没有国有大行总行金融市场部应届生的一手薪酬数据（账本QBANK1-SAL-FRESH-BIG6HQ-UNVER为未核实）。可交叉验证的是全员口径：2025年年报推算的人均薪酬，工行35.5万元（搜狐口径35.74万元）、农行37.1万元、建行36.12万元、中行38.43万元、邮储33.61万元、交行约45万元，招行工资奖金口径43.33万元、员工费用口径56.49万元（E2；人均含高管和资深员工，且含社保公积金等用工成本，应届生显著低于平均）。二手应届样本只有城商行：杭州银行总行管培985本科总包21万元（搜狐，2023）、天津银行金融市场部第一年保底15万元（知乎摘要）、四川银行总行管培18–23万元（知乎摘要），都是二手传闻。用户笔记称央企金融子公司应届总包25–30W、「甚至高于部分银行总行」，与20–30万区间方向一致，但笔记本身也是传闻，未核实。区间由人均薪酬折价和城商行样本推断而来，谈薪以书面offer为准。","grade":"E3","src":[{"t":"新浪财经转载《六大行2025年人均薪酬大揭秘》（据年报整理）","url":"https://finance.sina.com.cn/wm/2026-04-01/doc-inhsywsx8490240.shtml","date":"2026-04-01"},{"t":"搜狐学习频道：985本科生入职杭州银行总行管培生的年薪（二手个人讲述）","url":"https://learning.sohu.com/a/678662774_121124331","date":"2023-05-25"},{"t":"知乎问答：城商行总行管培与金融市场部应届起薪传闻（搜索摘要，原页403）","url":"https://www.zhihu.com/question/392926139/answer/3200376894","date":"2023-2024"}]},"intern_fit":"对口实习：银行总行或分行金融市场部、资金营运中心的日常或暑期实习；券商固收自营和FICC销售交易；公募或理财子的固收投资助理。你已有的经历里，光大证券TMT研究部实习的方法（拆增长来源、核对口径、多轮修订假设）可迁移为账户配置和市场观点的论证方式；工行公司银行部的制造业对公信贷尽调（收入质量、现金流、应收周期、第一还款来源）对应信用债和同业业务的信用判断。缺口是固收、交易类的直接实习，建议用本题组里的DV01止损案例和账户分类案例补课。","requirements":"学历：建行总部2027校招要求硕士研究生及以上应届生，英语六级425分以上，或托业715、托福85、雅思6.5（官网公告，E1）；工行2027校招要求本科及以上，毕业时间2026年1月至2027年7月（二手转载，E2）；招行公告要求本科生英语四级425分以上（E2）。总行本部对本科生更严，实际录取以硕士为主是推断，未核实。中行岗位级资格要求在附件PDF，本次未读到。专业：金融、经济、数学、统计优先，理工背景对衍生品定价有加分。技能：债券定价与DV01、会计分类、外汇衍生品基础、Excel与Python、Wind或iFinD。","process":"各行流程不同，共同点是通用笔试加多轮面试。建行：网申截止2026-10-08，统一笔试2026-10-31（职业基本知识、职业行为测试、两个综合能力单元，另有在线性格测评）。工行：网申2026-09-04至10-08，统一笔试10月下旬，每人最多报3家机构、每家2个岗位，面试由各机构自行组织；总行群面有二手帖（2023年，7人无领导加半结构化，近2小时）。招行：笔试半年内只能参加一次，成绩全行通用，同一届次仅一次AI面试。邮储总行金融市场部：两篇牛客面经（2021-11、2022-02）印证第一轮是10至12人的无领导小组讨论，5分钟读材料、1分钟陈述、20分钟讨论、3分钟总结，材料是排序题。常见淘汰点：笔试线；群面中思路与大家不重合且没有结构化发言（2021年发帖人自述）；专业面对债券和汇率的基础概念答不清；动机不清。二面真题我没读到，专业问题属推断。","exit":"银行内部：交易员、投资经理、销售经理，之后是部门副总，或转资产负债管理、计划财务方向。外部：券商固收自营与FICC销售交易、公募固收基金经理助理、银行理财子、保险资管、外资行金融市场部、央企金融子公司的资金与投资岗。下一跳取决于账户业绩、衍生品与对冲能力（推断）。","batches":"2027届这一批网申基本已截止：建行2026-10-08，笔试2026-10-31；工行2026-10-08；中行2026-10-09 24:00（总行管培生六个专项含金融市场，另有上海人民币交易总部管培生，工作地上海）；邮储2026-10-07（二手摘要）；招行2026-10-10（二手摘要），管培生方向含投资与金融市场。总行本部HC：建行总行本部100人、信用卡中心10人（官网公告，E1，是全部岗位合计）；工行总行本部约100人（二手，E3）；农行全国计划18789人（培训机构转述，不是总行金融市场部人数）；交行、邮储、农行、招行的总行HC未读到。因此金融市场部单个岗位的HC无法给出。对本科2027届，后续窗口是补录、春招和2027年暑期实习，官方时间均未公布。","certs":"基金从业资格、证券从业资格、银行业专业人员职业资格（初级）是行业通行的入门证书；CFA、FRM为加分项（推断）。各行公告均未写证书要求。","cities":["北京","上海","深圳"],"sample_orgs":["中国工商银行总行金融市场部","中国建设银行总行金融市场部","中国银行总行金融市场部与上海人民币交易总部","中国农业银行总行金融市场部","交通银行总行金融市场部","中国邮政储蓄银行总行金融市场部","招商银行总行（投资与金融市场方向）"],"src":[{"t":"中国银行2027全球校园招聘公告（总行管培生六个专项含金融市场；上海人民币交易总部管培生；网申截止2026-10-09）","url":"https://www.boc.cn/en/bocinfo/bi7/202609/t20260903_25689313.html","date":"2026-09-03"},{"t":"中国建设银行总部2027年度校园招聘公告（总行本部100人、硕士及以上、培养锻炼2年）","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20260903163254718082","date":"2026-09-04"},{"t":"中国建设银行2027年度校园招聘统一笔试及性格测评公告","url":"https://job.ccb.com/tran/WCCMainPlatV5?CCB_IBSVersion=V5&isAjaxRequest=true&SERVLET_NAME=WCCMainPlatV5&TXCODE=NHR106&annoId=20261020092404778535","date":"2026-10-20"},{"t":"中国工商银行2027年度校园招聘启事（北京本地宝转载）","url":"http://bj.bendibao.com/job/gongkao/exam158072.html","date":"2026-09-04"},{"t":"招商银行2027校园招聘公告（上岸Claw聚合转载，AI面试与笔试规则）","url":"https://www.shanganclaw.com/announcements/170336/","date":"2026-08-31"},{"t":"邮储总行【一面】面经分享~（牛客网，总行金融市场部群面）","url":"https://www.nowcoder.com/discuss/353158991385665536","date":"2021-11-29"},{"t":"校招 邮储银行 金融市场部 面经（牛客网，线上无领导）","url":"https://www.nowcoder.com/discuss/353159179609251840","date":"2022-02-18"},{"t":"工商银行《2026半年度报告》资金业务分部数据（东方财富公告库原文）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608281828626875&client_source=web&page_index=9","date":"2026-08-28"},{"t":"搜狐号：六大行2025年人均薪酬（据年报整理）","url":"https://www.sohu.com/a/1005419792_121948396","date":"2026-03"}],"qn":12},{"id":"bank.hq.mt","group":"bank","org_type":"银行总行","role":"银行总行·管培生/综合岗（轮岗）","work":"总行管培生是银行为未来中层管理岗做的储备项目：入行后先按计划轮岗，再定岗到总行部门或分行。轮岗期做的是业务支持而不是决策：在分行网点和对公、对私、风险管理等条线跟岗，学客户营销、授信材料、产品流程和合规要求；到总行处室后参与起草部门材料与汇报、整理监管报送和同业对标数据、跟踪重点项目的待办与进度、做行业或客户研究。培养安排各行不同：建行总部2027届公告写明培养锻炼2年，第1年在境内一级分行下派并在营业网点及对公、对私、风险管理等条线轮岗，第2年由总行录用部门主导在处室、直属机构、重大项目团队、一级分行对口部门轮岗；中行总行管培生一般实践培训期1年，设6个专项方向；招行2027届总行管培方向为公司金融、零售金融、投行与金融市场、定向分行、政策研究；工行2027届设星辰管培生，为各级机构管理类岗位做基础人才储备。考核看轮岗评价、部门需求和个人志愿。","typical_day":["早上：整理当日客户与业务动态、监管通知和部门待办，核对昨日台账与报表（按岗位职责归纳，非实测）","上午：跟带教老师处理客户材料或授信资料，学习审批要点和系统操作（归纳）","下午：起草或修改部门汇报、会议纪要、同业对标表，核对数据口径（归纳）","月末、季末与半年报季：配合数据报送和考核口径核对，加班概率上升（推断）","轮岗交接周：写一页轮岗总结，列出学到的业务、产出和待改进项，用于定岗沟通（推断）"],"wlb":{"score":3,"text":"没有一手工时数据。可核对的只有二手传闻：豆瓣豆列转述的社招猎头信息称中信银行总行中后台“稳定性很好，但强度略大一些”（2024年5月，股份行，不是国有大行，传闻）。我的判断：总行岗位以朝九晚六为主，月末季末的数据报送、半年报季和领导交办材料会加班；轮岗在分行网点时要承担营销和考核压力，强度可能高于总行。2023年工行总行群面网友帖称面试近两小时，只说明选拔流程长，不能推出工时。面试时可向在职同事核实。","grade":"E3","src":[{"t":"豆瓣豆列“我的收藏”某条目（2024-05更新，转述社招猎头信息，360搜索摘要）","url":"https://www.douban.com/doulist/133143028/","date":"2024-05"},{"t":"工商银行 管培生 面经（牛客网，总行七人群面+半结构化近两小时）","url":"https://www.nowcoder.com/discuss/479789281779683328","date":"2023-04"}]},"growth":{"score":4,"text":"路径（推断，各行细则不同）：管培生→轮岗期满定岗到总行部门→部门业务经理或处室骨干→副处长、处长→部门总经理助理或一级分行部门负责人。建行总部2027届公告设2年培养，第2年由总行录用部门主导轮岗，说明定岗与录用部门强相关。技能壁垒：业务全景、监管与资本口径、材料写作与跨部门协调。薪酬成长：国有大行晋升看年限与竞聘，增幅平稳，应届起点低于全行人均薪酬（见薪酬栏）。限制：总行编制有限，建行总行本部2027届计划招收100人（E1），定岗受部门需求影响。"},"salary":{"range":"首年总包约20–32万元（税前，含年终奖和补贴；推断区间，应届数据为二手传闻）","basis":"官方数据只有上市银行年报人均薪酬，是全行平均、含高管和资深员工，应届生通常低于它。2025年人均薪酬：工行约35.5万（新浪口径；搜狐口径员工薪酬总额1,464.49亿元÷40.97万人=35.74万）、农行37.1万、建行36.12万、中行38.43万、邮储33.61万、交行44.97万（新浪口径45.5万）；招行工资奖金口径43.33万、员工费用口径56.49万（均E2，各源口径有差异，搜狐的“员工薪酬总额”与年报职工费用同量级，不是到手现金）；57家上市银行人均工资奖金中位数27.73万（E3）。应届首年总包的直接数据：大行和招行总行管培生本次没有读到可靠数据；城商行样本为杭州银行总行管培约21万（2023，E3）、四川银行总行管培18–23万、天津银行金融市场部第一年保底15万（知乎摘要，E3），只说明下限。我据此取20–32万为区间，是推断，不是offer。核实用户笔记“央企金融子公司25–30W，甚至高于部分银行总行”：对城商行总行可能成立，对工农中建交邮储与招行总行无法证实，按传闻处理。","grade":"E3","src":[{"t":"新浪财经转载《六大行2025年人均薪酬大揭秘》（据年报整理）","url":"https://finance.sina.com.cn/wm/2026-04-01/doc-inhsywsx8490240.shtml","date":"2026-04-01"},{"t":"搜狐号《六大行人均薪酬全部出炉，交行大幅领先》（据年报计算）","url":"https://www.sohu.com/a/1005419792_121948396","date":"2026-04-04"},{"t":"东方财富财富号《招行：员工12万人，人均薪酬43万、降薪3.5%》","url":"https://caifuhao.eastmoney.com/news/20260331204855249895810","date":"2026-03-31"},{"t":"搜狐学习《985本科生入职杭州银行总行管培生，透露年薪和待遇》（二手个人讲述）","url":"https://learning.sohu.com/a/678662774_121124331","date":"2023-05"},{"t":"知乎回答：城商行总行管培与金融市场部应届起薪（搜索摘要，原文403）","url":"https://www.zhihu.com/question/392926139/answer/3200376894","date":"2023至2024"}]},"intern_fit":"对口实习：银行总行或一级分行的对公、公司金融、授信审批、风险管理、金融市场、计划财务类实习；国有大行的日常实习多由分行或总行部门自行组织，岗位和名额看机构公告，本次没有读到统一信息。你在工行公司银行部做过制造业对公信贷尽调（收入质量、现金流、应收周期、第一还款来源），可以直接迁移到授信和对公岗位的面试；缺口是零售和金融市场，建议补一段金融市场、资管或零售业务实习，或用七家行半年报对比作业弥补。注意学历门槛：建行总部2027届要求硕士及以上（总行直属机构本科及以上），本科阶段应以日常和暑期实习积累为主，读研后再冲总行。","requirements":"学历：建行总部2027届要求硕士研究生及以上（E1），建行总行直属机构本科及以上；工行2027届公告为本科及以上、毕业时间2026年1月至2027年7月（E2）；网友帖称工行总行群面同组者多为两财一贸以上，还有清华五道口（2023，传闻）。专业：不限为主；建行总部公告列计算机、电子信息、数理统计、其他理工、经济金融、管理会计、法律、外语、新闻类为主。英语：建行要求六级≥425或托业≥715或托福≥85或雅思≥6.5（E1）；招行本科生需四级425分以上（E2）。笔试内容：行测、英语、经济金融与银行知识、时政（网友帖，E3）。加分项：银行从业资格、CFA、FRM；学生干部和团队经历（管培生看领导力与学习能力，网友帖）。","process":"以2027届公告和网友帖归纳。建行：网申至2026-10-08 24:00，最多2个志愿；统一笔试2026-10-31 14:30-17:00线下，四个单元（职业基本知识、职业行为测试、综合能力测试一、二），另有在线性格测评（E1）；管培岗2022年为5v1单面约5分钟，抽题2分钟答加1分钟自我介绍再追问1题（网友帖）。工行：网申2026-09-04至10-08，最多报3家机构、每家2个岗位，统一笔试10月下旬（E2）；总行面试线下， url":"https://www.nowcoder.com/discuss/353159176723570688","date":"2022-02"},{"t":"校招 中国建设银行 管培生 面经（牛客网，管培岗5v1单面）","url":"https://www.nowcoder.com/discuss/353159242314096640","date":"2022-02"},{"t":"秋招经验贴-银行总行管培生（牛客网，笔试面试与简历准备）","url":"https://www.nowcoder.com/discuss/658395139718541312","date":"2024-08"}],"qn":12},{"id":"bank.hq.risk","group":"bank","org_type":"银行总行","role":"银行总行·风险管理与授信审批","work":"总行风险管理与授信审批岗负责全行信用风险的政策、审批、计量和监测，不是在分行逐笔放款。典型分工有五块：风险政策与行业限额（制定行业、区域、客户准入和限额，决定房地产业压降、制造业增量等安排）；授信审批（大额、集团客户和创新业务的评审，出具审批意见和附加条件，参加授信评审会）；风险计量与模型（内部评级的PD、LGD、EAD，预期信用损失三阶段，压力测试，模型验证）；资产质量监测与贷后（五级分类、关注类到不良的迁徙、重点客户预警、不良处置）；拨备与资本（拨备覆盖率、风险加权资产和资本充足率测算）。向部门总经理、首席风险官和授信评审委员会汇报，考核资产质量（不良率、关注类占比、不良生成）、审批时效、模型表现和监管报送质量。以工行2026年上半年为例：信用减值损失1,270.18亿元，相当于归母净利润的73.1%（自算），不良率1.29%，房地产业不良率6.27%，说明这个岗位直接决定银行利润质量。","typical_day":["早上看昨日重点客户舆情、行业预警清单和逾期、关注类变动（典型日程由岗位职责归纳，不是实测）","上午审阅分行上报的授信方案：收入质量、现金流、应收周期、第一还款来源、担保和集团关联","下午参加授信评审会或与客户部门沟通，补充附加条件，例如缩短期限、增加抵质押或保证、受托支付、分次提款","月度和季度：更新行业限额使用、关注类迁徙、不良生成，写监测报告给管理层","季末和年末：配合拨备计提、资本测算和压力测试，工作量最大（推断）"],"wlb":{"score":3,"text":"判断分，没有读到该岗位的一手工时数据：总行风险管理部节奏比分行和业务线稳定，但授信审批有时效要求，评审会前后会紧急补材料，季末年末拨备、资本测算集中加班。二手参考：豆瓣豆列把中信银行总行中后台岗描述为稳定性很好、强度略大（2024-05，股份行样本，不是国有大行）；牛客一篇offer比较帖称工总风险管理类岗位相对确定，至少北分轮岗（日期页面未读到，二手传闻）。真实强度以面试时向在职同事核实为准。","grade":"E3","src":[{"t":"银行总行中后台岗位强度的二手描述（豆瓣豆列）","url":"https://www.douban.com/doulist/133143028/","date":"2024-05"},{"t":"offer求比较 农总管培vs工总风险管理类（牛客网）","url":"https://www.nowcoder.com/discuss/353157370916315136","date":"日期页面未读到"}]},"growth":{"score":4,"text":"推断：内部路径是风险经理或审批人，到高级经理或授信审批官，到处室负责人或分行风险总监，再到部门副总和首席风险官；横向可转资产负债管理、资本管理、公司金融和合规。壁垒在于信用分析加模型数据的复合能力，风险计量、模型验证和压力测试稀缺；国有大行薪酬受监管约束，涨幅平缓，成长更多体现在职级和平台。工行2026年上半年信用减值损失已相当于归母净利润的73.1%（自算），风险条线的重要性在上升。"},"salary":{"range":"首年总包约20–30万元（税前，推断区间，E3）；招商银行总行可能更高","basis":"二手传闻与人均薪酬交叉验证，没有应届生一手数据。①2025年全行人均薪酬（员工费用口径，据年报整理，E2）：交行44.97万、中行38.43万、农行37.0万、建行36.12万、工行35.5至35.74万、邮储33.61万；招行工资及奖金口径43.33万、员工费用口径56.49万。人均含高管和资深员工、社保公积金等，应届生起薪明显低于人均，不能直接当作offer。②牛客offer比较帖称农总管培转正后到手20w+（日 谈管理层、客户和供应商，核对三表勾稽，搭DCF与可比公司估值，整理尽调要点","起草投资建议书和投委会材料，准备国资审批与评估备案所需文件","每周参加项目组例会，与外部GP、财务顾问沟通，跟进子基金或被投企业的投后数据","季末年末编制基金或项目绩效报告，对照考核指标复盘：投资进度、已投金额、产业协同、估值变动与退出"],"wlb":{"score":4,"text":"判断分，证据等级E3。用户笔记称国资PE偏投资端“没有明确KPI，更多是上面决策、做交易执行”，CVC“可以养老”，均为二手说法，我没有读到一手工时数据。可核对的事实：国办发〔2024〕31号要求探索对国资创投按整个基金生命周期考核，说明有考核但在拉长周期；赛诺佳易《2025国有投资机构激励与尽职免责（容错）机制调研报告》（105份有效问卷，地方国企及政府部门下属机构占九成以上，不能外推到央企）显示86.66%的机构已建立绩效考核制度，70.48%仍沿用年度考核，不到8%实施覆盖投资期或退出期结束后的长周期考核，投资进度和返投任务是考核指标前两位，91.43%把退出渠道不畅列为首要挑战。所以工时通常不像市场化PE，但审批链条长、考核指标具体，压力不是零。","grade":"E3","src":[{"t":"国办发〔2024〕31号《促进创业投资高质量发展的若干政策措施》（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202406/content_6958231.htm","date":"2024-06-19"},{"t":"赛诺佳易《2025国有投资机构激励与尽职免责（容错）机制调研报告》（腾讯新闻转载）","url":"https://news.qq.com/rain/a/20251130A04K0O00","date":"2025-11-30"}]},"growth":{"score":3,"text":"判断分。晋升看资历和项目业绩两条线，国资平台的职级通常按年限设门槛：国投创业社招页写明投资经理AS要求3年以上知名投资机构股权投资经验，VP要求5年以上，投资总监要求8年以上并有3个成功的投资与退出项目，MD要求11年以上（官网，E1），说明市场化口径下“有退出记录”才是上行通道的硬门槛。国资平台内部晋升相对稳定但慢；薪酬成长受工资总额管理和考核周期限制（推断）。技能壁垒在于赛道研究深度、交易结构设计和国资合规流程经验，这三项可迁移到产业集团战投、政府引导基金和市场化基金。"},"salary":{"range":"首年总包约20–30万元（税前，含绩效；二手传闻为主，E3）","basis":"证据等级E3，薪资读不到央企投资岗的官方应届起薪。可对照的数据：①用户笔记称“国投28W”，来源不明，按传闻处理；②长江产业集团（湖北省属国企，非央企）校招「产业投资岗」本科10k–12k/月，硕士约20万/年（牛客网用户帖转述公告，发帖2025-11-12，E3）；③合肥市产业投资控股（集团）「投资基金岗」「投资管理岗」月薪上限均为13.3k，分别招5人、3人（国家大学生就业服务平台，地方国资，E2）；④年报口径只给上界：国投资本2025年全员人均现金薪酬约60.25万元，五矿资本约61.63万元，中粮资本约60.88万元（东方财富转引年报，E2），这些平台含券商、信托等市场化条线和高管，不等于投资岗应届起薪。20–30万元是在传闻与省属国企公告之间取的区间，谈薪以书面offer为准。","grade":"E3","src":[{"t":"长江产业集团校招公告转述（牛客网用户帖）","url":"https://www.nowcoder.com/feed/main/detail/28f9b98fdd25436eaccadfdae79395a9","date":"2025-11-12"},{"t":"国家大学生就业服务平台岗位列表（合肥市产业投资控股（集团）等）","url":"https://www.ncss.cn/student/jobs/jobslist/ajax/?jobName=%E6%8A%95%E8%B5%84&keyWord=%E5%9B%BD%E6%8A%95","date":"2026-10-31"},{"t":"国投资本2025年现金流量表（东方财富F10，转引年报）","url":"https://datacenter.eastmoney.com/securities/api/data/get?type=RPT_F10_FINANCE_GCASHFLOW&sty=SECUCODE,REPORT_DATE,PAY_STAFF_CASH&filter=(SECUCODE=\"600061.SH\")(REPORT_TYPE=\"年报\")&p=1&ps=3&sr=-1&st=REPORT_DATE&source=HSF10&client=PC","date":"2026-11-01"}]},"intern_fit":"对口实习：央企或国资投资平台的投资部、产业基金或战略投资部；国投创业、国投创合等央企系基金管理人；券商直投或PE/VC的投资助理；上市公司投资并购部。你在光大证券TMT研究部的实习最对口，跟踪兆易创新、区分存储与MCU库存周期复苏和结构性盈利改善、覆盖10家以上A股半导体设计公司并搭建15项以上指标的三层框架、DCF把营收拆成销量×价格×产品结构，可直接迁移为硬科技赛道的行业研究与估值能力；安永华明咨询的即时零售买方尽调（GMV＝订单量×客单价）和工行公司银行部制造业信贷尽调（收入质量、现金流、应收周期、第一还款来源）对应尽调与风险判断。缺口是直接的股权投资或基金实习，建议补一段。","requirements":"学历：国资投资平台以硕士及以上为主。国投创业社招各职级均要求硕士及以上（官网，E1）；天津泰达投资控股「管理培训生-战新产业与高端制造类」要求硕士及以上、招14人（国家大学生就业服务平台）；也有岗位对本科放开，如合肥市产业投资控股的投资类岗位学历写“不限”。专业：金融、经济、会计，加上赛道相关理工背景（电子、材料、生物医药、能源）。技能：财务模型与估值、行业研究、尽调、投资协议条款、Excel与PPT，部分岗位要求Python。证书：基金从业资格（私募基金方向）、CPA、法律职业资格加分，非硬性。英语：能读英文行业资料；有海外基金出资的岗位要求更高。","process":"以国投集团2027年度应届毕业生招聘为例（国家大学生就业服务平台）：集团管培生计划招25人，子企业岗位来自国投所属100余家企业，唯一官方投递入口是sdic.iguopin.com，程序含背景调查、体检和公示（E1）。其他央国企流程类似：网申→笔试（行测或综合能力，视单位而定）→结构化面试或群面→专业面（项目与实习深挖）→终面/HR→背调体检公示。推断：淘汰点在简历匹配度、对赛道和国资规则的理解、能否把实习经历讲成可核对的数据。本次没有读到国新、诚通、华润、招商局、中交等单位的岗位级流程原文。","exit":"出口与下一跳：①集团内部：投资经理→高级经理→部门副总，或轮岗到战略、资本运营；②央企产业集团战略投资部、CVC；③政府引导基金与地方国资平台；④市场化VC/PE，需要有成功退出的项目记录，国资平台的项目周期长，退出记录积累慢；⑤券商直投、保险资管股权投资、上市公司投资并购部。","batches":"国投集团2027年度应届毕业生招聘：管培生计划25人，管培生覆盖11个专业领域（含人工智能、医疗健康等，不含股权投资专业领域），子企业岗位来自国投所属100余家企业，含“投资管理”类（国家大学生就业服务平台，E1，公告发布日未读到）。国投创业官网社招页只列AS及以上职级，没有应届岗位。地方国资样本：合肥市产业投资控股「投资基金岗」招5人、「投资管理岗」招3人；天津泰达投资控股战新产业与高端制造类管培招14人（均为国家大学生就业服务平台列表，岗位级批次与截止日未读到）。国新、诚通、华润、招商局、中交、国家电投等单位的2027届批次与HC：官方未公布或本次未读到，记为未公布；平台列表中有“国家电力投资集团有限公司2027年应届毕业生招聘简章”转载，招500人（转载方为招聘服务商，未核对原文）。","certs":"基金从业资格（私募股权投资基金方向，入行后一般要求取得）；CPA、法律职业资格、CFA为加分项（推断）；非硬性要求，以具体公告为准。","cities":["北京","上海","深圳","天津","合肥","杭州"],"sample_orgs":["国投集团（国投创业、国投创合）","中国国新","中国诚通","华润集团（华润资本）","招商局集团（招商局创投）","中交资本","国家电投","国家集成电路产业投资基金（华芯投资）","五矿资本","中粮资本"],"src":[{"t":"国办发〔2024〕31号《促进创业投资高质量发展的若干政策措施》（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202406/content_6958231.htm","date":"2024-06-19"},{"t":"国家创业投资引导基金启动仪式（国家发展改革委）","url":"https://www.ndrc.gov.cn/xwdt/xwfb/202512/t20251226_1402664.html","date":"2025-12-26"}, 异（推断）。中证协2026年94家券商投行质量评价里，股票保荐占35分，是75分执业质量里权重最大的一块，说明股权承做仍是行业评价核心。上市券商前三季度投行手续费净收入317.64亿元（+26.11%），前五名占59.99%，头部集中使晋升竞争也集中。出口：资本市场部、并购部、买方PE/VC、产业投资、企业董秘或财务总监。"},"salary":{"range":"首年总包约35–55万元（税前，头部券商，二手传闻，降薪前口径偏高；区域券商更低）","basis":"二手传闻E3：百度知道转述知乎专栏称三中一华做股业务应届生月薪3.7万–3.8万元（区域投行少1万元）、头部团队年终奖12–24个月薪资；搜狐稿称北京某头部券商投行VP年包约50万元、降薪后上海某券商VP约40万元，说明薪酬已压缩。官方交叉：南都湾财社按应付职工薪酬调整口径，2025年中信证券人均薪酬81.28万元、中金公司79.93万元、广发证券77.25万元（全员平均，含高管和中后台，不是应届起薪）；我按东方财富年报现金流自算的人均职工现金支出：中信证券72.26万、中金公司76.64万、华泰证券65.54万、国泰海通62.02万（并表口径偏低）、招商证券54.63万、东方证券55.65万、中信建投59.02万、申万宏源63.72万。江海证券2026年10月被黑龙江证监局出具警示函，原因之一是投行业务薪酬递延支付执行不到位，说明奖金存在递延。区间是我对首年总包的判断，不是任何公司的承诺。","grade":"E3","src":[{"t":"券商投行薪资情况汇总分享（百度知道转述知乎专栏，二手）","url":"https://zhidao.baidu.com/question/631011186010386892.html","date":"2026-01-29"},{"t":"投行薪资大调查：降薪潮下的真实收入图谱（搜狐，二手）","url":"https://www.sohu.com/a/922125743_122277769","date":"2025-08-08"},{"t":"头部券商人均薪酬盘点：集体上行，中信证券81万年薪居首（南都湾财社）","url":"https://m.163.com/dy/article/KPUDVDEO05129QAF.html","date":"2026-04-07"},{"t":"江海证券遭警示，涉薪酬管理不规范、内控机制不完善等问题（南方都市报）","url":"http://finance.eastmoney.com/a/202610213902466065.html","date":"2026-10-21"}]},"intern_fit":"最对口：头部券商投行部IPO项目组的日常或暑期实习（面经显示招商证券投行实习为‘实习期最少一个月后答辩’）；其次是会计师事务所IPO审计、律所IPO项目。你的光大证券TMT研究部实习（跟踪兆易创新，三表与估值模型做过4–6轮假设修订，覆盖10多家半导体设计公司）能支撑‘行业加财务建模’，工行公司银行部制造业信贷尽调和安永即时零售买方尽调可迁移到‘现金流、收入质量、客户供应商核查’。缺口是没有IPO底稿经验，建议补一段投行实习。","requirements":"学历：财联社统计券商‘总部硕士起步、分支机构本科起步’，申万宏源总部及子公司主要岗位要求硕士及以上，本科生更现实的路径是日常暑期实习留用，投递前先向招聘方确认本科是否可投总部投行。专业：金融、会计、法律，理工背景受欢迎（广发‘T-talent未来产业投行家’面向半导体、新能源、生命科学理工背景）。证书：证券从业资格，CPA或法律职业资格加分，保荐代表人为入职后目标。技能：三表勾稽、估值、Excel、PPT、Word。英语：港股与跨境项目更重要。","process":"典型流程：网申→线上测评或笔试→一面（简历深挖，常见追问资金流水核查、穿行测试、供应商访谈、三张表勾稽、折旧在三表的体现）→二面（部门负责人，行为面加技术面）→HR。面经淘汰点：简历写了做不出来的事被挖穿；DCF、可比公司、WACC答不出；对上市标准不熟（中金面经有‘XX项目采用的是哪套上市标准？’）。中金公司2027届官方申请窗口为2026-09-08至10-28。","exit":"出口与下一跳：券商内部转资本市场部、并购重组部或其他行业组；拿到保荐代表人资格后可转PE/VC、产业投资、企业董秘或财务总监；也有人转买方研究、监管或交易所。","batches":"中信证券2027届校招于2026-09-01前后启动（聚合页统计16个岗位，总部含投资银行岗，工作地深圳，官方站careers.citics.com为动态页，岗位级HC未公布）；中金公 研究与服务选交易对手的结构不符；以性别或外形差别录用不合规，遇到应拒绝并保留证据。","grade":"E3","src":[{"t":"金融行业薪资汇总（知乎专栏，二手）","url":"https://zhuanlan.zhihu.com/p/716655462","date":"2024-09"},{"t":"债市巨震！信用债抛压集中释放（财联社）","url":"http://finance.eastmoney.com/a/202610303916787994.html","date":"2026-10-30"},{"t":"央行：2026年9月份金融市场运行情况（中国债券信息网转载）","url":"https://www.chinabond.com.cn/xwgg/zsxw/zqxw_zqsc/zqsc_zqsc/202610/t20261027_855501459.html","date":"2026-10-27"}]},"intern_fit":"最对口：券商固收部销售交易或FICC日常、暑期实习（中金FICC暑期一面为单面，五六位senior面30分钟，2022-10牛客）；银行金融市场部、保险资管、公募固收的助理岗。你没有直接的固收实习，光大证券TMT研究部的研究纪律（4–6轮假设修订、写下证伪条件）可迁移到‘推荐一只债要写出收益、风险、证伪点’；建议用公开中债曲线做一次完整的报价与DV01演示作为作品。","requirements":"学历：财联社统计券商总部多‘硕士起步’，分支机构本科起步；固收销售交易因岗位而异，投递前确认。专业：金融、经济、数学统计均可，编程能力被问（中金FICC面经问到编程水平）。技能：久期与DV01、信用利差、国债期货与利率互换基础、沟通与抗压。证书：证券从业资格、基金从业；CFA加分。英语：外资客户与跨境业务更重要。","process":"流程：网申→笔试（中金FICC笔试‘基本不刷人’，2022-10）→一面（单面，五六位senior，30分钟）→二面→HR。面经问题：交易还是销售更倾向（中金）；分析一只债券在一级和二级市场的情况（中金）；十年期国债上行若干bp你怎么操作（五矿固收）；‘同事业绩很好但你一支债都没卖出去怎么办’，实际考察抗压（五矿固收销售交易岗群面，2022-02）；社招中信证券债券销售被问对接客户和各家投资风格，客户要说得出名字（2021-08）。淘汰点：只会背概念，没有价格和数量感；回答没有触及压力应对。","exit":"出口与下一跳：券商交易员、做市岗；买方（银行金融市场部、保险资管、公募、理财子）债券投资岗；券商资本市场部；固收研究。","batches":"中信证券2027届校招16个岗位（总部含‘固定收益岗’，深圳，2026-09-01前后启动，岗位级HC未公布）；中金公司2027届申请窗口2026-09-08至10-28（已截止）。华泰证券、国泰海通、广发证券、招商证券、中信建投、东方证券、申万宏源的官方招聘站为动态页面，本次未读到岗位级HC与截止日；二手聚合称至少36家券商启动2027届校招。固收部的销售交易岗常与固收研究、信评岗在同一轮面试里被调剂（华泰债券交易岗面经：投递债券研究被调剂到交易）。","certs":"证券从业资格；基金从业资格；CFA、FRM加分；债券交易相关资格因机构而异。","cities":["北京","上海","深圳"],"sample_orgs":["中信证券","中金公司","中信建投","华泰证券","国泰海通","广发证券","招商证券","东方证券","申万宏源"],"src":[{"t":"中金||固收暑期实习一面面经分享（牛客）","url":"https://www.nowcoder.com/discuss/414096309054918656","date":"2022-10"},{"t":"校招 中国五矿集团 固收岗位 面经（牛客）","url":"https://www.nowcoder.com/discuss/353159232822386688","date":"2022-02"},{"t":"中信证券，社招面经债券销售岗（牛客）","url":"https://www.nowcoder.com/discuss/353158311505764352","date":"2021-08"},{"t":"华泰证券债券交易岗秋招面经（牛客，搜索摘要）","url":"https://www.nowcoder.com/discuss/439912380152242176","date":"2023-01"},{"t":"央行：2026年9月份金融市场运行情况（中国债券信息网转载金融时报）","url":"https://www.chinabond.com.cn/xwgg/zsxw/zqxw_zqsc/zqsc_zqsc/202610/t20261027_855501459.html","date":"2026-10-27"}],"qn":12},{"id":"brk.ib.qc","group":"broker","org_type":"券商","role":"券商投行·质控与内核（质量控制部、内核管理部）","work":"质控和内核是投行项目对外申报前的内部‘看门人’，独立于项目组。质控在项目立项后全程介入：审阅底稿，做现场核查，对关键事项逐项问核并留痕，出具质控意见；内核在申报前召开内核会议，由内核委员对项目表决，通过后才能向交易所或证监会申报，并对对外报送材料和问询回复把关。外部压力很实：中证协2026年投行业务质量评价满分115分，其中内部控制评价占25分（制度建设及监管问责15分、制度执行10分），94家参评券商的内控得分从14.7分到25分不等；清越科技案中保荐机构广发证券与审计机构立信所、实控人共同出资3.7亿元设先行赔付专项基金，是保荐责任落地的真实后果。","typical_day":["上午：审阅项目组提交的底稿，核对访谈记录、函证回函和资金流水核查清单","下午：与项目组开质控沟通会，提出补充核查事项并跟踪整改","申报前：整理内核材料、召集内核会议，记录委员意见和表决","监管问询回复前：复核回复口径与底稿是否一致","平时：检查内控制度执行，跟踪监管处罚和先行赔付案例，更新核查清单（推断）"],"wlb":{"score":3,"text":"我的判断是3分，略好于承做。依据：牛客2022-12海通面经称内核‘团队年轻人不多，整体氛围沉闷’、质控‘氛围活跃、领导亲和’；2022-06的二手帖称中等券商质控有‘免责心态’，越审越严，并举例质控坚持函证比例70%、项目因此过不了内核被大券商拿走。节奏随申报高峰（IPO问询、年末）起伏，无项目路演但责任压力大。用户笔记里‘质控内核：卷’没有官方工时数据支持，我的判断是责任压力型的‘卷’，时长上通常不如承做。","grade":"E3","src":[{"t":"海通证券质控&内核凉经（牛客）","url":"https://www.nowcoder.com/discuss/430994005132898304","date":"2022-12"},{"t":"中等券商投行的玩火式质控（牛客）","url":"https://www.nowcoder.com/discuss/365095488012435456","date":"2022-06"}]},"growth":{"score":3,"text":"路径：质控员→质控经理→质控负责人或内核委员，晋升慢于承做，薪酬弹性小于承做；监管趋严使该岗位更重要：2026年10月黑龙江证监局对江海证券出具警示函，涉及投行业务薪酬递延支付执行不到位，依据《证券公司投资银行类业务内部控制指引》第三十条；清越科技案欺诈发行被罚。能力壁垒是会计、法律和监管案例的积累。出口：回到承做、资本市场部，转合规风控、监管机构、企业审计或董秘。"},"salary":{"range":"首年总包约25–40万元（税前，推断，二手）","basis":"二手传闻E3：百度知道转述知乎专栏称华泰中后台部门起薪约2.2万元/月（降薪前口径，‘中后台’是否含质控内核原文未写）；质控内核奖金弹性小于承做。官方交叉：上市券商2025年全员人均薪酬约54–81万元（含高管和承做，不是应届起薪）。没有查到质控内核分岗位的官方或可靠二手薪酬，区间是推断，不能当作offer预期。","grade":"E3","src":[{"t":"券商投行薪资情况汇总分享（百度知道转述，二手）","url":"https://zhidao.baidu.com/question/631011186010386892.html","date":"2026-01-29"},{"t":"头部券商人均薪酬盘点（南都湾财社）","url":"https://m.163.com/dy/article/KPUDVDEO05129QAF.html","date":"2026-04-07"}]},"intern_fit":"对口：券商质控内核的实习很少公开招聘；更现实的路径是投行承做实习（先理解底稿），或会计师事务所IPO审计、律所IPO项目实习，这些经历最贴近质控内核看的‘底稿核查’。你的工行公司银行部制造业信贷尽调（收入质量、现金流、第一还款来源）与‘核查’思路相通；光大证券TMT研究部实习中‘三表勾稽、假设修订’可迁移到财务异常识别。缺口是没有底稿和监管问询回复经验。","requirements":"学历：多为硕士起步（财联社统计总部口径），本科以实习留用为主。专业：会计、法律、金融均可，CPA和法律职业资格在面试中明显加分（海通面经被问考证、审计与券商区别）。技能：财务异常识别、监管规则与处罚案例、写作与沟通；对人要‘敢说不’又能给出解决办法。","process":"海通面经（2022-12）：内核一面线上约10分钟、问题少；二面被要求线下，约一小时，问考证、实习经历（很细，包括审计与券商的区别）、已有offer、如何选择、能不能去实习；质控一面线下，较短，问到‘如果内核和质控都发offer怎么选’。淘汰点：专业性不足（面经称内核‘需要专业性比较强’），实习经历说不细，到岗时间不匹配。","exit":"出口与下一跳：投行承做、资本市场部；合规、风控、稽核；证监局、交易所等监管机构；企业内审、董秘或财务岗位。","batches":"公开岗位表中通常不单列‘质控’‘内核’：中信证券2027届聚合页的16个岗位里没有这两个岗位名，可能挂在‘投资银行’‘风险管理’‘法律合规’岗下（推断，需向招聘方确认）。中金公司申请窗口2026-09-08至10-28（已截止）。华泰、国泰海通、广发、招商、中信建投、东方证券、申万宏源官方站为动态页面，本次未读到岗位级HC与截止日。","certs":"证券从业资格；CPA、法律职业资格强加分；保荐代表人、注册会计师是长期目标。","cities":["北京","上海","深圳"],"sample_orgs":["中信证券","中金公司","中信建投","华泰证券","国泰海通","广发证券","招商证券","东方证券","申万宏源"],"src":[{"t":"海通证券质控&内核凉经（牛客）","url":"https://www.nowcoder.com/discuss/430994005132898304","date":"2022-12"},{"t":"中等券商投行的玩火式质控（牛客）","url":"https://www.nowcoder.com/discuss/365095488012435456","date":"2022-06"},{"t":"【独家】94家券商投行大考得分落定（中国证券报）","url":"http://stock.eastmoney.com/a/202610273910260617.html","date":"2026-10-27"},{"t":"江海证券遭警示，涉薪酬管理不规范、内控机制不完善等问题（南方都市报）","url":"http://finance.eastmoney.com/a/202610213902466065.html","date":"2026-10-21"},{"t":"中国经营报：清越科技案3.7亿元先行赔付基金正式设立","url":"http://finance.eastmoney.com/a/202610233906776264.html","date":"2026-10-23"}],"qn":12},{"id":"brk.ib.cm","group":"broker","org_type":"券商","role":"券商资本市场部（ECM/DCM：定价簿记、承销团协调、投资者沟通、发行统筹）","work":"资本市场部（ECM/DCM）是投行承做之后、发行阶段的‘出口’：与承做团队、销售交易和投资者三方协同，做发行时机判断、定价区间与簿记建档、网下询价和配售、战略配售与保荐机构跟投安排、承销团分工、路演和投资者沟通，并统筹股债项目发行（含可转债、超额配售选择权安排）。例：北交所森峰激光发行价17.79元、发行后市盈率14.99倍，初始发行1900万股，授予国联民生承销保荐15%超额配售选择权（285万股），全额行使后发行总数2185万股。行业评价里‘新股发行定价’仅占调整项2分，说明定价合理性是监管关注点而非主要收入来源。","typical_day":["发行前：与承做团队、投资者沟通询价反馈，整理询价报价分布和估值区间","路演期：安排路演、一对一沟通，汇总投资者反馈和价格敏感度","簿记日：盯订单、做价格和配售方案、与发行人和销售交易部对口径（簿记日常拖到深夜，推断）","发行后：绿鞋与稳定价格操作、上市首日表现复盘","平时：跟踪发行窗口、同业定价、新规，维护投资者名单"],"wlb":{"score":3,"text":"我的判断是3分：发行窗口期和簿记日强度高，其余时间比承做轻；2026年发行回暖（前三季度A股123家IPO、首发募资2163.15亿元）加重了发行统筹的工作量，而年内73家终止申报又让项目节奏不稳。没有官方工时数据。","grade":"E3","src":[{"t":"券商IPO承销规模扩张 利好券商板块（中国证券报·中证网）","url":"http://stock.eastmoney.com/a/202610273909627967.html","date":"2026-10-27"},{"t":"Top券商资本市场部面经（牛客）","url":"https://www.nowcoder.com/discuss/426773717860048896","date":"2022-11"}]},"growth":{"score":4,"text":"路径：分析师→经理→副总裁→董事总经理；资本市场部兼具销售导向与定价判断，能力迁移到承做、销售交易、买方都不难。头部集中：前五家券商IPO募集资金占全市场78.76%（2026前三季度，Wind），投行手续费净收入前五名占59.99%。出口：投行ECM/DCM承做、销售交易、买方研究或投资、企业融资部门。"},"salary":{"range":"首年总包约35–55万元（税前，推断，二手；是否高于承做无证据）","basis":"公开渠道未读到资本市场部单独的薪酬数据，这是推断：同属投行条线，参考ECM/DCM的二手区间（三中一华做股业务应届生月薪3.7万–3.8万元，降薪前，E3）。用户笔记称‘资本市场部是肥差，有的券商全是vip’，我标为二手传闻E3，无法证实也无法证伪：①中信证券2027届聚合页的16个岗位里没有单列资本市场部；②牛客面经里招商证券资本市场部实习由VP面试、国泰君安资本市场部为多人群面，不能推出‘全是vip’；③‘vip’一词指向关系背景，没有任何公开数据，面试里不要复述这类说法，被问到时回答‘我关注发行定价和投资者沟通的专业能力’。","grade":"E3","src":[{"t":"招商证券资本市场部面试面经（牛客）","url":"https://www.nowcoder.com/discuss/389087197830352896","date":"2022-08"},{"t":"国泰君安 资本市场部 面经（牛客）","url":"https://www.nowcoder.com/discuss/361841121004199936","date":"2022-06"},{"t":"券商投行薪资情况汇总分享（百度知道转述，二手）","url":"https://zhidao.baidu.com/question/631011186010386892.html","date":"2026-01-29"}]},"intern_fit":"对口：券商资本市场部（ECM/DCM）日常、暑期实习（招商证券资本市场部实习由VP面试，国泰君安资本市场部暑期为多人一面，均为2022年牛客面经）；投行承做实习，再转资本市场部。你的光大证券TMT研究部实习（覆盖10多家半导体设计公司，15项以上指标的三层运营分析框架）可迁移到‘行业认知与可比公司估值’，面试官在资本市场部面试中会让你讲一个研究过的行业并说明为什么看好（招商面经原题）。缺口是没有发行经验，建议用公开新股发行数据做一份定价复盘。","requirements":"学历：财联社统计券商总部‘硕士起步’，资本市场部实习生本科可投的情况因券商而异，需确认。专业：金融、经济、法律、会计；市场敏感度、投资者沟通和Excel估值能力。证书：证券从业资格。英语：港股与跨境发行更重要（2026年前三季度港股IPO保荐规模中金公司849.33亿港元居首）。","process":"面经：招商证券资本市场部（2022-08）约15分钟左右三段：自我介绍、深挖简历（讲一个研究过的行业并说明逻辑）、职业匹配与规划，问‘对资本市场部门的认识’‘为什么想来ECM’‘对我们部门的专业知识有了解吗’；国泰君安资本市场部暑期只有一面，多人轮流自我介绍，问选股还是债、哪个城市、投行实习学到什么、‘怎么销售债券’、为什么资本市场部（2022-06）。淘汰点：说不清资本市场部与承做部门的分工；对法律和发行规则完全不了解又没有学习计划。","exit":"出口与下一跳：ECM或DCM承做、销售交易、研究所；买方（公募、保险资管、PE）；企业融资或投资者关系岗位。","batches":"公开岗位表通常不单列资本市场部，多挂在‘投资银行’或‘固定收益’大类下：中信证券2027届聚合页16个岗位中无该岗位名（推断需确认）；中金公司申请窗口2026-09-08至10-28（已截止）；华泰、国泰海通、广发、招商、中信建投、东方证券、申万宏源官方站为动态页面，本次未读到岗位级HC与截止日；二手聚合称至少36家券商启动2027届校招。","certs":"证券从业资格；CFA非必需；法律或会计证书加分。","cities":["北京","上海","深圳","香港"],"sample_orgs":["中信证券","中金公司","中信建投","国泰海通","华泰联合","招商证券","广发证券","东方证券","申万宏源"],"src":[{"t":"Top券商资本市场部面经（牛客）","url":"https://www.nowcoder.com/discuss/426773717860048896","date":"2022-11"},{"t":"招商证券资本市场部面试面经（牛客）","url":"https://www.nowcoder.com/discuss/389087197830352896","date":"2022-08"},{"t":"国泰君安 资本市场部 面经（牛客）","url":"https://www.nowcoder.com/discuss/361841121004199936","date":"2022-06"},{"t":"一只新股（发行价17.79元），明日申购（中新经纬）","url":"http://finance.eastmoney.com/a/202610273910378557.html","date":"2026-10-27"},{"t":"券商IPO承销规模扩张 利好券商板块（中国证券报·中证网）","url":"http://stock.eastmoney.com/a/202610273909627967.html","date":"2026-10-27"},{"t":"【独家】94家券商投行大考得分落定（中国证券报）","url":"http://stock.eastmoney.com/a/202610273910260617.html","date":"2026-10-27"}],"qn":12},{"id":"brk.research","typical_day":["早上7点半前读隔夜外盘、公司公告和同行研报，准备晨会发言","白天跑数据库和公司调研，更新重点公司的盈利预测与估值模型","下午写点评或深度报告，过合规审核后发布","晚上给基金经理、销售做电话路演，周末赶深度稿和跟进评选"],"role":"券商研究所·行业研究员/策略","group":"broker","org_type":"证券公司","work":"研究所是卖方研究：行业组覆盖一条产业链的上市公司，做盈利预测、估值模型、深度报告和财报点评，向公募、保险资管、私募及公司内部销售路演；策略组看宏观数据、流动性、行业比较和主题配置。日常产出是晨会观点、个股与行业深度、点评、数据库和路演材料，考核看分仓佣金派点、报告数量与质量、路演场次和评选（新财富、水晶球）。2026年上半年全行业分仓佣金87.27亿元、同比+95.13%，但2025年全年只有105.7亿元；费改后单只基金付给单家券商的佣金不得超过其当年全部交易佣金的15%，收入向头部和热门赛道集中。","intern_fit":"最加分：卖方研究所行业组实习（能独立写深度、搭三表模型、做财报点评）、买方研究实习、产业公司战略或IR实习。你已有光大证券TMT研究部（2025.06–10）跟踪兆易创新、覆盖10+家A股半导体设计公司、三表与估值模型4–6轮修订、DCF把营收拆成销量×价格×产品结构，这套方法可直接迁移到电子或通信组；缺口是没有独立署名报告和路演经验，建议用本题库brk2-01、brk2-02、brk2-12做成一份可展示的深度报告复现。","requirements":"学历：总部硕士起步、分支机构本科起步（财联社统计，E2）；头部研究所偏好清北复交、两财一贸硕士，理工科复合背景在TMT或医药组加分（推断）。专业：金融、经济、会计、理工科。证书：证券从业资格入职必需，CFA或CPA加分，CPA对财务模型和审计科目理解帮助最大。技能：Excel三表模型、Wind或Choice或iFinD、Python或VBA处理数据、英语读外文财报和论文；写作能力是硬门槛。院校偏好无官方标准。","process":"典型：网申→线上测评或笔试（行测、财务、行业常识）→一面（研究框架、推票、简历深挖）→二面（首席或所长，深度报告或模型）→实习考核1–3个月→答辩留用。面经（牛客，华泰研究所2022-11）：推荐一只股票并用三句话概括核心逻辑；写一篇公司深度报告的框架；DCF流程；盈利预测收入增速很高的原因。广发策略组（牛客面经，2023-01）：分析CPI、社融，判断A股波动来源；讲一个产业的价量关系。淘汰点：推票只有结论没有量价拆解；DCF假设说不清；报告是拼凑的，追问数据来源就断；实习答辩讲不出自己的贡献。","exit":"内部：助理分析师→分析师→高级或首席→所长助理；也可转销售交易、机构销售、资本市场部。外部：公募、私募、保险资管的研究或投资经理，产业基金，上市公司IR或董秘，咨询。研究是技能迁移最广的岗位之一，但收入端受压，建议入行前想清楚是走首席路线还是2–3年转买方。","batches":"2027届秋招：中信证券2026-09-01前后启动、聚合页16个岗位（含研究岗，岗位级HC未公布，E2）；中金公司2027届申请窗口2026-09-08至10-28（已截止，E3）；至少36家券商启动2027届校招、13家公布人数合计超2200人（E3，含全条线）。研究所通常不单列HC，按组招1–3人，实习留用是主渠道；日常实习滚动招聘、3–6个月、答辩转正。当前2026-11，2027秋招基本截止，关注春招补录和日常实习。","certs":"证券从业资格（证券行业专业人员水平评价测试）入职必需；基金从业资格加分；CFA二级以上、CPA（会计或财管）、FRM在固收或策略组加分；投资顾问资格对转财富端有用。","wlb":{"score":2,"text":"判断分2。依据：2026年10月19至25日物理AI主题电话会，Wind可查纪要18场、覆盖16家研究所，其中14场集中在10月24至25日周末，占77.78%，热点期周末路演是真的。用户笔记里“券商研究所007”我标为二手传闻E3：没有任何公开工时统计能证明全员全年每天加班；能证实的是热点期高强度、财报季和评选期集中加班。平时朝八晚九较常见（推断，需向在职分析师核实）。","grade":"E3","src":[{"t":"21世纪经济报道：物理AI刷屏，券商分析师电话会排满（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610283910684540.html","date":"2026-10-28"},{"t":"蓝鲸新闻：中信建投6名新首席能否托住科技研究产能（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610213903026848.html","date":"2026-10-21"}]},"growth":{"score":3,"text":"路径：助理分析师→分析师→高级分析师或首席→所长助理或副所长，评选（新财富、水晶球）和派点决定话语权。壁垒是产业理解、模型和客户关系。收入端在收缩：2025年全行业分仓佣金105.7亿元，较2021年中信建投单家逾10亿元的高点已大幅回落；2026年上半年虽同比+95.13%到87.27亿元，但费改后单家上限15%、主动权益佣金费率不超过市场平均2倍，中小研究所生存更难。出口：买方研究、投资经理、产业研究、上市公司IR或董秘。"},"salary":{"range":"首年总包约20–40万元（税前；头部研究所上限，中小所与区域组更低）","basis":"E3推断，无官方应届披露。交叉验证：一，2025年全员人均职工现金支出（支付给职工现金÷员工数，E2，含高管和中后台）：中信证券72.26万、中金公司76.64万、广发证券66.91万、华泰证券65.54万、招商证券54.63万元；南都湾财社按应付职工薪酬调整口径：中信81.28万、中金79.93万、广发77.25万。二，研究所收入来源：2026年上半年全行业分仓佣金87.27亿元（Wind，E2），2025年全年105.7亿元；投资咨询业务净收入仅50.96亿元（中证协，E1），是经纪业务的1/20。三，结构推断：应届base约1.5–2.5万元/月，奖金看派点和评选，首年20–40万元；中小所可能低于20万元。区间是判断，不是承诺。","grade":"E3","src":[{"t":"头部券商人均薪酬盘点（南都湾财社）","url":"https://m.163.com/dy/article/KPUDVDEO05129QAF.html","date":"2026-04-07"},{"t":"界面新闻：监管通报券商为基金境外调研买单被查（东方财富网转载，含Wind分仓佣金）","url":"http://finance.eastmoney.com/a/202610193900073024.html","date":"2026-10-19"}]},"cities":["北京","上海","深圳"],"sample_orgs":["中信证券研究部","中金公司研究部","华泰证券研究所","广发证券发展研究中心","国泰海通证券研究所","招商证券研究发展中心","中信建投研究发展部","申万宏源研究所","兴业证券经济与金融研究院","光大证券研究所"],"src":[{"t":"中国证券业协会：证券公司2026年上半年度经营数据","url":"https://www.sac.net.cn/xxgk/hysj/jjsj/202609/t20260903_82250.html","date":"2026-09-03"},{"t":"界面新闻：监管通报券商为基金境外调研买单被查（东方财富网转载，含Wind分仓佣金与费改规则）","url":"http://finance.eastmoney.com/a/202610193900073024.html","date":"2026-10-19"},{"t":"21世纪经济报道：物理AI刷屏，券商分析师电话会排满（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610283910684540.html","date":"2026-10-28"},{"t":"蓝鲸新闻：中信建投6名新首席能否托住科技研究产能（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610213903026848.html","date":"2026-10-21"},{"t":"华泰证券研究所行研岗面经（牛客网）","url":"https://www.nowcoder.com/discuss/422892259764359168","date":"2022-11"},{"t":"广发证券研究部策略组面经（牛客网）","url":"https://www.nowcoder.com/discuss/442600307047063552","date":"2023-01"}],"qn":12},{"id":"brk.prop","typical_day":["开盘前看隔夜外盘、利率和资金面，核对持仓与风控限额","盘中盯盘，按策略建仓、调仓，用股指期货或国债期货调整对冲比例","收盘后做当日损益归因，更新VaR、止损线和集中度","下班前后跟研究员、销售交流行业观点，准备投资例会材料"],"role":"券商自营投资","group":"broker","org_type":"证券公司","work":"券商自营是用自有资本做证券投资，分方向性和非方向性：方向性做权益、固收的仓位与久期；非方向性做做市、基差套利、衍生品对冲和客需业务。日常看隔夜外盘、资金面、持仓与限额，盘中建仓调仓、用股指期货或国债期货调整对冲比例，收盘做损益归因、VaR、压力测试和集中度。考核看绝对收益、回撤、风险调整后收益和风险覆盖率。2026年前三季度43家上市券商自营净收入2035.9亿元、同比+8.66%，但只有13家增长、10家下滑超三成，分化极大。","intern_fit":"最加分：券商自营、资管或公募的固收或权益研究、交易实习；期货公司研究；量化对冲实习。你的光大TMT研究（三表模型、DCF量价拆分）可迁移到权益自营的行业配置；工行对公信贷尽调（收入质量、现金流、应收周期、第一还款来源）可迁移到信用债自营的发行人分析。缺口是没有实盘和风控指标经验，建议用本题库brk2-18的VaR与止损题、brk2-17的久期杠杆题做复现。","requirements":"学历：总部硕士起步（财联社，E2），头部自营偏好清北复交、两财一贸及海外名校的金融工程、数学、统计、计算机硕士，博士在量化或衍生品条线加分。专业：金融工程、数学、统计、计算机、物理。证书：证券从业必需，CFA或FRM加分，期货从业对衍生品对冲有用。技能：Python或C++、SQL、Excel，期权定价、VaR、久期、压力测试；有交易或模拟盘记录加分。性格：能承受回撤、守纪律。","process":"典型：网申→笔试（数学、概率统计、编程、市场常识）→一面（投资框架、简历）→二面（投资经理或风控负责人）→实习或模拟盘考核→终面。淘汰点：只说收益不说回撤和止损；不懂风险覆盖率与资本杠杆率；对持仓没有独立观点；模拟盘爆仓或不止损。公开面经较少，流程多为业务推断（infer）。","exit":"内部：交易员或研究员→投资经理→条线负责人；横向转资管、衍生品、做市。外部：公募或私募基金经理、保险资管、银行理财子、期货资管、家族办公室。自营的业绩记录是硬通货，2–3年可带着归因报告跳买方。","batches":"2027届：中信证券2026-09-01前后16个岗位（含自营或交易类，岗位级HC未公布，E2）；中金公司2027届2026-09-08至10-28（已截止，E3）；至少36家券商启动2027届校招、13家公布人数合计超2200人（E3）。自营岗位通常挂在“投资交易”“固定收益”“权益投资”大类，不单列，招人少、实习留用为主。当前2026-11秋招截止，关注春招和日常实习。","certs":"证券从业必需；期货从业（股指或国债期货对冲）加分；CFA、FRM；CPA对信用债研究有用；Python和数学背景比证书更重要。","wlb":{"score":3,"text":"判断分3。依据：交易时段必须在线，收盘后做归因和风控报表；没有官方工时统计。2026年三季度市场回撤（沪深300较6月高点回撤二十多个点、中证1000回撤三十多个点）使自营在波动期加班做压力测试和止损；平时比投行承做规律。用户笔记“券商自营投研？”是疑问不是事实，我不把它当作工时证据。","grade":"E3","src":[{"t":"证券日报：上市券商三季报扫描（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610313917571652.html","date":"2026-10-31"},{"t":"澎湃新闻：天风证券第三季度净亏1.89亿元（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610303916830485.html","date":"2026-10-30"}]},"growth":{"score":4,"text":"路径：研究员或交易员→投资经理→高级投资经理→条线负责人或首席投资官；需要管钱业绩和回撤记录。壁垒是资产配置、风险定价和对冲工具，头部券商自营已从方向性博弈转向资产配置加客需（东方财富证券研报判断）。收入弹性大，但递延和追索常见：江海证券2026年10月因投行业务薪酬递延支付执行不到位被黑龙江证监局警示，说明行业确有递延。出口：公募或私募基金经理、保险资管、银行理财子、企业资金部。"},"salary":{"range":"首年总包约25–50万元（税前；头部自营上限，中小券商更低，奖金多递延）","basis":"E3推断，无官方应届披露。交叉验证：一，2025年全员人均职工现金支出（E2，含高管和中后台）：中信证券72.26万、中金公司76.64万、华泰证券65.54万、广发证券66.91万、招商证券54.63万元。二，业绩波动：2026年前三季度43家上市券商自营净收入2035.9亿元、同比+8.66%，但10家下滑超三成，自营条线奖金与当年损益强相关。三，结构推断：应届base约1.8–2.8万元/月，首年25–50万元；头部权益或衍生品条线可到上限，中小券商低于25万元。区间是判断，不是承诺。","grade":"E3","src":[{"t":"中国证券业协会：证券公司2026年上半年度经营数据","url":"https://www.sac.net.cn/xxgk/hysj/jjsj/202609/t20260903_82250.html","date":"2026-09-03"},{"t":"证券日报：上市券商三季报扫描（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610313917571652.html","date":"2026-10-31"}]},"cities":["北京","上海","深圳"],"sample_orgs":["中信证券","中金公司","华泰证券","国泰海通","招商证券","广发证券","申万宏源","东方证券","光大证券","中信建投"],"src":[{"t":"中信证券第八届董事会第四十四次会议决议公告（议案五：2026年度自营投资额度）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202603261820772911&client_source=web&page_index=1","date":"2026-03-26"},{"t":"中信证券2026年半年度报告（市场风险一节）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608201828210938&client_source=web&page_index=13","date":"2026-08"},{"t":"中国证券业协会：证券公司2026年上半年度经营数据","url":"https://www.sac.net.cn/xxgk/hysj/jjsj/202609/t20260903_82250.html","date":"2026-09-03"},{"t":"证券日报：上市券商三季报扫描（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610313917571652.html","date":"2026-10-31"},{"t":"澎湃新闻：天风证券第三季度净亏1.89亿元（东方财富网转载）","url":"http://finance.eastmoney.com/a/202610303916830485.html","date":"2026-10-30"}],"qn":14},{"id":"brk.wm","typical_day":["早上看行情和晨报，筛选当天要沟通的客户和产品","白天做客户回访、账户诊断和产品讲解，核对风险测评与适当性材料","下午参加产品路演或培训，跟进开户、两融、基金投顾等签约","收盘后复盘客户持仓，整理营销话术与合规留痕，晚上做线上直播或社群运营"],"role":"券商财富管理/经纪/投顾","group":"broker","org_type":"证券公司","work":"财富管理或经纪是券商零售条线：通过营业部、App和投顾团队服务个人与中小机构客户，做开户、交易、两融、基金代销、基金投顾和资产配置。日常是晨会看行情和产品、客户回访与账户诊断、风险测评与适当性材料、产品路演和培训、签约与合规留痕；考核看客户资产净流入、交易佣金、代销收入、两融余额和投顾签约。2026年上半年行业经纪净收入1041.35亿元、同比+51.27%，但净佣金率降到1.65bp、同比-23.57%，靠成交量补价。","intern_fit":"最加分：券商营业部或财富管理实习（开户、客户活动、产品路演）、基金渠道销售、银行零售或私人银行实习。你的光大TMT研究能帮你把产品和市场讲清楚，百度金融AI Agent研究能讲智能投顾；但缺客户资源和销售记录，面试要准备“没有资源怎么获客”的答案（本题库brk2-36）：靠研究内容获客、老客户转介和小而稳的组合，并先问清考核口径。","requirements":"学历：分支机构本科起步、总部硕士起步（财联社，E2）；营业部更看沟通和抗压，院校要求相对宽。专业不限，金融、经济、营销优先。证书：证券从业、基金从业是硬门槛，证券投资顾问资格是转买方投顾的关键；AFP或CFP加分。技能：客户沟通、产品理解、Excel、企业微信运营；有客户资源或社团销售经历加分。","process":"典型：网申→测评→一面（群面或半结构）→二面（营业部或分公司）→实习或培训→考核（开户数、资产量）。面经（牛客，光大财富管理2023-01）：3v1约20分钟，问为什么选财富管理、为什么不投之前实习过的公司和方向、买方研究和卖方研究哪个更难、专业和考证的帮助、讲一段有挑战的经历；东方证券营业部（2020-11）直接问能引进多少资产、有没有资源、能不能做营销，转正有资产量要求。淘汰点：排斥营销、没有客户资源、合规意识弱、抗压差。","exit":"内部：客户经理→投顾→团队长→营业部负责人；转产品、机构销售、私人银行。外部：私人银行、家族办公室、基金或保险渠道销售、独立投顾、FA。客户资源和合规记录是长期资产。","batches":"2027届：中信证券16个岗位（含财富管理或分支机构，岗位级HC未公布，E2）；中金公司2027届2026-09-08至10-28（已截止，E3）；至少36家券商启动2027届校招、13家公布人数合计超2200人（E3）。财富管理和营业部是券商校招HC最大的条线，常年滚动招聘日常实习和春招；总部投顾岗少、分支多。当前2026-11秋招截止，营业部补录和实习转正机会多。","certs":"证券从业、基金从业（代销基金必需）、证券投资顾问资格（投顾展业必需）；AFP或CFP、CFA一级加分；若代销保险需保险从业资格。","wlb":{"score":3,"text":"判断分3。依据：交易日要在岗，晚上和周末常做客户活动、直播和社群运营；营业部有开户和资产考核，季末冲量。没有官方工时统计。2026年上半年境内股票基金日均交易量3.24万亿元（中信证券半年报，E1），行情活跃时客户咨询量大。比投行和研究规律，但营销压力是另一种累。","grade":"E3","src":[{"t":"中信证券2026年半年度报告（财富管理一节）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608201828210938&client_source=web&page_index=7","date":"2026-08"},{"t":"光大证券财富管理面经（牛客网）","url":"https://www.nowcoder.com/discuss/442600561515487232","date":"2023-01"}] 和回撤控制是晋升与薪酬的关键。横向可转FOF、专户、养老金投资，或外部的私募二级、保险资管权益岗。"},"salary":{"range":"首年总包约30–50万元（投研序列入口，二手传闻，E3）；晋升到基金经理助理后约100万元出头（知乎问答摘要称“研究员干4到5年约70万，再做3年左右基助一百多万”，二手传闻）","basis":"二手传闻，E3：知乎两篇原文本次读取均返回HTTP 403，但搜索摘要可读：问答页（zhihu.com/question/353164310，针对权益投研）称“除efund外其他公募起薪差异不大，应届总包30多万税前甚至不到；研究员干4到5年package升到70万左右；再做3年左右基助，一百多万”；专栏（zhuanlan.zhihu.com/p/609611047）称“除易方达外，绝大部分base集中在10到15K，年终奖是大头”。公募年报人均薪酬和招聘页薪资本次没读到，无官方数据交叉验证，谈薪以书面offer为准。能核对的机制：证监发〔2025〕21号第8条要求绩效薪酬与基金投资收益挂钩、实行延期支付，对三年以上业绩低于基准超过10个百分点的基金经理要求绩效薪酬明显下降，官方没有写降薪比例。","grade":"E3","src":[{"t":"证监会 证监发〔2025〕21号《推动公募基金高质量发展行动方案》","url":"https://www.csrc.gov.cn/csrc/c100028/c7555824/content.shtml","date":"2025-05-07"}]},"intern_fit":"对口：公募基金权益投研的研究助理类日常或暑期实习（牛客2022年帖称公募日常实习少见，中后台需求小，多数人到暑期才接触公募，暑期留用后秋招可能不再开放）；券商研究所行业研究助理，券商资管、保险资管的权益投资部实习，二级私募研究助理。易方达2026年暑期招聘宣讲会在清华举办的日期为2026-03-18，可作为2027暑期节点的参照（推断）。你在光大证券TMT研究部跟踪兆易创新、搭建半导体设计公司15+指标框架的经历可以直接迁移为调研纪要和跟踪卡能力。","requirements":"学历：易方达2027届秋招页登记学历为博士、博士后、硕士（清华就业中心转载），牛客2022年帖称研究类岗位门槛最高，不建议经历少、学校在两财一贸甚至复交以下的同学投递。本科生更现实的路径是日常或暑期实习，再争取硕士阶段进入。专业：金融、经济、数学、统计、计算机。技能：财务三表与估值、Excel与Wind、Python或SQL、业绩归因基础、写调研纪要；易方达笔试含英语阅读理解和资料分析。证书：基金从业知识常被笔试考到（东海基金面经）。","process":"以易方达2027届为例（官方简章）：网申最多2个岗位，面试优先第一志愿；笔试为90分钟70题的认知能力测试；初次面试10月中下旬滚动进行；11月起实习考察，不超过2周；通过课题答辩及后续面试后发放留用offer。东海基金权益研究员面经（2024-11）：笔试30分钟30题，含基金从业与行测；群面预约制，每场最多10人，三位面试官，题目是每人当基金经理为灵活配置产品配半年度持仓类别和占比并汇报，作者因没有关键发言、方案采纳率低而感觉不佳。牛客2021年帖称公募常见主管面一对一或多对一，围绕简历深挖，会压力追问实习细节。助理岗通常不直招，要先进入研究员序列，再经内部竞聘或经理提名转岗，年限因公司而异（推断）。","exit":"基金经理助理→基金经理（先管小规模账户或专户，再到公募产品）；内部可转FOF、养老金投资、多资产、专户；外部可去私募二级、保险资管权益、券商资管和自营。下一跳取决于调研与选股产出是否被经理采用，以及回撤控制记录（推断）。","batches":"易方达2027届秋招：网申至2026-10-11（清华就业中心页显示截止日期2026-10-12），笔试2026-10-24和25日共4场任选1场，初次面试10月中下旬滚动，11月起实习考察不超过2周；这一批对2027届同学已错过网申，需关注春招、补录和2027暑期实习。HC：官方未公布岗位级HC，页面登记招聘人数100是全部岗位合计，学历要求登记为博士、博士后、硕士，简章投研类岗位未列基金经理助理。华夏、广发、南方、嘉实、富国、汇添富、招商、博时、天弘的2027届简章本次未读到，批次与HC记为未公布；易方达官网job.efunds.com.cn本次也未打开。补充（同花顺2026-09-14报道，E2）：博时2027届校招岗位含“FOF专户投资经理助理”“行业研究员”，是少数把“投资经理助理”直接写进校招岗位名的公募之一（对应FOF专户，不是公募权益产品）；嘉实投研类含“股票行业分析师”“策略分析师”“人工智能分析师”；招商含“权益研究员”。多数公司仍以研究员为入口，助理由内部晋升。华夏chinaamc.zhiye.com、广发gffunds.jobs.feishu.cn、嘉实jsfund.cn招聘页为动态页面，本次未读到岗位级HC与截止日。","certs":"基金从业资格（行业通行入门证书，东海基金笔试含基金从业知识）；CFA、FRM、CPA为加分项（牛客2021年帖作者提到自学证书，非官方要求）；官方简章未写证书要求。","cities":["北京","上海","广州","深圳","香港","横琴"],"sample_orgs":["易方达基金","华夏基金","广发基金","南方基金","嘉实基金","富国基金","汇添富基金","招商基金","博时基金","天弘基金"],"src":[{"t":"易方达基金2027届秋季校园招聘简章（清华大学学生职业发展指导中心转载，更新2026-09-08）","url":"https://career.cic.tsinghua.edu.cn/xsglxt/f/jyxt/anony/showZwxx?zpxxid=564006855","date":"2026-09-08"},{"t":"22金融秋招回顾 || 公募基金篇（牛客，牛妞来啦）","url":"https://www.nowcoder.com/discuss/407543045653098496","date":"2022-10-06"},{"t":"公募基金中台#面试经验分享（牛客，肉丝儿11）","url":"https://www.nowcoder.com/discuss/353149092144553984","date":"2021-06-05"},{"t":"东海基金 面经（牛客）","url":"https://www.nowcoder.com/feed/main/detail/bd805cdd9a5b42adb7ddfb2be9701421","date":"2024-11-18"},{"t":"金融面经|招商基金实习（牛客）","url":"https://www.nowcoder.com/discuss/607287271183618048","date":"2024-04-09"},{"t":"证监会 证监发〔2025〕21号《推动公募基金高质量发展行动方案》","url":"https://www.csrc.gov.cn/csrc/c100028/c7555824/content.shtml","date":"2025-05-07"},{"t":"开始抢人了！易方达、南方、嘉实、博时、招商、华安、天弘、鹏华、永赢等头部基金公司开启校招（同花顺财经转载）","url":"https://fund.10jqka.com.cn/20260914/c679872182.shtml","date":"2026-09-14"}],"qn":12},{"id":"buy.pub.fof","group":"buy","org_type":"公募基金","role":"公募·FOF与基金研究","work":"围绕FOF与基金池做研究：收集整理基金产品、定期报告和市场信息；对重点覆盖的基金做调研和经理访谈，写基金研究报告；做基金评价（业绩归因、风格检验、风险分析）和资产配置策略研究；向FOF投资经理提示所跟踪基金或经理的机会与风险；维护基金数据库和评价模型。公募大公司通常把这类岗位放在资产配置、多资产或FOF投资部：易方达2027届简章投研类岗位里对应的名称是“资产配置研究员”“多资产研究员”，没有单列“FOF研究员”。","typical_day":["读前一日基金净值、仓位和持仓变化，更新基金池跟踪表（对应JD职责：基金产品数据统计分析和维护）","与重点基金的经理或投资总监沟通，核对投资逻辑、换手和风格是否变化（对应JD职责：调研和相关人员访谈）","季报和半年报披露期拆基金持仓，做业绩归因和风格检验，写基金研究报告","配置会前把基金池结论翻译成组合建议，向FOF投资经理提示机会与风险","用Python维护基金数据库，迭代评价模型（东证期货FOF方向实习JD写明熟练使用Python与数据库）"],"wlb":{"score":3,"text":"推断，未读到该岗位加班的直接证据：研究岗节奏通常随季报披露期和配置会前集中，平时相对平稳；真实强度以面试时向在职同事核实为准。典型日程由JD职责归纳，不是实测。","grade":"E3","src":[{"t":"兴证全球基金 FOF与量化研究岗 招聘（职责描述，牛客网）","url":"https://www.nowcoder.com/discuss/465151818595606528","date":"2023-03-14"}]},"growth":{"score":4,"text":"推断：先做基金研究和数据底座，之后参与基金经理尽调和配置建议，向FOF基金经理助理、FOF基金经理发展；横向可转公募权益、固收、多资产研究岗。限制因素是FOF单只规模偏小：东财截至2026-09-30的数据里，易方达汇诚养老2043三年持有A为2.52亿元，华夏安盈稳健养老目标一年持有A为0.35亿元，团队编制和岗位数大概率有限（推断）。"},"salary":{"range":"公募口径首年总包约30–50万元（二手传闻，E3）；参照证券资管FOF研究岗：基本薪酬约14.4–26.4万元/年（月薪12–22K×12薪，不含奖金，E3）","basis":"东方财富证券资管FOF研究员25届校招（牛客职位页，招聘方HR发布）：12-22K×12薪，上海，本科，2024-09-02至2024-11-30投递，已结束。东证期货基金研究员（FOF方向）实习：50-80元/天，3天/周，最少2个月，要求硕士，2023年职位已结束。知乎两篇原文因站点反爬返回403未能读取，但搜索摘要可读：问答页（zhihu.com/question/353164310，针对权益投研）称“除efund外其他公募起薪差异不大，应届总包30多万税前甚至不到；研究员干4到5年package升到70万左右”；专栏（zhuanlan.zhihu.com/p/609611047）称“除易方达外，绝大部分base集中在10到15K，年终奖是大头”。FOF研究岗没有独立的公募数据，公募总包按这一量级取30到50万，仅作二手参考；公募年报人均薪酬未读到，无官方数据交叉验证。","grade":"E3","src":[{"t":"资管FOF研究员（证券投研类）-25届秋季校招（东方财富，牛客职位页）","url":"https://www.nowcoder.com/jobs/detail/354972","date":"2024-09-02"},{"t":"基金研究员（FOF方向）实习（东证期货，牛客职位页）","url":"https://www.nowcoder.com/jobs/detail/229229","date":"2023-04-13"}]},"intern_fit":"对口：公募基金研究与资产配置实习（易方达简章：10月笔试后，11月起实习考察，不超过2周）；券商、银行理财子公司、保险资管的FOF或资产配置岗实习；东证期货基金研究员（FOF方向）类实习（2023年职位，3天/周，最少2个月，要求Python与数据库）。你在光大证券TMT研究部实习中可迁移的是拆增长来源、核对口径、多轮修订假设的研究方法，不是基金研究经验。","requirements":"学历：兴证全球FOF与量化研究岗要求硕士研究生及以上（上海，2023年发布）；东方财富证券资管FOF研究员25届校招为本科及以上，金融工程、金融数学、计算机、数学、物理相关专业优先；易方达2027届招聘对象为2026年9月至2027年8月毕业的应届生。技能：熟悉Python、数据库、Matlab者优先；会做业绩归因、风险指标和风格分析。证书：两份JD均未写证书要求，基金从业资格是行业通行入门证书（未读到官方原文，按惯例推断）。英语：易方达笔试含英语阅读理解。","process":"以易方达2027届为例（官方简章，清华就业中心转载，更新2026-09-08）：网申至2026-10-11，每人最多申请2个岗位，面试优先第一志愿；笔试为认知能力测试，90分钟70题，含英语阅读理解、中文言语理解、数字运算、逻辑推理、思维策略和资料分析，10月24日和25日共4场任选1场，简章称分数不影响后续面试评价，违纪取消后续所有推进资格；初次面试10月中下旬滚动进行；11月起实习考察，不超过2周；通过课题答辩及后续面试后发放留用offer。面经里的淘汰点（牛客易方达基金研究员面经）：夏普、信息比率、最大回撤的理解，基金池维度，阿尔法贝塔区分，风格识别，基金经理信息渠道及验证，新品类学习。","exit":"推断：公募内部向FOF基金经理助理、FOF基金经理、多资产或权益、固收研究岗转岗；外部去银行理财子公司、保险资管、养老金、券商资管的FOF或资产配置岗位（东方财富证券资管FOF研究员属同类岗位），或第三方基金评价和投顾机构。","batches":"易方达2027届秋招网申已于2026-10-11截止（清华就业中心页显示结束投递日期2026-10-12），笔试10月24日和25日已过，面试10月中下旬滚动，11月起实习考察；对2027届同学这一批已错过，需关 90112413696"]},"growth":{"score":4,"text":"常见路径：销售助理或销售支持，再到机构销售、区域负责人、机构业务部总监；也可转渠道销售、产品，或转保险资管、银行理财子的客户端与合作岗。增量来自机构资金入市：证监会主席2026-06-06致辞称公募规模已突破39万亿元、权益类占比不到30%（成熟市场约60%）；《关于推动中长期资金入市工作的实施方案》要求公募基金持有A股流通市值未来三年每年至少增长10%、大型国有保险公司每年新增保费力争30%投A股（2025-01-23，E1）。个人价值取决于客户资源和基金经理业绩，不取决于资历。"},"salary":{"range":"首年总包约25万–45万元（税前，含年终奖，浮动大）","basis":"二手传闻，E3，未能核实：①知乎问答摘要称“应届总包30多万税前甚至不到”“研究员干4到5年package升到70万左右”（针对权益投研；原文403未读到，经同批固收研究员岗位卡转引）；②你笔记里的“大公募机构销售六七年经验总包可到100万”：本次没有查到任何一手薪酬数字，华夏、华安已读岗位页薪资一律“面议”（E1），唯一可交叉的是华夏机构销售团队长岗位要求“8年以上基金公司机构销售工作经验”，只能说明资深岗位存在，不能证实100万。机构销售总包取决于保有量与销量分成，方差大于研究岗；谈薪以书面offer为准。","grade":"E3","src":["https://www.zhihu.com/question/353164310","http://chinaamc.zhiye.com/szzwxq?jobId=190836491","http://chinaamc.zhiye.com/szzwxq?jobId=190823323"]},"intern_fit":"对口实习：公募机构销售或销售支持、渠道销售、市场部实习；券商研究所机构销售或财富管理实习；银行理财子、保险资管的客户端实习。没有对口实习时，用研究类实习证明你能把观点讲给客户听，并准备一份自己写的1页基金经理画像或同类产品对比表（永赢机构销售支持面经里被追问“写基金经理画像用了哪些工具”）。","requirements":"学历：华安2027届机构销售岗写“硕士研究生及以上学历”，并要求“具备一定机构或零售渠道实习经验”“能因工作需要进行适当的出差”；华夏社招机构客户经理要求“金融机构销售工作经验2年以上”。专业：金融、经济为主。证书：基金从业资格（科目一加科目二）。技能：Wind、Excel与PPT，书面和口头表达；英语（易方达海外机构销售面经为英文问英文答）。","process":"面试形式因机构而异：永赢机构销售支持（2022暑期）笔试后电话约面，仅1轮、2位面试官；易方达海外机构销售（2021秋招）线上单面约15分钟、同场15人、多为英文；卖方机构销售常见三轮（群面、英文面、能否加班出差）；易方达2027届笔试为认知能力测试，90分钟70题，类似行测。主要淘汰点：笔试、岗位理解（机构销售与销售支持的区别）、行为面中的压力与客户冲突题，以及选销售的动机。","exit":"出口与下一跳：机构销售→区域或行业负责人→机构业务总监；也可转渠道销售、产品，或转券商机构销售（卖方）、保险资管和银行理财子的合作岗。想转投资岗，需要补研究或投资经历。","batches":"华安基金2027届秋招：上海、北京、深圳岗位2026-08-27发布，机构销售上海HC 3；易方达2027届秋招网申2026-10-11截止，笔试10月24日、25日（见同批固收研究员岗位卡）；华夏应届和实习入口在2026-10-28显示“暂无在招职位”，其暑期实习“一般于每年3-4月启动，面向下一年度毕业生”；华夏社招机构客户经理（北京、上海）2026-10-08发布、10-31截止，北京HC 1。2027年暑期实习多数公募未公布时间，按往年3–4月启动准备。","certs":"基金从业资格：公募机构需科目一《基金基础知识与法律法规》和科目二《证券投资基金基础知识》；中基协通知显示2026年全国统考日为5月23日，单科120分钟、60分合格、报名费61元/科次。证券从业资格不是必需；CFA、CPA加分。","cities":["北京","上海","深圳","广州"],"sample_orgs":["易方达基金","华夏基金","广发基金","南方基金","嘉实基金","汇添富基金","招商基金","华安基金","永赢基金"],"src":[{"t":"华夏基金社招“机构客户经理”岗位页（北京/上海）","url":"http://chinaamc.zhiye.com/szzwxq?jobId=190823323" /353157470963048448","date":"2021-01-11"},{"t":"中国基金报：2025年基金四大费用合计2046.46亿元（客户维护费394.60亿元）","url":"https://www.chnfund.com/article/ARff33ce04-410e-dc0a-952e-3a205a0d5767","date":"2026-10-28"}],"qn":12},{"id":"buy.pub.product","group":"buy","org_type":"公募基金","role":"公募·产品经理/产品运营","work":"公募产品岗位管理基金产品的全生命周期：新产品立项与方案设计（投资范围、业绩比较基准、费率结构、份额分类、持有期）、监管注册与法律文件、发行安排与销售支持、存续期运营（规模、持有人结构、申赎监控）和信息披露。华安基金2027届产品经理岗原文写“协助撰写公募基金产品方案、法律文件等相关材料，跟进监管报备和信息披露相关流程”；华夏社招的基金管家App产品经理“负责华夏基金管家App的用户侧产品功能设计、优化与迭代”，属于线上产品与运营方向，易方达的银行线上运营、券商线上运营岗也在这一条线。","typical_day":["上午与投研、销售、合规开产品评审会，讨论拟发行产品的赛道、基准、费率和募集目标。","写产品方案，对照基金合同与招募说明书整理要点，准备监管报备材料。","发行期与渠道、销售同步募集进度，调整路演和宣传节奏。","存续期看规模、申赎和持有人结构日报，识别大额申赎，写产品运营月报。","季度做产品线盘点：重叠产品、规模过小产品、清盘或转型预案。"],"wlb":{"score":3,"text":"个人判断，无一手数据：发行期和监管报备节点赶材料时加班，平时偏规律；与投研、销售、合规三方沟通多，节奏受新发排期影响。易方达运营面经里问“活动前发现技术bug怎么抗压”，反映线上运营岗在活动日有突发情况。","grade":"E3","src":["https://www.nowcoder.com/discuss/798880617264939008"]},"growth":{"score":4,"text":"常见路径：产品助理→产品经理→产品总监；也可转市场、渠道、投资，或去互联网金融平台、银行理财子的产品岗。产品岗的价值在于把发行和存续做成规模：2026年三季度新成立基金513只、募集2445.92亿元，平均4.77亿元（国泰海通统计，东方财富转载，E2）；证监会同意首批18只主动ETF注册（2026-10-19），产品创新空间来自主动ETF、浮动费率基金和养老目标基金，但岗位数量少，通常按需招聘。"},"salary":{"range":"首年总包约20万–40万元（税前，含年终奖）","basis":"二手传闻，E3，未能核实：华安产品经理、华夏App产品经理与专户产品经理已读岗位页薪资一律“面议”（E1）；行业说法“除易方达外，绝大部分base集中在10到15K，年终奖是大头”（知乎专栏摘要，原文403未读到，经同批固收研究员岗位卡转引）。互联网背景的线上产品岗可能高于传统产品岗，本次没有一手数据；谈薪以书面offer为准。","grade":"E3","src":["https://zhuanlan.zhihu.com/p/609611047","https://huaan.zhiye.com/campusxq?jobId=351602279"]},"intern_fit":"对口实习：公募产品部、市场部、运营部实习；基金销售公司或互联网平台的基金产品与运营实习；券商资管、银行理财子的产品岗。没有对口经历时，准备一份自己拆解过的产品案例（一只ETF或主动基金的合同、费率、持有人结构、申赎变化），并能说清规模=用户数×户均金额这类拆解。","requirements":"学历：华安2027届产品经理要求“2027届硕士及以上学历”，专业“金融、经济、法律等相关专业”；华夏App产品经理社招要求“研究生及以上学历，3年以上互联网产品相关工作经验”；华夏专户产品经理“具备CPA、CFA等相关资格证书者优先”。技能：读基金合同和招募说明书、监管规则、Excel与SQL、产品文档和跨部门沟通。证书：基金从业资格。","process":"易方达暑期产品经理（2023，面经）：4月1日笔试，4月11日线下2对1面试，问到“看过《人人都是产品经理》吗，怎么定义PM”“介绍实习”“为什么想去广州”；汇添富（2022暑期产品岗）：笔试95分钟75题行测，一面为15分钟英文行为面，问“一段处理压力的经历”“为什么想做公募基金的产品经理”“有没有投资一些基金”； iscuss/353156845957226496","https://www.nowcoder.com/discuss/445913997943095296"]},"growth":{"score":3,"text":"常见路径：风控或合规专员→主管→风险管理部或合规稽核部负责人→督察长或首席风险官；也可转监管机构、券商合规风控、银行风险部。公募行业受监管驱动强：证监会2026-10-09公开征求《公开募集证券投资基金运作管理办法》修订意见（反馈截止2026-11-08），《业绩比较基准指引》2026-03-01施行，合规人才需求稳定；但晋升通道比前台窄，薪酬弹性也小。"},"salary":{"range":"首年总包约18万–35万元（税前，含年终奖）","basis":"二手传闻，E3，未能核实：华安稽核经理岗位页薪资“面议”（E1）；行业说法“除易方达外，绝大部分base集中在10到15K，年终奖是大头”（知乎专栏摘要，原文403未读到，经同批固收研究员岗位卡转引）。中后台总包低于前台是行业共识，但本次没有风控合规岗的一手数据，区间为个人判断；谈薪以书面offer为准。","grade":"E3","src":["https://zhuanlan.zhihu.com/p/609611047","https://huaan.zhiye.com/socialxq?jobId=351613764"]},"intern_fit":"对口实习：公募风险管理部、合规稽核部、监察稽核实习（华夏2026暑期实习说明列有“风控支持”岗）；券商合规风控、风险管理部实习；会计师事务所或银行的风险、内审实习。准备：用基金合同和运作管理办法条文做一次投资比例检查的练习（双十、80%、流动性受限资产15%）。","requirements":"学历：华安社招稽核经理要求“3年以上相关岗位工作经历”和“必须具备基金从业资格”；校招多为硕士，专业为金融、法律、会计、数学统计。证书：基金从业资格；CPA、CIA加分；FRM对风险岗加分（本次读到的岗位原文无FRM要求）。技能：读监管规则与合同、Excel与SQL与Python、VaR与跟踪误差等指标、清晰的书面表达。","process":"风控面经（2020–2023）：融通基金、华宸未来基金、易方达风控多为2人面（部门负责人加HR），问题偏基础：“为什么投这个岗位”“对于风险管理岗你怎么理解”“你觉得自己哪方面适合这个岗位”“自己有没有炒过股票，对债券了解多少”“这个岗位可能没有你想象中那么高大上，只是一些基础的工作，你如何看待”；广发证券市场风险岗（2023）笔试为性格测评加行测，面试问衍生品定价和毕业论文深挖。主要淘汰点：对中后台工作的接受度、基础风险指标（VaR、跟踪误差、夏普、信息比率）、对监管规则的熟悉。","exit":"出口与下一跳：风险管理或合规负责人、督察长；转券商或银行风险合规；转监管机构、协会、交易所；转投资绩效归因或产品岗。","batches":"华安社招稽核经理（上海，合规监察稽核部，2026-09-15发布，HC 1）；华夏社招列表无风控合规岗，其暑期实习说明含“风控支持”岗；公募风控合规的校招批次与HC官方未公布，多为按需招聘和实习转正。暑期实习按往年3–4月启动准备。","certs":"基金从业资格（稽核岗“必须具备”，科目一加科目二，2026年全国统考日5月23日）；CPA、CIA加分；FRM、CFA对投资风险岗加分。","cities":["北京","上海","深圳","广州"],"sample_orgs":["华安基金","华夏基金","易方达基金","融通基金","华宸未来基金","汇添富基金","南方基金","广发基金"],"src":[{"t":"华安基金社招“稽核经理”岗位页（合规监察稽核部，上海）","url":"https://huaan.zhiye.com/socialxq?jobId=351613764","date":"2026-09-15"},{"t":"华夏基金暑期实习说明（含风控支持岗，3-4月启动）","url":"http://chinaamc.zhiye.com/gzpp","date":"2026-10-28"},{"t":"易方达基金管理公司/Fullerton/丰田汽车金融风控面经（牛客网）","url":"https://www.nowcoder.com/discuss/353156845957226496","date":"2020-08-28"},{"t":"创富融资租赁，大华银行，华宸未来基金 风控面经 校招（牛客网）","url":"https://www.nowcoder.com/discuss/353156878169481216","date":"2020-09-02"},{"t":"融通基金，小米金融，点融网，光大银行信用卡中心风控面经校招（牛客网）","url":"https://www.nowcoder.com/discuss/353156865729175552","date":"2020-09-01"},{"t":"广发证券市场风险管理岗面经（牛客网，券商）","url":"https://www.nowcoder.com/discuss/445913997943095296","date":"2023-01-20"},{"t":"证监会：就《公开募集证券投资基金运作管理办法（征求意见稿）》公开征求意见","url":"https://www.csrc.gov.cn/csrc/c100028/c7663393/content.shtml","date":"2026-10-09"}],"qn":12},{"id":"buy.pub.quant","group":"buy","org_type":"公募基金","role":"公募·量化研究员/金融工程","work":"公募量化研究员为指数增强、量化选股、量化对冲、固收+和FOF提供因子、模型和组合构建支持：因子挖掘与检验（IC、分层收益、换手、容量）、多因子合成与风险模型（行业与风格中性、风险预算）、组合优化与交易成本、回测与实盘归因，以及产品化时的跟踪误差与超额来源分析。公募量化受合同约束（指数增强的跟踪误差与基准持股要求），与私募量化的区别是规模大、换手受限、监管更严。易方达2027届AI人才专场把固收量化列入投研方向，华安2027届校招有“指数研究员”（上海）岗。","typical_day":["早上看前一日组合的超额与风险暴露（行业、市值、动量、价值），查是否偏离基准。","上午做因子研究：清洗数据，算IC和分层收益，检验在不同市场环境下的稳定性。","下午更新模型与优化器参数，做回测并加入交易成本、涨跌停和容量约束。","与基金经理复盘超额来源，写周报：选股、行业、风格各贡献多少。","月度做因子拥挤度、换手和合规检查（持股比例、基准偏离）。"],"wlb":{"score":3,"text":"个人判断，无一手数据：偏研究，节奏相对规律；模型上线、调仓日和极端行情（如2024年2月的小盘股踩踏，中证1000从2024-01-02到02-05最大回撤26.67%，E3）压力大；量化岗位面试常含数学、编程笔试，准备成本高于其他公募岗位。","grade":"E3","src":[{"t":"上海玄信 量化研究员实习面经（牛客网；面试强度的参考，不是WLB一手数据）","url":"https://www.nowcoder.com/discuss/449616614917521408","date":"2023-01-30"}]},"growth":{"score":4,"text":"常见路径：量化研究员→量化基金经理助理→量化基金经理，或转量化私募、券商金工、保险资管量化。公募指数增强需要持续稳定的超额：按本次读到的数据，2026年10月28日止近1年，相对价格指数：富国沪深300增强A（100038）跑赢5.11个百分点，鹏华中证1000增强A（016785）跑赢2.62个百分点，富国中证500增强A（161017）落后1.72个百分点；但价格指数不含分红，换成中证指数公司的全收益指数后，三只分别是跑赢3.03、跑赢1.80、落后2.85个百分点（E3；基金净值来自天天基金，全收益指数来自中证指数官网）。同一赛道不同产品的差距可以大于管理费差，而且11个月的月度回归显示三只的超额都不显著。"},"salary":{"range":"首年总包约25万–50万元（税前，含年终奖）","basis":"二手传闻，E3，未能核实：公募岗位页薪资均“面议”；行业说法“应届总包30多万税前甚至不到”“研究员干4到5年package升到70万左右”（知乎问答摘要，针对权益投研，原文403未读到，经同批固收研究员岗位卡转引）。量化研究员与金工的薪酬通常高于其他中后台岗，量化私募远高于公募，但本次没有一手数据，区间为个人判断；谈薪以书面offer为准。","grade":"E3","src":[{"t":"知乎二手帖（返回403，未读到原文，仅搜索摘要）","url":"https://www.zhihu.com/question/353164310","date":"2026-10-28访问"},{"t":"华安基金2027届校招岗位列表（岗位页薪资均“面议”）","url":"https://huaan.zhiye.com/campus","date":"2026-07-30"}]},"intern_fit":"对口实习：公募量化或金融工程、量化私募研究实习、券商金融工程或量化研究实习、保险资管的量化与另类实习。准备：用Python复现一个单因子（动量或价值）的IC与分层回测，写明未来函数、幸存者偏差和交易成本怎么处理，并能解释同一中证500基准下两只增强基金近1年相差2.54个百分点的原因。","requirements":"学历：多为硕士及以上，专业为数学、统计、计算机、金融工程；华安校招“指数研究员”（上海，2026-07-30）只读到标题。技能：Python与pandas、SQL、统计与回归（共线性、过拟合、正则化）、因子与回测、机器学习（XGBoost）；笔试常含数学概率与代码题。证书：基金从业资格；CFA、FRM不是必需。","process":"牛客面经：上海玄信量化研究员实习（2023）共2小时10分钟4轮——简历、项目、数学、代码，问到“多元回归共线性”“过拟合解决方法”“有20日股票收盘价，关注股市哪些指标”以及数学题和数组题；私募量化策略研究员电话技术面（2023）问SQL索引、快速排序、C++编译过程、XGBoost、RNN；易方达量化研究面经（2025-09-30，10问题单，真实度存疑，未见回答）依次问：因子原理与类型；构建与检验新因子（追问市场环境差异与稳定性）；回测如何避免未来函数与过拟合；机器学习的应用与优势；市场中性与事件驱动的逻辑和适用场景；风控指标与简单风控模型；高频数据处理；绩效归因与收益来源；熟悉的工具与语言；未来3–5年需要的关键技能。主要淘汰点：统计基础、过拟合意识、代码与数学题。公募量化岗的校招批次和HC本次未读到。","exit":"出口与下一跳：量化基金经理助理→量化基金经理；转量化私募、券商金工、保险资管量化或银行理财子的量化团队；转FOF与资产配置研究；转风险管理中的模型岗。","batches":"华安2027届校招“指数研究员”（上海，2026-07-30发布）只读到标题；易方达2027届AI人才专场把固收量化列入投研方向（见同批固收研究员岗位卡）；华夏社招列表无量化岗。多数公募量化岗按需招聘、实习转正为主，HC未公布；暑期实习按往年3–4月启动准备。","certs":"基金从业资格（科目一加科目二，2026年全国统考日5月23日）；CFA、FRM、CPA不是必需；有竞赛、论文、开源因子库经历更有说服力。","cities":["北京","上海","深圳","广州"],"sample_orgs":["易方达基金","华夏基金","华安基金","广发基金","南方基金","嘉实基金","富国基金","长信基金"],"src":[{"t":"华安基金2027届校招岗位列表（含“指数研究员”，上海）","url":"https://huaan.zhiye.com/campus","date":"2026-07-30"},{"t":"易方达基金2027届校园招聘—AI人才专场招聘简章（安徽24365平台转载）","url":"http://24365.ah.smartedu.cn/job2.html?jid=9392&cid=20436","date":"2026-09-16"},{"t":"易方达量化研究面经（牛客网，题单形式）","url":"https://www.nowcoder.com/discuss/802558059049467904","date":"2025-09-30"},{"t":"上海玄信 量化研究员实习面经（牛客网）","url":"https://www.nowcoder.com/discuss/449616614917521408","date":"2023-01-30"},{"t":"私募量化策略研究员电话技术面试记录（牛客网）","url":"https://www.nowcoder.com/feed/main/detail/63d60a2876f849e49a49287d84ea2900","date":"2023-04-03"},{"t":"易方达基金研究员面经（牛客网，题单形式）","url":"https://www.nowcoder.com/discuss/802557058796044288","date":"2025-09-30"}],"qn":12},{"id":"buy.wm.fi","group":"buy","org_type":"银行理财子公司","role":"理财子·固收投研（固收研究/固收投资助理）","work":"理财子固收投研服务固收类、固收+和现金管理类理财产品的债券、同业存单和信用债投资。研究侧分利率与信用两条线：利率方向做曲线、久期和杠杆建议；信用方向建立发行主体内部评级、可投池和期限限额，并对一级新债给出定价意见。投资侧要在两个约束下工作：负债端是持有期、业绩比较基准和赎回安排，估值端是摊余成本法或市值法，需要每天跟踪影子价格、偏离度、DV01和流动性覆盖，并在市场急跌时做赎回压力测试。产出是日报、周报、可投池和投委会材料，向投资经理、投委会和风险管理部汇报，考核看研究被采用的程度、产品业绩与回撤、合规与流动性指标。","typical_day":["早盘：看隔夜资金价格（DR007、逆回购）、国债曲线和存单一二级，更新持仓DV01、久期，以及摊余成本法产品的影子价格，超限项标红（典型日程由岗位职责归纳，不是实测）","盘中：盯利率债、存单和国债期货，与投资经理沟通久期和杠杆；跟踪一级新债与存单发行，给出定价区间","午后：读发债主体财报和募集说明书，更新内部评级和可投池，参加信用评审","收盘后：核对申赎预估与流动性覆盖，跑赎回压力情景，写日报","月末、季末：配合规模与业绩归因，开放日前后加强流动性监控（推断）"],"wlb":{"score":3,"text":"判断分3，证据等级E3，没有读到任何一手工时数据。用户笔记的传闻是“理财子市场化程度低，压力小；投研+固收；权益是短板”，我逐项核对。第一，“投研+固收”有数据支持：2025年末固定收益类产品占理财存续的97.09%（理财登记托管中心年报，腾讯新闻转载，E2），固收岗位容量最大。第二，“权益是短板”有数据支持：2026年三季度末权益类产品0.11万亿元，占存续规模约0.31%，权益类资产占投资资产1.8%（经济参考网引登记中心季报）。第三，“压力小”读不到证据，反证是净值每日披露、客户对回撤敏感：2026年9月末公募理财破净率0.53%，固收类0.42%；“固收+权益”样本近1个月33.16%的产品收益为负（截至10月22日）；央行2026年10月26日专门设立针对赎回潮的债市非银大额赎回互换便利；2022年11月理财子公司产品破净占比曾达7.88%。所以“压力小”我标为传闻，不采信。真实强度请向在职同事核实三件事：开放日与月末季末的节奏，净值与业绩基准的考核权重，投研岗是否参与产品和销售沟通。","grade":"E3","src":[{"t":"理财登记托管中心《中国银行业理财市场年度报告（2025年）》（腾讯新闻转载）","url":"https://news.qq.com/rain/a/20260126A02E9700","date":"2026-01-26"},{"t":"经济参考网：理财市场规模站上35万亿元 权益类产品增长贡献微弱（东方财富转载）","url":"http://bank.eastmoney.com/a/202610293914461573.html","date":"2026-10-29"},{"t":"21世纪经济报道：理财三季度盘点③ 前三季度权益类理财产品承压固收类领跑（东方财富转载）","url":"http://money.eastmoney.com/a/202610303917015621.html","date":"2026-10-30"},{"t":"新华财经引中国人民银行官网消息：设立债市非银大额赎回互换便利（东方财富转载）","url":"http://forex.eastmoney.com/a/202610263908553137.html","date":"2026-10-26"}]},"growth":{"score":4,"text":"推断：固收是理财公司的主业，岗位容量大。2025年末固收类占理财存续的97.09%；2026年三季度末32家理财公司合计存续32.92万亿元，占全市场93.07%（媒体转引登记中心数据，E2/E3）。常见路径是研究员或投资助理，到投资经理助理，再到投资经理；也可转固收+、多资产或产品岗位。技能壁垒在信用研究、估值与净值管理、流动性管理，2022年11月赎回潮和2026年10月央行设立赎回互换便利之后，这三项更受重视。晋升节奏取决于母行与理财子的考核机制，官方数据没有读到。"},"salary":{"range":"首年总包约25–45万元（税前，含年终奖；我的推断，E3，未读到理财子薪酬原帖）","basis":"没有读到任何理财子薪酬的一手或二手原帖，所以不引用传闻数字。能核对的只有母行集团口径（东方财富数据中心，E2）：招商银行2025年支付给职工以及为职工支付的现金672.42亿元，除以员工121,959人，约55.13万元/人；工商银行1,481.03亿元，除以402,548人，约36.79万元/人。这个口径含社保、公积金和递延薪酬，且包含管理层，应届生通常低于均值，也不等于理财子薪酬。我据此给出25–45万元的宽区 ":"buy.ins.fi","group":"buy","org_type":"保险资管","role":"保险资管·固收与信用投资（资产负债匹配）","work":"保险资管固收与信用岗为保险公司账户（传统、分红、万能、财险）和第三方委托资金管理债券与信用资产。研究员跟踪利率、信用利差和曲线，给出久期、曲线与品种建议，覆盖国债、地方债、政策性金融债、银行二级资本债与永续债、公司信用债，以及债权投资计划、信托计划等债权型金融产品；信用研究建立内部评级、可投池与集中度限额，做新债申购和风险事件处置。与公募不同，投资约束来自负债端：要与保险公司资负部门对表，跟踪资产负债久期缺口、保单成本和偿付能力，并把债券放入AC、FVOCI还是FVTPL账户对利润与净资产的影响算进配置。考核看绝对收益、对负债成本的覆盖和风险限额，向投资经理、投委会和风险管理部汇报。","typical_day":["早间：看隔夜美债、DR007和央行公开市场操作，更新利率与信用日报；对照资负部门给出的新增保费和到期现金流，确认当天可投资金。","盘中：盯政府债、国开债与二永债的一二级定价，对新发债给申购建议，向投资经理汇报超限与异动。","午后：读发债主体财报和募集说明书，更新内部评级与可投池；参加信用评审会，讨论城投、地产和银行资本工具的限额。","收盘后：测算组合久期、DV01、资产负债久期缺口，以及不同会计账户下的利润与OCI敏感性，写日报。","季末与年末：配合保险公司做偿付能力测算、监管报送和会计分类复核，这一段工作量最大（以上日程由岗位职责推断，不是实测）。"],"wlb":{"score":3,"text":"判断分3。用户笔记传闻“市场化程度低，压力小；投研+固收；权益是短板”只能部分核实：①“固收为主”有数据：中国人寿2026年6月末固定到期日金融资产占投资资产69.50%、债券57.06%（半年报摘要，E1）；②“权益是短板”无法核实，且同一份半年报显示股票和基金（不含货币基金）占比由2025年末的16.89%升至19.14%，权益在加仓；③“压力小”只有一条二手旁证：牛客帖《国寿投资暑期实习避坑》称其金融科技部“不加班”，公司约两三百人（技术岗实习，不是固收投研，E3）。固收投研的工时与考核压力没有读到直接证据，所以整体标传闻。机制上，保险资金以绝对收益、长期持有为主，盘中交易压力通常小于公募和券商自营（推断）；季末年末的偿付能力测算、会计分类复核和监管报送是加班时点。","grade":"E3","src":[{"t":"牛客《实习避坑指南》国寿投资保险资产管理有限公司暑期实习","url":"https://www.nowcoder.com/feed/main/detail/bf748f55865748c09d2ea567a743a936","date":"页面日期未读到"},{"t":"中国人寿2026年半年度报告摘要第4页（东方财富公告库全文）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608271828538872&client_source=web&page_index=4","date":"2026-08-28"}]},"growth":{"score":4,"text":"判断分4。常见路径是研究员或投资助理、投资经理助理、固收投资经理、部门负责人，年限因公司而异（推断）。技能壁垒在于把利率、信用、会计和资本放到同一张表：久期缺口、AC/FVOCI/FVTPL分类、偿付能力占用（中国人寿2026年6月末综合偿付能力充足率197.78%、核心156.80%，E1）。账户规模大，中国人寿投资资产达79,461.01亿元（E1），但单个岗位的决策权受投资限额和母公司配置约束，业绩更多取决于大类资产配置与久期决策，而非个券交易。出口见exit。"},"salary":{"range":"首年总包约25–40万元（税前，含年终奖；二手传闻，未核实）","basis":"用户笔记所述“央企金融子公司薪资三档35W/30W/25W”为传闻，本次没有读到任何官方或招聘页的薪酬数据，也没有找到国寿资产、平安资管的薪酬披露。二者均非上市公司，母公司年报的人均薪酬被数十万营销人力摊薄，不适合交叉验证，未使用。唯一读到的薪酬旁证是牛客帖：国寿投资保险资产管理有限公司金融科技部暑期实习120元/天（技术岗实习，E3）。区间取传闻三档的跨度，谈薪以书面offer为准。","grade":"E3","src":[{"t":"牛客《实习避坑指南》国寿投资保险资产管理有限公司暑期实习（120元/天）","url":"https://www.nowcoder.com/feed/main/detail/bf748f55865748c09d2ea567a743a936","date":"页面日期未读到"}]},"intern_fit":"对口实习：保险资管、保险公司投资部或资负管理部的固收与信用研究实习；银行理财子、公募和券商资管的固收研究实习；评级机构与券商固收研究所的信用研究实习。你在工行公司银行部做的制造业对公信贷尽调（收入质量、现金流、应收周期、第一还款来源）可以迁移为信用债的主体分析；光大证券TMT研究部的三表与估值假设多轮修订，用来说明研究方法。缺口是固收与资负匹配的直接经历，建议补一段固收类实习，或至少准备久期缺口、二永债定价、AC/FVOCI/FVTPL三个现场作业。国寿投资有暑期实习通道的二手线索（6月官网投递，7月笔试，两轮面试，E3），固收岗位是否开放没有读到。","requirements":"学历与专业：2027届国寿资产、平安资管的岗位级学历要求没有读到；保险资管投资岗以硕士为主是二手经验，未核实。专业偏好金融、经济、数学、统计、精算，精算与会计背景在资负匹配和会计分类上加分。技能：久期、DV01、凸性，信用分析（财报与募集说明书），Wind或iFinD，Excel与Python或SQL；懂金融工具准则的分类（业务模式加SPPI测试）和偿付能力的基本逻辑。英语：读英文研报和国际评级报告。","process":"流程线索来自国寿系二手信息（E3）：官网投递，中国人寿集团统一笔试（形式和题型与秋招笔试基本相同，成绩在集团子公司间复用），随后两轮面试；国寿投资暑期实习的面试为3对1单面，十几分钟，围绕简历和项目。固收投研岗的专业面试题没有直接读到，邻近岗位面经的考点：久期定义与10年、30年国债久期（中金资管固收，2023-01）、DV01与风险控制（易方达固收交易，2025-09）、研究主体能否投资以及最多买几年（中金资管固收，2023-01）、权益实习为什么来固收（华泰证券固收组，2023-01）。保险资管特有的考点（资负匹配、利差损、二永债、金融工具分类）按业务逻辑推断，题库中标infer。主要淘汰点：固收基础题答不出数字，信用判断没有证伪条件，说不清负债端约束，动机与权益背景不自洽。","exit":"保险资管内部：固收投资经理、资产配置、信用研究负责人；横向到权益、另类，或到保险公司资产负债管理部、投资部。外部：公募固收、银行理财子、券商自营与资管、养老金与年金投资、银行金融市场部、评级机构。资负匹配与会计分类能力对转到银行理财子和养老金方向最有用（推断）。","batches":"2027届批次、截止日和岗位级HC官方均未公布，本次也没有读到。读取情况：国寿资产官网www.clamc.com.cn两次请求均超时（20秒、30秒）；平安集团校园招聘站campus.pingan.com是JS动态页，岗位列表未渲染；平安资管官网am.pingan.com与am.pingan.com.cn域名无法解析；牛客企业页nowcoder.com/enterprise/27681仅列国寿资产2026届的软件工程师等技术岗位，没有固收投研岗。可参照的二手节奏：国寿投资暑期实习6月官网投递、7月笔试、7月26日至9月15日实习，实习生转正仍需走秋招笔试与面试，可能直通终面但各部门说法不一（牛客避坑帖，E3）。建议直接到国寿资产和平安集团校招官网核对2027届和2027暑期实习的开放时间，保险资管的实习名额一般少于公募和券商（推断）。","certs":"基金从业资格（行业通行入门证书，官方简章未读到要求，按惯例）；CFA、FRM、CPA、中国精算师为加分项（推断）。","cities":["北京","上海","深圳"],"sample_orgs":["中国人寿资产管理有限公司（国寿资产）","平安资产管理有限责任公司（平安资管）","太平洋资产管理有限责任公司（太保资产）","泰康资产管理有限责任公司","新华资产管理股份有限公司","中国人保资产管理有限公司","大家资产管理有限责任公司","阳光资产管理股份有限公司"],"src":[{"t":"中国人寿2026年半年度报告摘要（东方财富公告库全文，第4页：投资资产与会计核算分类）","url":"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code=AN202608271828538872&client_source=web&page_index=4","date":"2026-08-28"},{"t":"中国人寿2026年半年度报告摘要（第2页：偿付能力；第5页：信用风险与总投资收益率）","url":"https://np-c %（E3）；五大上市险企股票资产2.82万亿元，只占其投资资产的13.04%（自算）；但权益上限已按偿付能力档位提到最高50%，各家2026年上半年都在增配，太保表示权益配置比例会继续有节奏提升（E2），所以权益是增量方向，不再只是短板。（2）“压力小”，部分成立。国有险企净资产收益率考核加了三年、五年权重（财政部财金〔2025〕62号，当年30%、三年50%、五年20%，E1），短期排名压力低于公募；但2026年上半年利润受权益波动影响大（国寿净利润同比增228.6%），权益岗要对账户利润和偿付能力负责。（3）“市场化程度低”，没有读到各保险资管公司第三方资金占比的官方数据，保留为传闻（E3）。另有2021年牛客攻略称保险公司投资部和资管公司“基本上属于金融食物链的最顶端”，同样是二手说法。","grade":"E3","src":[{"t":"精读财报：五大上市险企2026年上半年净利增近八成（新华网）","url":"http://www3.xinhuanet.com/money/20260917/0955626d29e4425dad769be007866fc2/c.html","date":"2026-09-17"},{"t":"万亿险资，最新持仓曝光（中新经纬，21经济网；含太保权益配置表态）","url":"https://www.21jingji.com/article/20260902/herald/ef544b498f9dc01edf4a86dd1fae73d5.html","date":"2026-09-02"},{"t":"财政部《关于引导保险资金长期稳健投资 进一步加强国有商业保险公司长周期考核的通知》（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202507/content_7031631.htm","date":"2025-07-02"},{"t":"22届如何备战金融行业秋招？这份攻略送给你！（牛客）","url":"https://www.nowcoder.com/discuss/353157989135753216","date":"2021-08-10"}]},"growth":{"score":4,"text":"路径：研究员或投资助理，到投资经理助理，再到账户投资经理；也可转资产配置、FOF和养老金投资。壁垒是同时懂资产负债约束、会计分类和偿付能力，这是公募和券商研究不训练的能力。保险资金运用余额40.8万亿元（2026年二季度末，E3），权益占比还在提升，岗位需求偏增量；限制是投资经理席位少，晋升看账户业绩和平台。出口见exit字段。"},"salary":{"range":"首年总包约25–45万元（税前，含年终奖）；二手传闻，本次无法核验","basis":"没有读到保险资管公司公开的薪酬数据：太保资产、泰康资产官方招聘页本次无法读取；上市母公司年报的人均薪酬包含销售队伍和各类岗位，不能代表资管子公司，因此没有用来交叉验证。能读到的二手信息只有两条：牛客2021年一则提问称“都说保险资管年终奖多，可能因为基础工资太少”（只有提问，没有数据）；牛客2021年备战攻略称金融行业同一公司不同岗位薪酬可相差数倍。区间取同类买方岗位的二手传闻量级（参见公募岗位卡的E3说明），只能作谈薪参照，不能当offer预期，以书面offer为准。","grade":"E3","src":[{"t":"保险资管的机构销售大概年终奖能多少（牛客，仅有提问）","url":"https://www.nowcoder.com/discuss/353157635539148800","date":"2021-03-11"},{"t":"22届如何备战金融行业秋招？这份攻略送给你！（牛客）","url":"https://www.nowcoder.com/discuss/353157989135753216","date":"2021-08-10"}]},"intern_fit":"对口实习：保险资管公司投资部、资产配置部的日常实习。公开JD示例（国寿资产2020年日常实习，牛客）：直接投资部投资助理岗，需求4人，本科及以上，协助非标项目拓展、项目调研、编写尽调报告；资产配置部助理研究岗，需求2人，硕士及以上，研究宏观经济、宏观政策、投资策略，协助资产配置、负债研究、资负互动；两个岗位均为3个月、每周2到3个工作日，地点北京金融大街，提供免费午餐和加班餐。你的光大证券TMT研究部实习（跟踪兆易创新，区分存储与MCU库存周期复苏和结构性盈利改善，估值模型4到6轮假设修订）对应成长线研究；工行公司银行部制造业信贷尽调（收入质量、现金流、应收周期、第一还款来源）对应现金流和另类项目尽调。缺口是保险资金约束和账户分类，建议先读金规〔2025〕12号、24号，再补一段保险资管或保险公司投资部实习。其他对口：券商资管权益或固收+、公募红利策略、银行理财子权益研究。","requirements":"学历：国寿资产2020年日常实习JD写明投资助理岗本科及以上、资产配置部助理研究岗硕士及以上（2020年JD，E3，仅作参照）；头部保险资管校招研究岗以硕士为主是行业二手经验，本次未核实。专业：JD原文为经济、金融等相关专业，复合背景者优先；数学统计、会计也常见。技能：财报与估值、Wind和Excel、Python；了解偿二代二期、新金融工具准则（FVOCI与TPL）和保险资金运用比例监管者加分。证书：JD原文为“具有相关专业资格证书优先”，基金从业和证券从业是通行入门证书。英语：本次没有读到明确要求。","process":"公开面经都是2020至2021年的经济金融岗校招，与现在的投资岗不完全一致，仅作流程参照。泰康资产（牛客，2020年9月至11月）：纸质笔试，含专业题和脑筋急转弯式的估算题（例如预测中国电影票房）；HR结构化初面；群面（10人一组，看图说话即兴演讲加小组讨论，或每人2分钟热点评论加辩论，或抽词即兴演讲加无领导小组讨论）；主管面（两名部门面试官加HR，按简历追问，集中在性格、领导力、优缺点、实习中最有成就感的事、职业规划和为什么适合这个岗位）；可能还有总裁面（作者未到）。国寿（牛客，2020年11月）：宣讲后45分钟笔试，含几道经济问题、一段英文翻译和未来五年职业规划，面试为1名面试官对5名候选人，复试一对一。常见淘汰点：群面缺少主动展示，性格和职业规划前后不一致。投资岗专业面本次没有读到面经，推断会问偿付能力档位、OCI与TPL、红利逻辑和个股推荐，对应本题库buy3-37至buy3-47。","exit":"保险集团内部转资产配置、投资管理或另类投资部门；横向可转公募权益、固收+、FOF和养老金投资，也可去私募二级、券商自营与资管。下一跳取决于账户业绩记录和对资产负债约束的理解（推断）。","batches":"官方信息本次没有读到：太保资产、泰康资产的官方招聘页（域名无法解析或为动态页），2027届简章、HC和截止日均未获取，记为官方未公布。可核对的历史节点（牛客《22届如何备战金融行业秋招》，2021-08，E3）：2021届秋招中国人寿网申9月11日至11月15日，新华保险9月27日起至11月。国寿资产2020年日常实习（牛客JD，2020-09）：直接投资部4人、资产配置部2人，北京。2027年暑期实习的时间官方未公布。建议每年8月底起关注太保集团、泰康保险集团和各保险资管公司的校招入口，并对照往年节奏（推断）。","certs":"基金从业资格和证券从业资格（行业通行，国寿资产JD写“相关专业资格证书优先”）；CFA、FRM、CPA为加分项（推断），非硬性要求。","cities":["北京","上海","深圳"],"sample_orgs":["国寿资产（中国人寿资产管理）","太保资产（太平洋资产管理）","泰康资产","平安资管","新华资产","人保资产","太平资产","阳光资产","国寿投资（中国人寿旗下专业另类投资平台）"],"src":[{"t":"国家金融监督管理总局《关于调整保险资金权益类资产监管比例有关事项的通知》金规〔2025〕12号（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202504/content_7017545.htm","date":"2025-04-08"},{"t":"国家金融监督管理总局《关于调整保险公司相关业务风险因子的通知》金规〔2025〕24号","url":"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=1236186&itemId=928","date":"2025-12-05"},{"t":"精读财报：五大上市险企2026年上半年净利增近八成（新华网）","url":"http://www3.xinhuanet.com/money/20260917/0955626d29e4425dad769be007866fc2/c.html","date":"2026-09-17"},{"t":"万亿险资，最新持仓曝光（中新经纬，21经济网）","url":"https://www.21jingji.com/article/20260902/herald/ef544b498f9dc01edf4a86dd1fae73d5.html","date":"2026-09-02"},{"t":"保
