/575334679356665856","date":"2024"},{"t":"中国结算业务｜发展部｜面经（小红书，二手）","url":"https://www.xiaohongshu.com/discovery/item/6a5318d000000000080319d4","date":"2025"}],"qn":12},{"id":"infra.exchange","group":"infra","org_type":"证券交易所","role":"证券交易所·上市审核与市场运行（上交所/深交所/北交所）","work":"交易所是证监会监督下的自律管理组织，业务岗主要分四条线。一是发行上市审核：上市审核中心受理IPO、再融资、重组申请，审核人员分工审阅招股书和底稿，发审核问询函，组织上市委审议，出具审核意见后报证监会注册；注册制下交易所承担实质审核第一责任。二是上市公司监管：对年报、半年报做事后审核，发问询函、监管工作函，处理业绩预告背离、资金占用、违规减持，实施纪律处分。三是交易监管：监控异常交易和程序化交易，处置拉抬打压、虚假申报，管理会员和投资者适当性。四是研究与数据：指数编制、市场运行分析、数据产品。考核看审核质量与时效、问询被采纳率、监管处置的合规性。","typical_day":["上午看审核项目进度表，处理招股书反馈意见回复，核对财务勾稽和关联交易披露","下午开项目组会或上市委预沟通会，讨论是否提请上会、问询问题是否到位","盘中或收盘后看交易监控预警，核查涨停板申报、撤单率和程序化账户","年报季集中做事后审核，出问询函，跟进回复并判断是否现场检查","研究与数据岗做市场运行月报、指数产品和跨境互联互通研究"],"wlb":{"score":3,"text":"判断分3。无官方工时数据。按岗位性质推断：审核有申报季和年报季两个高峰，IPO受理集中、年报事后审核在3-4月，加班集中在这些窗口；平时比券商投行稳定，周末基本可休。交易监管要盯盘和值班，遇到异常波动需即时响应。上交所招聘公告写明“政审考察与体检”，流程规范，但公告未披露工时。","grade":"E3","src":[{"t":"上海证券交易所2026年员工招聘启事","url":"https://www.sse.com.cn/aboutus/recruitment/sse/wanted/c/c_20260122_10806234.shtml","date":"2026-01-23"}]},"growth":{"score":4,"text":"判断分4。上交所2026年招聘按A01会计、A02法律、A03信息技术、A04金融经济、A05党建内管、A06研究六类招人，入职后统一分配部门，这意味着先进门再定岗，审核中心是可能的去向之一。晋升按职级和岗位序列走，路径大致是专员—主管—部门副职—部门正职，速度取决于编制和考核，比市场化机构慢但确定性高。技能壁垒在于“规则+财务/法律+行业”的复合判断，做五年以上审核，对IPO标准的理解很难被替代。出口是券商投行质控/内核、公募合规、上市公司董秘、律所资本市场部。研究岗只招博士后，说明研究序列门槛更高。","grade":"E1","src":[{"t":"上海证券交易所2026年员工招聘启事（A01-A06岗位与要求）","url":"https://www.sse.com.cn/aboutus/recruitment/sse/wanted/c/c_20260122_10806234.shtml","date":"2026-01-23"}]},"salary":{"range":"首年总包约18–30万元（税前，含绩效、公积金；官方未披露，推断）","basis":"E3推断。上交所招聘公告不披露薪酬；公开渠道没有可核实的应届总包。参照上海市属金融国企/事业单位应届硕士口径给区间，下沿对应无绩效兑现的年份，上沿对应审核业务岗加年终。不能与券商投行首年40万+直接比较：交易所是体制内定价，隐性福利（户口、公积金、稳定性）占比高。面试时问清“岗位工资+绩效+公积金”三项，不要只问总包。","grade":"E3","src":[{"t":"上海证券交易所2026年员工招聘启事（未披露薪酬）","url":"https://www.sse.com.cn/aboutus/recruitment/sse/wanted/c/c_20260122_10806234.shtml","date":"2026-01-23"}]},"intern_fit":"最对口的是券商投行IPO项目实习（尽调、底稿、招股书章节）、会计师事务所审计实习、律所资本市场部实习，因为审核岗每天看的就是这三类人做出来的材料。你现有经历里，光大证券TMT研究部的三表与估值模型4-6轮假设修订，可以直接迁移到“收入确认、毛利率异常、关联交易”的审核判断；百度规划管理部的AI Agent研究，对应“科创板硬科技属性、科创成长层”的行业理解。缺口是没有投行或审计底稿经验，建议补一段投行暑期实习，或在题库里把“问询函拆解”做成可展示的作业：选一家2026年IPO被问询的公司，逐条还原问题逻辑。","requirements":"学历：上交所2026年员工招聘A01-A05全部要求硕士研究生及以上，A05还要求中共党员；本科生只能走实习生通道。专业：会计类要会计/财务管理，法律类要法律，信息技术类要数理/统计/计算机，金融经济类要金融/经济，研究岗要博士后。证书：CPA、ACCA、CFA、FRM或法律职业资格是明确写出的优先条件，校招简历关几乎人手一个。英语：会计类写明“能够使用英语作为工作语言”。院校：公告未写偏好，实际以复交、两财一贸、清北人为主（推断，未核实）。","process":"2026年批次：网申（ideal.51job.com/sse2026，每人只能投1个大类，截止2026-03-08 24:00）→资格审查→笔试测评→第一轮面试→第二轮面试→政审考察与体检→录用。面试形式公告未写；面经（小红书、应届生论坛，E3）称有一面群面/综合面、二面高管面，业务岗会问IPO关联交易、收入确认、注册制下审核效率与风险平衡。淘汰点：简历关看院校+证书+对口实习；笔试刷行测和专业（推断）；面试刷“为什么来交易所”讲不清、把审核说成“挑毛病”的人。","exit":"内部：审核中心→上市公司监管/交易监管/研究部，或往部门副职走。外部：券商投行质控与内核、公募基金合规、上市公司董秘办、律所资本市场部、会计师事务所技术部。审核背景去投行质控很顺，因为懂问询逻辑；去前台承做则要补客户和项目经验。","batches":"上交所员工招聘每年1-2月发布、3月截止，与券商秋招错峰；2026年批次已截止，2027届要盯2027年1-2月官网。HC未公开。深交所、北交所同样以官网公告为准，本次未读到2027届公告。实习生招收另发公告（2026年批次2026-01-23发布）。","certs":"CPA（会计类最硬）、法律职业资格（法律类）、CFA/FRM（金融经济类加分）、ACCA。证券从业资格不是门槛，但入职后需取得。","cities":["上海","深圳","北京"],"sample_orgs":["上海证券交易所","深圳证券交易所","北京证券交易所"],"src":[{"t":"上海证券交易所2026年员工招聘启事","url":"https://www.sse.com.cn/aboutus/recruitment/sse/wanted/c/c_20260122_10806234.shtml","date":"2026-01-23"},{"t":"上海证券交易所招聘信息栏目（批次与公告列表）","url":"https://www.sse.com.cn/aboutus/recruitment/sse/index.shtml","date":"2026-10-28"},{"t":"上交所面试万字面经复盘（小红书，搜索摘要；业务岗题单）","url":"https://www.xiaohongshu.com/discovery/item/69d674080000000021013289","date":"2025"},{"t":"22届应届双非本科上交所面试全纪录（应届生论坛，搜索摘要）","url":"https://q.yingjiesheng.com/forum/bk15/tz19641","date":"2022"},{"t":"上证所or上交所笔+面经（牛客网，技术岗）","url":"https://www.nowcoder.com/discuss/353157863608623104","date":"2021"}],"qn":12},{"id":"infra.assoc","group":"infra","org_type":"金融行业协会","role":"金融行业协会·自律管理/会员服务/研究（中证协/中基协/中银协/保险业协会/信托业协会）","work":"协会是行业自律组织，接受业务主管单位指导：中证协、中基协受证监会指导，中银协、保险业协会、信托业协会受金融监管总局指导。业务岗分四块。一是自律管理：起草自律规则和执业标准，处理会员违规，做执业注册与从业人员管理，例如中证协的从业人员管理平台、投行业务自律管理平台、网下投资者管理系统。二是考试培训：组织证券行业专业人员水平评价测试、基金从业资格考试，运营远程和面授培训。三是会员服务与纠纷调解：会员大会、理事会、专业委员会，证券纠纷调解。四是数据与研究：行业经营数据统计、课题研究、发展报告，为监管决策提供依据。考核看规则落地、会员满意度、数据及时性和课题质量。","typical_day":["上午处理会员机构的执业注册、备案或自律核查材料，回复咨询","下午开规则修订讨论会，对照上位法规和监管要求改条款","每月固定做行业数据统计与简报，核对会员报送口径","组织或参加专业委员会会议、培训课程，跟讲师和会员单位对接","纠纷调解岗安排调解会，写调解协议；研究岗赶课题中期报告"],"wlb":{"score":4,"text":"判断分4。无官方工时数据。协会是社团法人，节奏比监管机关和券商前台慢，周末基本可休；但监管交办的专项任务、规则修订和年度报告有硬截止，忙季会集中加班。中基协2026届校招面经提到面试有行为面、问“对加班与工作生活平衡的看法”，说明加班存在但不极端。","grade":"E3","src":[{"t":"中国证券投资基金业协会2024校园招聘——薪酬&校招经验（知乎）","url":"https://zhuanlan.zhihu.com/p/673350154","date":"2024"},{"t":"中国证券投资基金业协会面试（小红书面经，搜索摘要）","url":"https://www.xiaohongshu.com/discovery/item/67abd681000000002903067d","date":"2025-02"}]},"growth":{"score":3,"text":"判断分3。协会的晋升按岗位序列和职级，天花板比监管机关低、比市场化机构稳。核心壁垒是“规则文本能力+行业人脉+数据口径”：做三年自律管理，能独立起草规则、主持会员沟通；做五年研究，能牵头行业报告。问题是业务面宽而不深，容易变成“开会和写材料”。出口：证监会/金监总局（遴选或考录）、基金公司/券商合规、律所金融合规、高校或智库。中基协研究岗和自律岗是协会里成长性最好的两类。","grade":"E3","src":[{"t":"中国证券投资基金业协会2026届校园招聘公告（中公网校转载）","url":"http://www.eoffcn.com/kszx/detail/1929028.html/","date":"2025-12"}]},"salary":{"range":"首年总包约15–22万元（税前；中基协二手口径约17万，中证协等为推断）","basis":"E3。中基协：知乎校招经验帖称硕士第一年总包约17万、福利较齐全、有京户（二手，未核实）。中证协、中银协、保险业协会、信托业协会没有可核实的公开薪资，按北京金融社团法人应届硕士口径推断15–22万。协会是民间非营利组织，薪酬参照事业单位，不能按金融机构对标。","grade":"E3","src":[{"t":"中国证券投资基金业协会2024校园招聘——薪酬&校招经验（知乎，二手）","url":"https://zhuanlan.zhihu.com/p/673350154","date":"2024"}]},"intern_fit":"最对口的是协会或监管机关的实习（自律管理、统计研究、投资者保护），其次是基金公司/券商的合规、运营、产品岗。你现有经历可迁移：光大证券TMT研究部的行业研究和三表分析，对应协会研究岗的行业报告；百度规划管理部金融AI Agent研究，对应“金融科技对行业影响”的课题；工行公司银行部信贷尽调，对应会员机构的风险排查。缺口是没有规则文本和会员服务经验，建议做一份“自律规则对比”作业：把中基协《私募投资基金登记备案办法》与证监会《私募投资基金监督管理条例》逐条对照，标出协会执行环节。","requirements":"学历：中基协2026届校招以硕士为主；中证协、中银协类似（推断）。专业：法学、金融财会、信息科技、文史哲综合类；中基协明确分综合管理、信息科技、行业服务及自律管理三类岗位。证书：证券/基金从业资格是加分，法律职业资格对自律岗很硬，CFA对研究岗加分。能力：公文写作、规则理解、数据统计（Excel/SQL）、沟通协调。政治面貌：综合管理岗偏好党员（推断）。","process":"中基协2026届：网申（campus.51job.com/amac2026）→笔试→面试（两轮，一面自我介绍+简历+行为面，二面专业面结合协会职能和岗位）→政审考察→体检→录用；报名截止2026年1月4-6日（不同转载口径）。笔试为单选、多选、论述（专业题+申论）。中证协流程类似但面经少。淘汰点：不了解协会“自律不是监管”的定位；把协会工作说成“清闲养老”；笔试论述写不出政策逻辑。","exit":"内部：自律管理→部门副职/主任，或转到研究、会员服务。外部：证监会/金监总局（考录或遴选）、基金公司合规与运营、券商合规、律所金融合规、行业协会之间跳槽。协会背景去金融机构合规是顺路，去前台业务要补产品和客户经验。","batches":"中基协2026届校招报名截止2026年1月初，2027届公告预计2026年12月-2027年1月发布（推断）。中证协、中银协、保险业协会、信托业协会校招规模小、公告分散，需逐家盯官网。HC均未公开。","certs":"证券行业专业人员水平评价测试、基金从业资格（入职常要求）；法律职业资格（自律/法律岗）；CFA（研究岗）；CPA（数据/财务岗）。","cities":["北京","上海"],"sample_orgs":["中国证券业协会","中国证券投资基金业协会","中国银行业协会","中国保险行业协会","中国信托业协会"],"src":[{"t":"中国证券业协会官网（服务大厅：从业人员管理平台、数据报送、水平评价测试、纠纷调解）","url":"https://www.sac.net.cn/fwdt/","date":"2026-10-28"},{"t":"中国证券业协会：证券公司2026年上半年度经营数据","url":"https://www.sac.net.cn/xxgk/hysj/jjsj/202609/t20260903_82250.html","date":"2026-09-04"},{"t":"中国证券投资基金业协会2026届校园招聘公告（中公网校转载）","url":"http://www.eoffcn.com/kszx/detail/1929028.html/","date":"2025-12"},{"t":"中国证券投资基金业协会2024校园招聘——薪酬&校招经验（知乎）","url":"https://zhuanlan.zhihu.com/p/673350154","date":"2024"},{"t":"中国证券投资基金业协会面试（小红书面经，搜索摘要）","url":"https://www.xiaohongshu.com/discovery/item/67abd681000000002903067d","date":"2025-02"}],"qn":12},{"id":"infra.reg","group":"infra","org_type":"金融监管机构","role":"金融监管机构·监管岗（证监会/金融监管总局/人民银行/外汇局）","work":"监管岗的核心是“规则+数据+检查+处置”。以证监会为例：发行监管岗审规则、看交易所审核质量；上市公司监管岗处理信息披露、并购重组、退市；机构监管岗管券商基金；稽查岗办案；派出机构（证监局）一线监管辖区公司。金融监管总局以机构监管和功能监管为主，做银行保险机构的非现场监管、现场检查、风险处置；人民银行偏货币政策、金融稳定、支付与反洗钱；外汇局管跨境资金流动。日常大量时间在看看板、跑数据、写监管报告、发监管函、出差检查。近年重点是资本市场“1+N”政策落地、防风险和监管科技。考核看监管有效性、风险早识别、案件质量和政策落地。","typical_day":["上午看非现场监管报表和风险预警，核对资本、不良、流动性指标异常","下午开风险研判会，讨论是否发监管函、约谈或立项检查","现场检查期整天在被检查机构调阅底稿、访谈、取证，晚上写检查事实底稿","处理信访举报、行政复议或市场传闻核查，限期回复","参与规则修订或政策研究，写征求意见稿和答问口径"],"wlb":{"score":2,"text":"判断分2。无官方工时数据。国考职位是公务员编制，稳定但强度不低：现场检查要连续出差2-4周，专项任务和风险事件随时打断周末；证监会稽查和派出机构加班常见（推断）。相比券商投行强度低，但比一般部委业务司局更忙，且政治学习、值班、应急占时间。","grade":"E3","src":[{"t":"关于2027年度中国证监会考试录用公务员公告","url":"https://www.csrc.gov.cn/csrc/c100083/c7664528/content.shtml","date":"2026-10-14"}]},"growth":{"score":3,"text":"判断分3。公务员走职级并行：一级科员—四级主任科员—三级—二级—一级主任科员—副处—正处，晋升看年限、职数和考核，天花板明确但慢。专业壁垒在“监管口径+检查方法+案件定性”：做过现场检查和处罚案子的人，对规则边界的理解是市场机构给不了的。出口：券商/基金合规与风控、律所金融监管合规、高校或智库、金融机构政府事务。注意离职后有从业限制和回避要求，跳槽不如市场化机构自由。","grade":"E3","src":[{"t":"关于2027年度中国证监会考试录用公务员公告（职位为一级主任科员及以下）","url":"https://www.csrc.gov.cn/csrc/c100083/c7664528/content.shtml","date":"2026-10-14"}]},"salary":{"range":"按国家公务员工资制度，首年综合收入约15–25万元（地区差异大；官方不披露，推断）","basis":"E3推断。国考公告不披露薪酬。公务员收入=基本工资+津贴补贴+绩效+公积金，北京、上海派出机构高于中西部；证监会属中央国家机关，无市场化奖金。二手说法一线城市转正后年综合20万上下，样本少、未核实。不能与券商/基金同岗位比，选择监管要接受收入折价。","grade":"E3","src":[{"t":"关于2027年度中国证监会考试录用公务员公告（未披露薪酬）","url":"https://www.csrc.gov.cn/csrc/c100083/c7664528/content.shtml","date":"2026-10-14"}]},"intern_fit":"最对口的是监管机关实习（证监局、金监总局派出机构）、交易所审核/监管实习、券商投行或合规实习。你现有经历可迁移：工行公司银行部制造业信贷尽调（收入质量、现金流、应收周期、第一还款来源）直接对应现场检查的“查真实用途、查还款来源”；光大证券TMT研究的三表与估值模型对应财务造假识别；百度金融AI Agent研究对应监管科技。缺口是没有检查底稿和监管报表经验，建议做一份“EAST数据查异常”的模拟作业：用公开年报构造一组资本充足率、不良率、大额风险暴露指标，写检查思路。","requirements":"入口是国考：2027年度证监会拟招录320人、142个职位，全部一级主任科员及以下，要求法律、会计、财金、计算机专业。学历：硕士及以上职位76个、本科及以上51个、仅限硕士9个（2027年度，据职位表统计）。基层经历：会计类146个职位中144个要求2年、法律类89个全部要求2年，应届生可报岗位很少。考试：全部职位“2+X”，公共科目+专业科目。金融监管总局、人民银行、外汇局同样走国考，专业科目不同。","process":"2027年度证监会：2026-10-15 8:00至10-24 18:00报名（bm.scs.gov.cn/kl2027）→资格审查→公共科目笔试→专业科目笔试（2026-11-28 14:00-16:00）→面试（结构化2题+专业题3选2+追问，25分钟包干，E3考情）→体检→考察→公示录用。淘汰点：专业科目不及格（有合格线）；面试答题只会背政策、不会结合案例；基层经历不符被刷；政审。金融监管总局面试另含英语和无领导（推断）。","exit":"内部：机关部门与派出机构之间轮岗，稽查、检查、审批序列可深耕；职级到副处后可选调地方金融办、交易所。外部：券商/基金/银行合规与风险管理、律所金融监管合规、会计师事务所、金融科技公司政府事务。监管背景最值钱的是“知道红线在哪”，但收入会明显下降，通常在工作5-8年后跳。","batches":"2027年度国考全国计划招录3.57万人，证监会320人（占0.90%），报名2026年10月，专业科目笔试11月28日。金融监管总局、人民银行、外汇局同批国考，具体人数以各单位公告为准，本次未逐家入账。2028年度要等2027年10月公告。","certs":"法律职业资格（法律岗）、CPA（会计岗）、CFA/FRM（财金岗）在报名和面试中是加分；计算机岗看编程与数据能力。公务员考试本身不要求证书，但专业科目考专业知识。","cities":["北京","上海","深圳","各省会城市"],"sample_orgs":["中国证券监督管理委员会","国家金融监督管理总局","中国人民银行","国家外汇管理局"],"src":[{"t":"关于2027年度中国证监会考试录用公务员公告","url":"https://www.csrc.gov.cn/csrc/c100083/c7664528/content.shtml","date":"2026-10-14"},{"t":"证监会明年拟招320名公务员：会计、法律类占比超七成（21世纪经济报道）","url":"https://m.21jingji.com/article/20261016/herald/51148b6329343241de22f2537e8a59eb.html","date":"2026-10-16"},{"t":"2027年国家公务员证监会部门招320人，职位分析（中公教育）","url":"http://www.offcn.com/gjgwy/2026/1013/127083.html","date":"2026-10-13"},{"t":"2026国考面试｜证监会面试考情考务分析（附历年真题）（微信公众号）","url":"http://mp.weixin.qq.com/s?__biz=MzkzNDY3MzI3OA==&mid=2247490541&idx=5&sn=751ff21ca80a728bc7ee9cac6bdca5d9","date":"2026-02"}],"qn":12},{"id":"pe.usd","group":"broker","org_type":"美元VC/PE","role":"美元VC/PE·投资分析岗（实习生/Analyst，含高瓴、红杉中国、IDG、五源类基金）","work":"美元基金的初级投资岗围绕“找项目、判断项目、跟到退出”做事：用行业地图和创业者会面找项目，初筛时写一页纸判断市场、团队、产品、估值、退出五个维度；进入尽调后做专家访谈、客户与供应商访谈、财务与估值建模，配合律师谈条款（估值、优先清算权、反稀释、董事席位、回购或对赌）；写投委会备忘录，常用英文；投后跟踪被投企业的季度数据，向合伙人和LP提供项目更新，准备上市或并购退出。美元基金还要用IRR、MOIC、DPI、TVPI向LP报告基金层面表现。向投资经理和合伙人汇报；考核看项目质量（能否过会）、研究产出和对被投企业的贡献，长期收入与基金回报（carry）挂钩。","typical_day":["上午：看行业新闻与融资消息，更新赛道项目池和同行融资记录，回复FA与创业者来信（典型日程由岗位职责与实习招聘措辞归纳，不是实测）","白天：创业者会面或电话，专家访谈，拆解客户与收入数据，整理访谈纪要","下午：团队项目例会，写初筛一页纸或投委会备忘录，建财务与估值模型，和律师过条款清单","晚上：对接美国或欧洲时区的LP与共同投资人，准备季度投后报告和被投企业董事会材料（推断）","项目节点（尽调、投委会前、交割）会集中加班；平时节奏取决于项目数量与团队人数（推断）"],"wlb":{"score":2,"text":"判断分2，依据有限：公开能核对的只有实习招聘措辞。Asia Investment Capital的投资实习岗要求每周4天以上、不少于6个月，并写明能适应一定强度的工作压力；BAI资本日常实习要求每周4天、至少4个月，并要求能在压力和紧迫的时间要求下表现出色；高瓴创投EIP实习至少三个月（均为2024-07转载的招聘，E3）。用户笔记中的“很累，一堆report，开会从早到晚”没有找到可核实的工时数据，标为传闻，不当事实；跨时区LP沟通和项目节点集中加班是合理推断。","grade":"E3","src":[{"t":"中财蹦豆转载：高瓴创投EIP、BAI资本、Asia Investment Capital实习招聘（搜狐号）","url":"https://www.sohu.com/a/794649947_121123897","date":"2024-07-19"}]},"growth":{"score":4,"text":"路径：Analyst、Associate、Senior Associate或VP、Principal、Partner，年限因机构而异，没有标准周期。技能壁垒是项目判断、条款与交易、跨境视野和LP关系。清科与猎聘2020年上半年样本显示，从业8年以下员工每2到3年年薪约涨20%，百万年薪集中在合伙人级别，说明收入随职级陡峭上升而不是起步即高。结构性风险有三项：美国对外投资规则覆盖半导体、量子和人工智能（2025-01-02施行），2026年上半年外币基金新募集规模占清科口径全部新募集基金约4.3%（自算，E3），退出价格波动（恒生科技指数2026年初至10月30日约-31.9%，自算，E3）。出口：同机构晋升、转成长期股权PE、产业方战投或CVC、创业公司战略或融资岗位、二级市场基金。"},"salary":{"range":"首年总包约20–40万元（税前，含奖金，初级投资岗；资深层级与carry另计）","basis":"区间是推断，E3。可核对的依据：清科研究中心与猎聘大数据研究院2020年上半年样本（投资界转载，2021-04）显示，早期机构、VC、PE机构年薪中位数集中在21至25万元，10分位值8至11万元，投资部与研究部90分位值最高均超过60万元，从业超过10年平均50万元，15年以上90分位值高达120万元，百万年薪集中在合伙人级别（E2）。该样本包含各类机构，不限于美元基金，且距今六年。没有找到美元基金应届offer的公开数据；高瓴、红杉中国、IDG、五源均非上市主体，无年报人均薪酬可交叉验证。用户笔记中的“钱多”：在资深层级和carry上有依据，在应届阶段没有依据，标为部分成立的传闻。上限40万是我的假设，以书面offer为准。","grade":"E3","src":[{"t":"清科/猎聘《VC/PE机构薪酬与运营机制调查研究报告》（投资界转载）","url":"https://news.pedaily.cn/202104/470144.shtml","date":"2021-04-21"}]},"intern_fit":"对口实习：美元基金的日常或暑期投资实习（如高瓴创投EIP、BAI资本、Asia Investment Capital、红杉中国Sequoia-In项目、五源、IDG、真格）；券商研究所行业组；投行或咨询的尽调项目。你已有的最对口经历是光大证券TMT研究部实习：跟踪兆易创新，区分存储和MCU库存周期复苏与结构性盈利改善，覆盖10多家A股半导体设计公司并建立15项以上指标的三层运营分析框架，估值模型做过4到6轮假设修订；安永华明咨询的即时零售买方尽调（GMV＝订单量×客单价）对应商业尽调。缺口是一级项目的sourcing、创业者沟通和条款谈判，建议补一段VC或PE的日常实习。","requirements":"学历：美元基金全职投资岗以硕士及以上或海外背景居多，是我的推断，未找到官方统计；本科生更现实的路径是日常或暑期实习。Asia Investment Capital的实习岗要求名校研究生或本科大四在读、金融经济会计等商科背景优先；高瓴创投EIP写“专业不限，有一级市场或AI相关行业实习经验优先”（均为2024年转载，E3）。技能：行业研究框架、财务三表与估值建模、Excel与PPT、访谈与写作。英语：投委会备忘录和LP沟通常用英文（推断）。","process":"美元基金没有统一的校招模板，常见为简历加1到3轮面试，有的加行业分析作业。面经可核对的形式：红杉中国医疗组实习只有一位面试官、20到30分钟，问最近研究的赛道、最看好的医疗赛道、偏好的投资阶段（牛客，日期页面未显示）；中金资本PE暑期一面总时长10多分钟，省去自我介绍，直接问实习中的一个deal：为什么看好、竞品、MAU与估值数据（牛客，约2021年）；真格基金投资分析岗面经（牛客，2023-01）：自我介绍突出投资分析与sourcing，问为什么选这个行业、判断企业竞争力的要素、风险提示、创业者需要的特质，面官提问不多像聊天，非常关注人和企业成长节奏。常见淘汰点：行业表述没有框架，只会概括研报；对自己做过的deal说不清竞品与估值；对人的判断没有依据。","exit":"同机构内晋升到Associate、VP、Principal；横向转成长期股权PE、产业方战投（CVC）、创业公司战略或融资岗位、二级市场基金；外部可去投行或咨询。美元基金的下一跳取决于你是否经手过完整项目周期（从sourcing到投委会到退出），所以实习阶段要争取参与尽调和写备忘录。","batches":"美元基金多为日常或暑期实习滚动招聘，没有统一秋招批次。可核对：高瓴创投EIP在2024-07的转载招聘中写入职时间“9月及以前”、实习至少三个月（E3）；红杉中国Sequoia-In实习仅见面经；五源资本官网导航只有关于我们、团队、被投企业、联系我们，没有招聘栏目；IDG资本官网首页本次也未读到招聘栏目。2027届或2027年暑期的批次与HC：官方未公布，页面未读到，需要关注各机构公众号、实习僧和牛客的滚动发布。","certs":"没有硬性证书要求（官方招聘措辞未提证书，推断）；CFA、CPA、法律职业资格可作为加分项；英语能力证明（托福、雅思、六级高分）有助于外资或美元基金背景的面试。","cities":["北京","上海","深圳","香港"],"sample_orgs":["高瓴资本/高瓴创投","红杉中国（HongShan）","IDG资本","五源资本","真格基金","BAI资本","Asia Investment Capital"],"src":[{"t":"五源资本官网（被投企业列表、办公室城市：上海、北京、深圳和香港；导航无招聘栏目）","url":"https://www.5ycap.com/","date":"2026-11-01"},{"t":"IDG资本官网（累计投资1,800+家企业、600+笔退出；总部香港）","url":"https://idgcapital.com/","date":"2026-11-01"},{"t":"中财蹦豆转载：高瓴创投EIP、BAI资本、Asia Investment Capital实习招聘（搜狐号）","url":"https://www.sohu.com/a/794649947_121123897","date":"2024-07-19"},{"t":"清科/猎聘《VC/PE机构薪酬与运营机制调查研究报告》（投资界转载）","url":"https://news.pedaily.cn/202104/470144.shtml","date":"2021-04-21"},{"t":"红杉中国医疗组实习面经（牛客）","url":"https://www.nowcoder.com/feed/main/detail/23170a9c8d8f4a168fa8ee919d3a259b","date":"日期未标注"},{"t":"中金资本 PE投资岗 暑期实习面经（牛客）","url":"https://www.nowcoder.com/discuss/353159541305057280","date":"日期未标注"},{"t":"真格基金投资分析岗面经（牛客）","url":"https://www.nowcoder.com/discuss/444142465776353280","date":"2023-01-15"},{"t":"美国财政部 Outbound Investment Program 页面（规则2025-01-02施行；COINS拟议规则评论截止2026-12-07）","url":"https://home.treasury.gov/policy-issues/international/outbound-investment-program","date":"2026-10-22"}],"qn":12},{"id":"pe.rmb","group":"broker","org_type":"人民币VC/PE","role":"人民币VC/PE·投资助理/分析师→投资经理（含政府引导基金子基金管理人）","work":"人民币VC/PE（含国资背景、承接政府引导基金出资的子基金管理人）负责“募、投、管、退”全流程。初级岗位（投资助理、分析师）的日常是行业研究和项目初筛：写行业报告、整理可比公司和估值、做尽调清单与财务分析、起草投资备忘录，向投资经理汇报；晋升到投资经理后独立跟项目、谈条款、推进投决；资深岗位还要对接LP、管理投后和退出。国投创业官网公开的职级体系为投资经理AS、副总裁VP、总监D、执行总经理ED、董事总经理MD。考核通常看投资进度、项目质量和投后退出贡献；赛诺佳易2025调研（有效问卷105份，样本以地方国资为主）显示国有投资机构考核里“投资进度达成情况”占70.48%、“招引/返投任务完成情况”占68.57%。","typical_day":["上午：跟踪目标赛道的二级市场与政策动态，更新行业数据表和可比公司估值（典型日程由岗位职责和面经归纳，不是实测）","白天：约创始人访谈或参加项目路演，整理访谈纪要，做项目初筛","下午：写尽调清单、财务分析和投资备忘录，参加内部立项或投决预审","季度节点：配合投后管理、LP季度报告，以及基金备案、监管报送材料","面试阶段的强度参照：雪球2020年帖称深创投笔试题在晚上23:24发出、次日8:30前提交，并有次日下午追问（个人经历，E3）"],"wlb":{"score":3,"text":"没有可核实的工时数据，3分是判断分。可以核对的是考核压力：赛诺佳易2025调研（有效问卷105份，地方国企和政府部门下属机构占九成以上）显示86.66%的国有投资机构已建立绩效考核制度，70.48%仍沿用年度考核，所以用户笔记里的“国资PE无KPI”传闻不成立（E2）；调研同时显示投资进度占考核指标的70.48%，进度压力是真实存在的。市场化人民币基金是否更忙，本次没有读到数据，不下结论。","grade":"E3","src":[{"t":"调研报告揭示国有投资机构激励与容错痛点：考核周期的错配问题依然严峻（经济观察报，腾讯新闻转载）","url":"https://news.qq.com/rain/a/20251130A04K0O00","date":"2025-11-30"},{"t":"【中金资本】他们说非985进不了中金…（雪球·lala实习日记本，含深创投、中金资本、中信资本日常实习面经）","url":"https://xueqiu.com/8185624693/146900221","date":"2020-04-15"}]},"growth":{"score":3,"text":"晋升路径按国投创业官网公开职级：投资经理AS（要求3年以上知名投资机构股权投资经验）→副总裁VP（不少于5年）→总监D（8年以上，3个成功的投资和退出项目）→执行总经理ED（10年以上）→董事总经理MD（11年以上），年限门槛来自官网招聘页（E1），应届生进入的是助理或分析师层，达到AS通常需要3年左右积累（推断）。技能壁垒是行业判断、项目来源和LP关系，可转到产业公司战略投资、母基金、上市公司并购部和券商直投。限制在激励：调研显示只有42.86%的国有投资机构建立了配套激励机制，超额收益分配和跟投约占两成，所以国资平台的成长更多体现为平台和资源，而不是carry。给3分是判断分。"},"salary":{"range":"首年总包约25–45万元（税前，含年终奖；国资和地方国资平台偏下沿，头部市场化人民币基金偏上沿）","basis":"区间是本代理依据下列交叉数据和行业二手说法的判断，非官方数据。可交叉验证的上市公司数据：九鼎投资（600053）2025年现金流量表“支付给职工以及为职工支付的现金”为7785.13万元，除以东方财富公司概况的员工数218人，约35.7万元/人（E2派生，全口径人力成本含社保公积金；该公司收入48.01%来自建筑施工、私募投资管理仅占28.88%，2025年归母净利润为-3.58亿元，只能当混业公司的粗略上限参考，不代表投资岗）。激励侧：调研显示只有42.86%的国有机构有配套激励，超额分配和跟投约两成，国资平台薪酬以固定加年度绩效为主，carry稀缺（E2）。用户笔记中“中铝资本首年25万”属二手传闻，本次未找到可核实来源（E3），与上述区间下沿吻合。国投创业、深创投官网均未公布薪酬；知乎薪资帖本次返回403，未读到原文。谈薪以书面offer为准。","grade":"E3","src":[{"t":"九鼎投资（600053）现金流量表（东方财富数据中心）","url":"https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_DMSK_FN_CASHFLOW&columns=SECURITY_CODE,REPORT_DATE,PAY_STAFF_CASH&filter=(SECURITY_CODE=%22600053%22)","date":"2026-04-29"},{"t":"调研报告揭示国有投资机构激励与容错痛点（经济观察报，腾讯新闻转载）","url":"https://news.qq.com/rain/a/20251130A04K0O00","date":"2025-11-30"}]},"intern_fit":"对口实习：人民币VC/PE的投资助理或分析师日常实习（雪球2020年帖记录深创投、中金资本、中信资本均有投资经理助理类日常实习）；券商投行部PE或直投（牛客2022年华泰投行部PE面经）；券商研究所行业组。你的光大证券TMT研究部实习最对口：跟踪兆易创新、区分存储与MCU的库存周期复苏和结构性盈利改善、覆盖10多家A股半导体设计公司、15项以上指标的三层运营分析框架、三表与估值模型4到6轮假设修订，可直接支撑“讲行业报告逻辑”和“当场做行业分析”两类高频题；滴滴战略与经营分析部的辛普森悖论分析支撑数据归因。缺口是没有一级市场项目经历，建议补一段VC/PE或FA实习，并准备一份能完整复述的行业报告和一页纸投资备忘录。","requirements":"学历：国投创业官网公开的社招岗位（AS、VP、D、ED、MD）全部要求“相关专业硕士及以上”，投资经理AS另需3年以上知名投资机构股权投资经验（官网人才招聘页，E1）；国投集团2027年度应届毕业生招聘页面标注学历为“硕士及以上”（国家大学生就业服务平台转载，页面未区分岗位）。二手信息（雪球2020年帖，个人经历，E3）：深创投总部某组此前只招有医药背景的清北在读硕士或博士，中金资本倾向清北经管背景的熟手。专业：金融、经济加行业背景（医药、半导体、材料、计算机）。技能：三表与估值（DCF、可比公司）、行业研究、备忘录和PPT写作、Excel；能读英文财报。本科生更现实的路径是先做日常或暑期实习，再争取硕士阶段或助理岗。","process":"国投集团2027届公告列出的流程：招聘宣传、应聘报名、简历筛选、笔试及心理测评、面试、背景调查、体检、公示、接收录用、报到入职（E1）。机构级面经均为日常实习，时间较早，仅供参考：深创投投资经理助理（雪球2020）一轮2位面试官的视频面试加两轮笔试——第一轮是行业研究报告，题目晚上23:24发出、次日8:30前提交并有追问，第二轮是涉及一二级市场的数据分析，用于赛道选择——并需董事长特批；中金资本投资分析岗（同帖）45分钟视频面试，约20分钟当场做行业分析，其余是简历面和行为面（含why CICC Capital），通过后三天内交一份行业研究报告；中信资本两轮视频面试，重估值建模和财务比率；华泰投行部PE（牛客2022-12-13）电话面试，侧重过往行业研究，追问行业报告逻辑。常见淘汰点：行业报告没有对价格和退出的判断、简历项目讲不清、对基金结构和条款没概念、部分团队偏好硕博。","exit":"内部：投资助理或分析师→投资经理AS→VP→总监→ED→MD。外部：更高职级的同类基金、母基金、产业与上市公司战略投资和并购部、券商直投和投行、政府产业基金、CVC。国家创业投资引导基金三只区域基金的管理团队分别是中金资本（京津冀）、国投创合（长三角）和深创投（粤港澳大湾区）（国家发展改革委发布会实录，E1），这类平台的子基金经验在行业内可迁移。","batches":"人民币VC/PE的校招集中度低，没有统一批次。国投集团2027年度应届毕业生招聘：唯一官方入口sdic.iguopin.com；集团管培生计划招聘25人，覆盖11个专业领域，其中没有股权投资；子企业岗位来自100余家企业，含“投资管理”类，HC未公布；网申截止以各单位发布岗位为准（ncss.cn转载公告，E1，公告发布日未读到）。国投创业官网“人才招聘”页只列社招岗位，未读到应届生岗位。深创投官网招聘页只留HR邮箱，岗位列表为动态页面，本次未读到。中金公司2027届校招覆盖私募股权、中金资本等板块，来自第三方聚合页转述（E3），未读官方公告。国科嘉和等机构本次未读到官方招聘页，批次与HC官方未公布。日常实习是更现实的入口。","certs":"基金从业资格（行业惯例，本次未读到官方原文）；CFA、CPA、法律职业资格为加分项（推断）。","cities":["北京","上海","深圳","杭州","广州"],"sample_orgs":["深创投","国投创业","国投创合","中金资本","中信资本","国科嘉和","华泰证券投行部PE","九鼎投资"],"src":[{"t":"国投创业官网·人才招聘（AS/VP/D/ED/MD职级与年限要求，页面发布2025-07-10）","url":"https://www.sdicvc.com/gtcytz/rczp/A6005index_1.htm","date":"2025-07-10"},{"t":"国投创业官网首页（成立于2016年，管理四支基金，规模140亿元）","url":"https://www.sdicvc.com/gtcytz/index.htm","date":"2026-10-19"},{"t":"国家开发投资集团有限公司2027年度应届毕业生招聘公告（国家大学生就业服务平台）","url":"https://www.ncss.cn/student/jobs/12zVq7W3UwtQDMm6hbZjLn/detail.html","date":"2026-11-01访问"},{"t":"国家创业投资引导基金专题新闻发布会实录（国家发展改革委）","url":"https://www.ndrc.gov.cn/xwdt/wszb/cytzyd/wzsl/wenzi.json","date":"2025-12-26"},{"t":"国办发〔2025〕1号《关于促进政府投资基金高质量发展的指导意见》（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6996730.htm","date":"2025-01-07"},{"t":"调研报告揭示国有投资机构激励与容错痛点（经济观察报，腾讯新闻转载）","url":"https://news.qq.com/rain/a/20251130A04K0O00","date":"2025-11-30"},{"t":"【中金资本】他们说非985进不了中金…（雪球·lala实习日记本）","url":"https://xueqiu.com/8185624693/146900221","date":"2020-04-15"},{"t":"华泰投行部pe面试经验（牛客网）","url":"https://www.nowcoder.com/discuss/432231381389864960","date":"2022-12-13"},{"t":"深创投集团·招聘信息（官网，仅留HR邮箱，岗位列表为动态页面）","url":"https://www.szvc.com.cn/recruit","date":"2026-11-01访问"}],"qn":12},{"id":"pe.cvc","group":"broker","org_type":"CVC企业创投","role":"企业创投（CVC）·战略投资分析师/投资经理","work":"企业创投（CVC）岗位隶属产业公司的战略投资部或独立投资平台，用母公司资金或母公司牵头的基金，投资与主业相关的外部企业。日常工作：按母公司战略和业务线需求搜寻赛道、筛选项目；做行业研究、创始人与专家访谈、财务模型和估值；联合业务部门评估技术、供应链或渠道协同，出具投资建议；协助尽调、条款谈判和内部审批；投后跟踪被投企业的财务与运营，定期开投后会，做季度复盘；对接业务部门落地采购、渠道或联合研发。汇报对象是投资总监和战略投资负责人，决策走投委会或母公司管理层；考核同时看财务回报（账面价值、退出）和战略价值（供应链安全、业务协同），这一点是推断。腾讯投资分析师岗的职责与此一致。","typical_day":["上午：读行业研究与融资动态，更新赛道地图和项目池，约创始人或专家访谈（由腾讯投资等岗位职责归纳，不是实测）","白天：与业务部门对齐被投企业能否进供应链或产品线，核对技术参数、采购量和协同假设","下午：写投资建议书、搭财务模型与估值，整理给投委会的材料；协助律师和财务顾问推进尽调与条款","每周或每月：投后会，跟踪被投企业收入、现金和关键客户，更新预警清单","每季度：做被投企业复盘和估值更新，向母公司管理层说明账面变动与协同进展（推断）"],"wlb":{"score":3,"text":"用户笔记称“CVC很多可以养老，赛道窄，项目进度慢，直线汇报流程长，时间宽裕”，逐项核实。①赛道窄，部分成立：产业型CVC成立，哈勃体系进入2026Q3十大股东的10家A股公司（天岳先进、杰华特、裕太微、强一股份等）绝大多数是半导体与电子上游，业务描述为公开常识，面试前对照招股书；平台型不成立，腾讯联营公司权益加非流动公允价值金融资产合计8591.37亿元，占总资产39.79%（2026-06-30，E2），持仓横跨游戏、零售、消费，如世纪华通10.11%、永辉超市5.36%。②项目进度慢、直线汇报流程长：没有读到任何统计。仅有旁证是腾讯投资岗位职责含“协助处理文件和内部审批流程”（E1），以及一份新能源龙头CVC实习JD写明“董事长直管战略投资中心”（E3），说明存在审批环节，但时长未知，汇报链条因公司而异。③养老、时间宽裕：没有任何公开数据，标传闻（E3）。反向信号：进入门槛并不松，腾讯投资7个在招岗位最低要求2年经验，半导体岗要求头部PE/VC 5年以上，牛客JD要求简历写明PE/VC实习段数。评分3是我的判断：日常强度多半低于独立VC/PE，但投委会前和项目密集期仍会加班，真实强度面试时问在职同事。","grade":"E3","src":[{"t":"腾讯招聘官网社招接口，关键词“投资”（7个“腾讯投资-”岗位，职责与要求原文）","url":"https://careers.tencent.com/tencentcareer/api/post/Query?keyword=投资&pageIndex=1&pageSize=20&language=zh-cn&area=cn","date":"2026-11-01"},{"t":"大厂战投cvc-实习生招聘（牛客，新能源龙头企业CVC部门JD；企业名称与发帖日期未读到）","url":"https://www.nowcoder.com/feed/main/detail/2a007fdaaf0f4f35a7d3b3374cd3fa9f","date":"2026-11-01访问"},{"t":"东方财富数据中心：哈勃体系2026Q3十大股东持仓","url":"https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_F10_EH_HOLDERS&columns=ALL&filter=(HOLDER_NAME%3D%22哈勃科技创业投资有限公司%22)(END_DATE%3D%272026-09-30%27)&source=HSF10&client=PC","date":"2026-09-30"}]},"growth":{"score":3,"text":"推断：典型路径是分析师、投资经理、投资总监或战略投资负责人，晋升看项目产出和与业务部门的协同结果；出口见 exit 字段。CVC管理的盘子不小：哈勃体系进入2026Q3十大股东的A股公司有10家，合计账面市值116.6亿元（E2，只含十大股东持仓，是账面市值，不是成本，也不是已实现收益）；腾讯联营公司权益加非流动公允价值金融资产合计占总资产39.79%（2026-06-30，E2，含非CVC性质的战略持股，是上界）。盘子大不等于编制多：腾讯招聘接口只返回7个“腾讯投资-”岗位，最低要求2年经验（E1）。薪酬多半跟随母公司职级体系，carry通常弱于独立基金，这一点是推断，未读到公开数据。技能壁垒是赛道知识加上让业务部门买账的协同论证。"},"salary":{"range":"首年总包约20–40万元（推断，E3；大厂CVC多数无应届直招，社招起点约2年经验，以书面offer为准）","basis":"没有读到任何CVC岗位的公开薪酬：腾讯招聘接口与牛客CVC实习JD都没有薪资字段，母公司年报不单列投资部薪酬，腾讯全员口径的员工成本接口也没有返回，无法用年报人均薪酬交叉验证。区间是推断：下限20万取自清科/猎聘2020年上半年VC/PE样本的年薪中位数21-25万（E2，样本是全部VC/PE机构，不是CVC专项，距今六年）；同一样本10分位8-11万，含行政和投后岗；上限40万是大厂母公司溢价的情景假设，不是公开数据。同一样本称百万年薪集中在合伙人级别，所以CVC“钱少”或“钱多”的说法都缺证据，标传闻。","grade":"E3","src":[{"t":"清科研究中心、猎聘大数据研究院《VC/PE机构薪酬与运营机制调查研究报告》（投资界转载）","url":"https://news.pedaily.cn/202104/470144.shtml","date":"2021-04-21"},{"t":"腾讯招聘官网社招接口，关键词“投资”（无薪资字段，仅岗位职责与要求）","url":"https://careers.tencent.com/tencentcareer/api/post/Query?keyword=投资&pageIndex=1&pageSize=20&language=zh-cn&area=cn","date":"2026-11-01"}]},"intern_fit":"对口实习：①独立VC/PE或券商投行并购的投资实习，牛客CVC实习JD要求简历写明PE/VC实习段数（E3）；②产业公司战略部的战略分析实习，美团战略与投资分析面经第7问问到“短期项目执行与长期战略布局的关系”；③咨询或四大交易服务的尽调实习。档案对照：光大证券TMT研究部实习（跟踪兆易创新，覆盖10+家A股半导体设计公司）可迁移为半导体赛道研究；滴滴战略与经营分析部实习（2026.05–07）对口战略岗的数据拆解；安永华明即时零售买方尽调（GMV＝订单量×客单价）对口尽调与估值。缺口：没有一级市场投资实习，建议补一段PE/VC或CVC实习。","requirements":"学历：面经和JD未写硬性学历；腾讯投资7个在招岗位均为社招，最低要求2年经验，查询当日没有应届专属岗（E1）。专业：金融、经济、会计为主；产业型CVC看重理工背景，腾讯投资半导体岗要求本科理工科背景（电子、计算机、工程、物理优先），理工博士加分（E1）；先导智能面经问“商科背景看工科项目遇到什么困难”（E3）。技能：行业研究、财务建模与估值、尽调、投资条款、投后跟踪。英语：腾讯半导体岗要求中英文流利。院校偏好：未读到明文。","process":"本次没有读到任何CVC的官方招聘流程，只有面经（牛客，均为E3）。先导智能战略投资（2024-05）：一面是投资团队负责人，题目含战投与财投的区别、个人偏好、赛道偏好与职业规划、商科背景看工科项目。京东战略投资（2025-09，6问）：如何判断团队能力和商业模式，投后如何与京东业务协同，如何平衡财务回报和战略价值。美团战略与投资分析（2025-09，10问）：为什么选战略与投资分析师岗，与团队对行业趋势判断分歧怎么协调，短期项目执行与长期战略布局的关系。创维投资经理（2025-10至12，两位发帖人题目相同）：结合公司战略如何搜寻、筛选、储备项目，投后管理的要点和目标，对移动互联网和AI投资的见解及如何跟踪新模式。淘汰点是推断：说不清战投与财投区别，没有赛道框架，对母公司产业缺乏理解，协同论证停留在口号。笔试形式与轮数未读到。","exit":"推断：①转母公司业务部门、战略或BD岗，这是CVC最自然的内部出口；②转独立VC/PE，需要有可展示的项目和赛道判断，CVC背景的优势是产业资源，短板是缺少独立募投管退经验；③去被投企业或创业公司做战略、融资或CFO助理；④转券商投行并购或咨询。第一份工作若进入CVC，建议在两年内争取主导一个完整项目（从筛选到投后），这是下一跳的主要凭据。","batches":"腾讯招聘接口（查询日2026-11-01，E1）：关键词“投资”返回13个社招岗位，其中7个以“腾讯投资-”开头，工作地以北京为主，岗位更新日期2026-08至2026-10；校园类参数attrId=2下关键词“投资”或“战略”返回0条，该参数的含义官网未公开说明，是按接口习惯推断，0条只说明查询当日没有此类岗位，不说明腾讯不招应届生。京东、美团、先导智能、创维投资的面经发帖时间分别为2025-09、2025-09、2024-05、2025-10至12，说明这些公司的战略投资类岗位在2024至2025年有面试进行。2027届批次与HC：官方未公布，页面未读到。哈勃、小米、阿里、美团、京东的校园招聘页为动态页面，本次未读到岗位级信息。牛客“大厂战投cvc-实习生招聘”是单个公司（新能源龙头，未具名）的投资分析师助理实习帖，工作地上海，发帖日期未读到。","certs":"无硬性证书要求（腾讯投资岗位与牛客CVC实习JD均未写）。管理私募基金的CVC平台，投资人员通常需要基金从业资格（推断，未读到原文）；CFA、CPA、法律职业资格为加分项。","cities":["北京","深圳","上海","杭州"],"sample_orgs":["腾讯投资","华为哈勃投资","阿里创投","京东战略投资","美团战略投资","小米战略投资","先导智能战略投资","创维投资"],"src":[{"t":"腾讯招聘官网社招接口，关键词“投资”（岗位职责与要求原文，读取日2026-11-01）","url":"https://careers.tencent.com/tencentcareer/api/post/Query?keyword=投资&pageIndex=1&pageSize=20&language=zh-cn&area=cn","date":"2026-11-01"},{"t":"先导智能战略投资面经（牛客）","url":"https://www.nowcoder.com/discuss/619958299164753920","date":"2024-05"},{"t":"京东战略投资面经（牛客）","url":"https://www.nowcoder.com/discuss/798914465054851072","date":"2025-09"},{"t":"美团战略与投资分析面经（牛客）","url":"https://www.nowcoder.com/discuss/799302004626440192","date":"2025-09"},{"t":"创维投资经理面经（牛客动态）","url":"https://www.nowcoder.com/feed/main/detail/73b750c741e040eda56993e11bca626a","date":"2025-10至12"},{"t":"大厂战投cvc-实习生招聘（牛客，新能源龙头企业CVC部门JD）","url":"https://www.nowcoder.com/feed/main/detail/2a007fdaaf0f4f35a7d3b3374cd3fa9f","date":"2026-11-01访问"},{"t":"清科研究中心、猎聘《VC/PE机构薪酬与运营机制调查研究报告》（投资界转载）","url":"https://news.pedaily.cn/202104/470144.shtml","date":"2021-04-21"},{"t":"东方财富数据中心：腾讯控股资产负债表（联营公司权益、公允价值金融资产）","url":"https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_HKF10_FN_BALANCE&columns=ALL&filter=(SECUCODE%3D%2200700.HK%22)(REPORT_DATE%3D%272026-06-30%27)&pageSize=60&source=F10&client=PC","date":"2026-06-30"}],"qn":12},{"id":"pe.fa","group":"broker","org_type":"FA（精品投行）","role":"FA精品投行·财务顾问分析师/项目经理（私募融资与并购）","work":"FA（融资财务顾问，业内也叫精品投行）站在融资企业一侧，帮创业公司和成长期企业完成股权融资，也做并购撮合。初级岗位（财务顾问分析师）的日常是：做行业研究和可比公司表，搭财务模型和估值，制作BP、Model、Datapack、Cap table等材料，整理投资人名单并跟进反馈，参与路演、条款清单谈判、投资人尽调和交易文件的协调；对内向项目经理和合伙人汇报，对外与创始人、投资机构沟通。考核看执行质量、项目成交和投资人反馈；收入来自融资交割后的成功费（二手说法比例在2%–5%）。华兴资本2027届校招的对应岗位是投资银行事业部（私募融资与并购）财务顾问分析师，工作地北京、上海。","typical_day":["上午：更新在谈项目的投资人反馈表，核对昨天路演后的问题清单（典型日程由JD与二手文章归纳，不是实测）","白天：做行业研究和可比公司表，搭或改财务模型，准备路演材料和Datapack","下午：参加创始人沟通会或投资人电话，记录估值与条款意见，更新时间线表","晚上：改材料，回答投资人补充问题，协调尽调清单和交易文件","融资窗口期：按时间线盯各投资人节点，周末也要响应（二手文章称这是24小时stand by的工作）"],"wlb":{"score":2,"text":"二手说法：“这是一个24小时stand by的工作，只要甲方爸爸有需求，你就得随时出现”（搜狐号职徒，2022-11-26）。没有读到任何工时统计，用户笔记里的“基本007”只能标传闻：方向有二手佐证，数字无法核实。推断：成功费模式下FA到账才有收入，投中口径转引的融资交割周期为6到12个月，创始人催得紧是合理推断，但没有直接来源。","grade":"E3","src":[{"t":"起底FA精品投行（搜狐号职徒）","url":"https://www.sohu.com/a/610551926_497167","date":"2022-11-26"},{"t":"创业融资服务平台怎么选——从FA收费模式看行业变化（搜狐号，带推广性质）","url":"https://www.sohu.com/a/1088603791_123033230","date":"2026-10-16"}]},"growth":{"score":3,"text":"二手说法：入行头部FA的新人，几年后有机会成为投资经理，极少数成为VP；多数人转券商投行（多去并购部门）、PE/VC或创业公司融资部门，收入随周期波动、头部集中（搜狐号职徒，2022）。华兴资本2025年投行分部收入1.29亿元（同比下降42.6%），分部运营亏损7363万元，投资管理分部收入7.33亿元、运营利润2.94亿元（年报转述，E2），说明头部机构自己也在向管理费类业务延伸；2026年中期总收入及净投资收益约4.94亿元（同比增长8.2%，口径含投资收益，仅读到搜索摘要，E3）。成长性给3分的理由：技能可迁移到投行并购和买方，但周期风险高。"},"salary":{"range":"首年总包约20–40万元（头部机构应届约30万元以上，中小机构可能不足20万元；二手传闻，未核实）","basis":"二手传闻，E3：搜狐号职徒（2022-11-26）称头部FA应届分析师基本工资约2W+（按月理解），总包30W+，年终奖和项目奖金与当年行情有关；中小FA资源少、案子少，年总包可能不到20W。用户笔记所称“精品FA年薪百万”：本次没有找到任何公开数据，标传闻。交叉验证：华兴资本是唯一读到年报转述的头部机构，2025年末443名全职员工，总收入10.66亿元（人均创收约240.6万元，是创收不是薪酬），投行分部收入1.29亿元且运营亏损7363万元，经营利润1.33亿元由投资管理分部支撑；年报员工成本未读到（HKEX年报PDF为二进制），无法用人均薪酬核对。结论：“百万”至多适用于资深项目经理或合伙人线并取决于当年成交，应届生按30万上下做预期。","grade":"E3","src":[{"t":"起底FA精品投行（搜狐号职徒）","url":"https://www.sohu.com/a/610551926_497167","date":"2022-11-26"},{"t":"华兴资本2025年营收10.66亿：同比增37%（DoNews，新浪财经）","url":"https://t.cj.sina.com.cn/articles/view/1654203637/629924f5020015jom","date":"2026-03-31"}]},"intern_fit":"对口实习：①华兴资本等精品FA的投行实习，华兴官网列示的实习生职责包括数据挖掘与行业研究、分析财务和运营数据并比较同行、协助搭建财务模型、准备演示材料、参与交易执行（官网页面部分文字陈旧，写的是2017届）；②普华永道、毕马威交易服务（Deals/Transaction Services）实习，普华永道称其交易服务部门每年为超过1000笔交易提供咨询，Edge是为期两年的亚太轮岗项目；③券商投行并购部门、VC/PE研究助理。你的经历可迁移：光大证券TMT研究部实习（跟踪兆易创新、覆盖十多家A股半导体设计公司、估值模型多轮假设修订）对应行业研究与估值；安永华明咨询的即时零售买方尽调对应尽调与数据包；工行公司银行部制造业信贷尽调对应现金流与回款分析。缺口：没有一级市场或FA项目执行经历，建议补一段FA、交易服务或VC实习。","requirements":"学历：华兴资本2027届财务顾问分析师面向本科及以上应届生 ${PATHS.map(p=>`<div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h4 style="font-size:20px">${p.t}</h4><p style="margin:4px 0 0">${p.one}</p></div></div>
<div class="callout teal"><b>适合谁：</b>${p.who}</div>
<div class="steps">${p.steps.map((s,i)=>`<div class="stepc"><div class="stephead"><b>${i+1}　${s.h}</b></div><p>${s.how}</p><div class="chips">${chipsFor(s.co)}</div><dl class="kv"><dt>要补的能力</dt><dd>${s.skill}</dd><dt>门槛与限制</dt><dd>${s.gate}</dd></dl></div>`).join('')}</div>
<dl class="kv" style="margin-top:12px"><dt>对口实习</dt><dd>${p.intern}</dd><dt>未来8周</dt><dd>${p.now}</dd></dl></div>`).join('')}
<div class="section">单向门与序列差异</div><div class="panel"><dl class="kv">${GATES.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div>`;
 $$('[data-co]').forEach(b=>b.onclick=()=>{ST.sel=b.dataset.co;setView('detail')});
}
function viewTimeline(){
 const now=new Date();now.setHours(0,0,0,0);
 const rows=DEADLINES.map(d=>{const dt=new Date(d[0]+'T00:00:00'),diff=Math.round((dt-now)/864e5),st=diff<0?tag('已过','red'):diff<=7?tag('剩'+diff+'天','amber'):tag('剩'+diff+'天','blue');
  return `<tr><td>${d[0]}</td><td>${st}</td><td class="wrap"><b>${esc(d[1])}</b><br><span class="small">${esc(d[3])}</span></td><td>${badge(d[4])}</td><td>${coBy(d[2])?`<button class="btn small" data-co="${d[2]}">查看</button>`:''}</td></tr>`}).join('');
 $('#view-timeline').innerHTML=`<div class="head"><div><h3>时间线</h3><p>上半部是已核实的招聘节点（按今天自动标注已过/剩余天数）；下半部是硕士第一年/第二年秋招的倒排。已过的截止日说明：同一机构的下一届公告大多在次年同期出现，可作参照而不是承诺。</p></div></div>
<div class="panel" style="padding:0"><div class="table"><table><thead><tr><th>日期</th><th>状态</th><th>事项</th><th>证据</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
<div class="section">倒排计划</div><div class="grid2">
<div class="panel"><div class="panel-head"><h4>方案 A：硕士第一年秋招</h4>${tag('2027秋招','blue')}</div><p>现在—2027.06：一段4–8个月金融核心实习（风险/数据/基础设施/ALM）。<br>2027.03–06：必要时补短而硬的数据或模型项目。<br>2027.07–08：材料冻结。<br>2027.09–10：全面秋招；国考报名同步。</p></div>
<div class="panel"><div class="panel-head"><h4>方案 B：硕士第二年秋招</h4>${tag('2028秋招','amber')}</div><p>现在—2027.06：长期锚点实习。<br>2027.08–2028.06：结合课程补实习与项目。<br>2028.06–08：高质量暑期实习（含正式headcount）。<br>2028.08–10：集中秋招。</p></div></div>
<div class="section">能力闸门</div><div class="grid3"><div class="panel"><h4>现在</h4><p>Python/SQL、PD/LGD/EAD、数据字典、一个可复现项目。</p></div><div class="panel"><h4>硕士前</h4><p>一个风险或金工作品、一次独立复算、一段说得清个人贡献的实习。</p></div><div class="panel"><h4>秋招前</h4><p>90秒讲清项目；回答方法、结果、局限追问。</p></div></div>`;
 $$('[data-co]').forEach(b=>b.onclick=()=>{ST.sel=b.dataset.co;setView('detail')});
}
function viewSources(){
 const seen=new Set(),rows=[];
 CO.forEach(c=>c.src.forEach(s=>{if(seen.has(s[1]))return;seen.add(s[1]);rows.push([c.n,s[0],s[1]])}));
 $('#view-sources').innerHTML=`<div class="head"><div><h3>证据与口径</h3><p>共 ${rows.length} 条去重来源。证据等级写在每条数据旁边：E1 官方一手，E2 权威转载或媒体，E3 高校/第三方转载，ND 未公开或未核实。</p></div></div>
<div class="callout red"><b>重要：</b>招聘页会下线，薪资/WLB/裁员判断不构成保证。官方页面打不开或需 JS 渲染时，本工作台不会替你补数字。</div>
<div class="section">来源账本</div><div class="panel" style="padding:0"><div class="table"><table><thead><tr><th>机构</th><th>来源</th><th>链接</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="wrap">${esc(r[1])}</td><td><a href="${esc(r[2])}" target="_blank" rel="noreferrer">打开</a></td></tr>`).join('')}</tbody></table></div></div>
<div class="section">全部未核实项</div><div class="panel"><ul class="goal">${CO.filter(c=>c.gap.length).map(c=>`<li><b>${esc(c.n)}：</b>${esc(c.gap.join('；'))}</li>`).join('')}</ul></div>`;
}

const VIEWS={overview:viewOverview,companies:viewCompanies,detail:viewDetail,compare:viewCompare,paths:viewPaths,timeline:viewTimeline,roles:viewRoles,sources:viewSources,rolelib:viewRoleLib};
const TITLE={overview:'总览',companies:'公司与岗位',detail:'机构详情',compare:'对比',paths:'职业走廊',timeline:'时间线',roles:'岗位族谱',sources:'证据与口径',rolelib:'细分岗位库'};
function updateTop(){
 $('#sCo').textContent=CO.length;$('#sHc').textContent=CO.filter(c=>c.hc[1]==='E1').length;$('#sPay').textContent=CO.filter(c=>payVal(c)).length;$('#sCmp').textContent=ST.cmp.length+' / 4';
 $('#crumb').textContent=TITLE[ST.view]||'';
 $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===(ST.view==='detail'?'companies':ST.view)));
 $$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+ST.view));
}
function render(){VIEWS[ST.view]();updateTop()}
function setView(v){ST.view=v;render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n)setView(n.dataset.view);const j=e.target.closest('[data-jump]');if(j)setView(j.dataset.jump)});
$('#reset').onclick=()=>{Object.assign(ST,{cat:'all',q:'',sort:'idx',onlyHC:false,roleGroup:'全部',roleQ:'',roleOpen:null});render();toast('已重置筛选')};
$('#export').onclick=()=>{download('我的职业规划状态.json',JSON.stringify({mode:ST.mode,compare:ST.cmp.map(i=>coBy(i)?.n),my:Object.fromEntries(Object.entries(ST.my).filter(([k,v])=>v.s||v.n).map(([k,v])=>[coBy(k)?.n||k,v]))},null,2),'application/json');toast('已导出状态 JSON')};
load();
window.__atlas={CO,CATS,PENDING,PATHS,DEADLINES,roles,ST,idx,comp,payVal,rankMap,list,render,setView};
render();

/* 07_rolelib：细分岗位库（来自 面试备战/岗位库，构建时生成 data/20_rolelib.js） */
const RG={buy:'买方资管',bank:'银行与央企金融',broker:'券商与股权投资',infra:'基础设施·交易所·协会·监管'};
const RL={g:'all',q:'',city:'all',sort:'idx',open:null};
function rlScore(r){const w=(r.wlb||{}).score||3,gr=(r.growth||{}).score||3;return w+gr}
function rlSalary(r){const s=(r.salary||{}).range||'';const m=s.match(/(\d+)\s*[–\-~到至]\s*(\d+)/);return m?(+m[1]+ +m[2])/2:m?(+m[1]):0}
function rlList(){
 const q=RL.q.trim().toLowerCase();
 return ROLES.filter(r=>(RL.g==='all'||r.group===RL.g)&&(RL.city==='all'||(r.cities||[]).includes(RL.city))&&(!q||(r.role+r.org_type+JSON.stringify(r.sample_orgs||[])+r.work).toLowerCase().includes(q)))
  .sort((a,b)=>RL.sort==='sal'?rlSalary(b)-rlSalary(a):RL.sort==='q'?qCount2(b.id)-qCount2(a.id):rlScore(b)-rlScore(a));
}
function qCount2(id){const r=ROLES.find(x=>x.id===id);return r&&r.qn||0}
function rlCard(r){
 const w=r.wlb||{},g=r.growth||{},s=r.salary||{};
 const row=(k,v)=>`<tr><td><b>${k}</b></td><td>${v||'—'}</td></tr>`;
 const days=(r.typical_day||[]).map(x=>`<li>${esc(x)}</li>`).join('');
 const srcs=(r.src||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.t||x.url)}</a>`).join('；');
 return `<div class="panel" style="margin:10px 0"><div class="table"><table><tbody>${row('工作内容',esc(r.work))}${row('一天',days?`<ul style="margin:4px 0 0 18px">${days}</ul>`:'')}${row('WLB',`[${w.score||'-'}/5] ${esc(w.text||'')} <span class="ev">${esc(w.grade||'')}</span>`)}${row('成长',`[${g.score||'-'}/5] ${esc(g.text||'')}`)}${row('薪资',`${esc(s.range||'')}　<span class="small">${esc(s.basis||'')}</span> <span class="ev">${esc(s.grade||'')}</span>`)}${row('对口实习',esc(r.intern_fit))}${row('要求',esc(r.requirements))}${row('流程与淘汰点',esc(r.process))}${row('出口',esc(r.exit))}${row('批次与HC',esc(r.batches))}${row('证书',esc(r.certs))}${row('城市',esc((r.cities||[]).join('、')))}${row('样本机构',esc((r.sample_orgs||[]).join('、')))}${row('来源',srcs)}</tbody></table></div></div>`;
}
function viewRoleLib(){
 const rows=rlList();
 const chips=[{id:'all',n:'全部'}].concat(Object.keys(RG).map(k=>({id:k,n:RG[k]})))
  .map(k=>`<button class="chipb ${RL.g===k.id?'on':''}" data-rg="${k.id}">${k.n}<i>${k.id==='all'?ROLES.length:ROLES.filter(r=>r.group===k.id).length}</i></button>`).join('');
 const cities=[...new Set(ROLES.flatMap(r=>r.cities||[]))];
 const body=rows.map(r=>{
  const w=r.wlb||{},g=r.growth||{},s=r.salary||{};
  return `<tr><td><span class="small">${esc(r.org_type)}</span><br><b>${esc(r.role)}</b></td>
<td class="wrap">${esc(short(r.work,80))}</td>
<td>${w.score||'-'}/5</td><td>${g.score||'-'}/5</td>
<td class="wrap">${esc(short(s.range||'未核实',30))} <span class="ev">${esc(s.grade||'')}</span></td>
<td>${qCount2(r.id)||'—'}</td>
<td><button class="btn small ${RL.open===r.id?'teal':''}" data-ro="${esc(r.id)}">${RL.open===r.id?'收起':'详情'}</button></td></tr>`
   +(RL.open===r.id?`<tr><td colspan="7" style="padding:0">${rlCard(r)}</td></tr>`:'')
 }).join('');
 $('#view-rolelib').innerHTML=`<div class="head"><div><h3>细分岗位库</h3><p>46 个细分岗位的岗位卡：工作内容、节奏、成长、薪资区间（带证据等级）、对口实习、要求、招聘流程与淘汰点、出口、批次与 HC、证书与城市。与训练台的「面试对答」共用同一套岗位 id，可按岗位看对应的 12 道题。</p></div></div>
 <div class="callout teal"><b>读法：</b>薪资只给区间并标证据等级——E1/E2 来自公告、年报或权威报道，E3 是二手传闻；没查到的写“未核实”，不估算。右边“题量”是该岗位在训练台里的面试题数。</div>
 <div class="chips">${chips}</div>
 <div class="panel" style="margin-top:12px"><div class="filters">
  <div class="field"><label>关键词（岗位/机构/职责）</label><input id="rq" value="${esc(RL.q)}" placeholder="固收、投行、清算、风控…"></div>
  <div class="field"><label>城市</label><select id="rc"><option value="all">全部</option>${cities.map(c=>`<option value="${esc(c)}" ${RL.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="field"><label>排序</label><select id="rs"><option value="idx" ${RL.sort==='idx'?'selected':''}>节奏×成长</option><option value="sal" ${RL.sort==='sal'?'selected':''}>薪资区间中枢</option><option value="q" ${RL.sort==='q'?'selected':''}>题量</option></select></div>
 </div></div>
 <div class="section">共 ${rows.length} 个岗位 · 全部为判断分或区间，证据列已标注</div>
 <div class="panel" style="padding:0"><div class="table"><table class="wide mid"><thead><tr><th>岗位</th><th>工作内容</th><th>节奏</th><th>成长</th><th>薪资</th><th>题量</th><th></th></tr></thead><tbody>${body||'<tr><td colspan="7" class="empty">没有匹配的岗位。</td></tr>'}</tbody></table></div></div>`;
 $$('[data-rg]').forEach(b=>b.onclick=()=>{RL.g=b.dataset.rg;render()});
 $$('[data-ro]').forEach(b=>b.onclick=()=>{RL.open=RL.open===b.dataset.ro?null:b.dataset.ro;render()});
 const q=$('#rq');q.oninput=()=>{RL.q=q.value;const p=q.selectionStart;render();const n=$('#rq');n.focus();n.setSelectionRange(p,p)};
 $('#rc').onchange=e=>{RL.city=e.target.value;render()};
 $('#rs').onchange=e=>{RL.sort=e.target.value;render()};
}

})();
</script>
</body>
</html>
